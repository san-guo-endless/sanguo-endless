<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国 · 无尽战纪</title>
<style>
/* =========================================================
   三国 · 无尽战纪 —— 样式
   ========================================================= */

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0f16;
  --panel: #191b25;
  --panel2: #222534;
  --line: #333952;
  --gold: #e6c07b;
  --red: #d9534f;
  --green: #5cb85c;
  --text: #d8dbe8;
  --dim: #7b819c;
}
body {
  background: radial-gradient(circle at 50% 0%, #1b1d2b 0%, #0b0c12 70%);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 80px;
  user-select: none;
}
.hidden { display: none !important; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; gap: 18px; align-items: center;
  flex-wrap: wrap;              /* 允许换行：手机上 11 个按钮不再把整页撑宽 */
  max-width: 100%;              /* 用 % 而不是 100vw，避免桌面端滚动条带来的横向溢出 */
  padding: 12px 20px;
  background: linear-gradient(180deg, #1c1f2d, #14161f);
  border-bottom: 2px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.topbar .stat { font-size: 13px; color: var(--dim); }
.topbar .stat b { color: var(--gold); font-size: 18px; margin-left: 4px; }
.topbar .title { margin-left: auto; font-size: 13px; letter-spacing: 3px; color: #4a5070; }

/* 战功：顶栏底边的 3px 经验线
   —— 用绝对定位贴在底边，**不占任何额外宽高**，手机上不会再撑宽页面 */
.topbar::after {
  content: '';
  position: absolute; left: 0; bottom: 0;
  height: 3px; width: var(--exp-pct, 0%);
  background: linear-gradient(90deg, #8a6d10, var(--gold));
  box-shadow: 0 0 10px #e6c07b88;
  transition: width .8s cubic-bezier(.2, .8, .2, 1);
  pointer-events: none;
}
.lv-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  background: #e6c07b18; border: 1px solid #e6c07b55;
  color: var(--gold); letter-spacing: 1px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  font-family: inherit; cursor: pointer; transition: background .15s;
}
.lv-chip:hover { background: #e6c07b33; border-color: var(--gold); }

/* ---------- 战功卡片（点 Lv 徽章） ---------- */
.lv-card { text-align: center; padding: 4px 0 10px; }
.lv-big { font-size: 42px; font-weight: bold; color: var(--gold); line-height: 1.1; letter-spacing: 2px; }
.lv-title { font-size: 20px; color: #e6c07b; letter-spacing: 5px; margin-top: 2px; }
.lv-bar { height: 10px; border-radius: 6px; background: #00000066; margin: 16px 0 8px; overflow: hidden; }
.lv-bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #8a6d10, var(--gold));
  box-shadow: 0 0 12px #e6c07b88;
}
.lv-num { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.lv-next { font-size: 13px; color: #c8cee0; margin-top: 10px; }
.lv-next b { color: var(--gold); }
.lv-how {
  font-size: 12px; line-height: 1.9; color: var(--dim);
  background: #ffffff06; border: 1px dashed #ffffff1a; border-radius: 10px;
  padding: 10px 12px; margin-top: 14px;
}
.lv-how b { color: #c8cee0; }

/* ---------- 成长诊断（结算面板） ---------- */
.grow-box {
  margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px;
  background: #ffffff07; border: 1px solid var(--line);
  font-size: 12px; line-height: 1.8; color: #9aa2c0;
}
.grow-box.warn { background: #d9534f0f; border-color: #d9534f44; }
.grow-title { font-size: 11px; letter-spacing: 2px; color: var(--dim); margin-bottom: 4px; }
.grow-line b { color: var(--gold); }
.grow-line b.gok { color: #5cb85c; }
.grow-line b.gbad { color: #d9534f; }
.grow-tip { margin-top: 4px; font-size: 11px; color: #c8cee0; }
.grow-tip b { color: #ffb3a7; }

/* ---------- 晋升动画 ---------- */
.lv-fx {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0;
}
.lv-fx.show { animation: lvFxShow 1.05s ease-out; }
@keyframes lvFxShow {
  0%   { opacity: 0; }
  18%  { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}
.lv-fx-inner { text-align: center; }
.lv-fx-lv { font-size: 17px; color: #e6c07b; letter-spacing: 5px; }
.lv-fx-title {
  font-size: 44px; font-weight: bold; color: #fff; letter-spacing: 10px;
  text-shadow: 0 0 26px #e6c07b, 0 0 64px #e6c07baa;
  animation: lvFxPop .5s cubic-bezier(.2, 1.6, .4, 1);
}
@keyframes lvFxPop {
  0%   { transform: scale(.6); filter: blur(8px); opacity: 0; }
  60%  { transform: scale(1.12); }
  100% { transform: scale(1); filter: blur(0); opacity: 1; }
}
.lv-fx-sub { font-size: 12px; color: #7ee07e; margin-top: 12px; letter-spacing: 3px; }
@media (max-width: 640px) {
  .lv-fx-title { font-size: 32px; letter-spacing: 6px; }
}

/* ---------- 致谢 ---------- */
.cr-author { text-align: center; padding: 10px 0 14px; }
.cr-role { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
.cr-name {
  font-size: 26px; font-weight: bold; color: var(--gold);
  letter-spacing: 4px; margin-top: 4px;
  text-shadow: 0 0 18px #e6c07b66;
}
.cr-row {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: #ffffff06; margin-bottom: 6px;
}
.cr-row b { font-size: 14px; color: #fff; flex: none; }
.cr-row span { font-size: 11px; color: var(--dim); }

/* 次要署名：程序编写（比作者名暗一档，但依然好认） */
.cr-sub {
  display: flex; align-items: baseline; justify-content: center; gap: 10px;
  padding: 8px 0 12px;
}
.cr-sub-role { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
.cr-sub-id { font-size: 15px; color: #c8cee0; letter-spacing: 1px; }

.cr-extra {
  margin-top: 10px; text-align: center;
  font-size: 11.5px; color: #8f96b0; font-style: italic;
}
.cr-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cr-chip {
  font-size: 12px; padding: 5px 10px; border-radius: 20px;
  background: #e6c07b12; border: 1px solid #e6c07b33; color: var(--gold);
}
.cr-empty {
  font-size: 12px; color: var(--dim); text-align: center;
  padding: 14px 0; border: 1px dashed #ffffff1a; border-radius: 8px;
}
.cr-foot {
  margin-top: 16px; padding: 10px 12px; border-radius: 10px;
  background: #ffffff06; border: 1px solid var(--line);
  font-size: 12px; line-height: 1.9; color: #c8cee0; text-align: center;
}
.cr-tip { margin-top: 8px; font-size: 11px; color: var(--dim); text-align: center; }

/* ---------- 成就列表 ---------- */
.ach-list { max-height: 52vh; overflow-y: auto; margin-top: 4px; padding-right: 2px; }
.ach-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 8px;
  background: #ffffff06; margin-bottom: 6px; opacity: .5;
}
.ach-row.on { opacity: 1; background: #e6c07b12; border: 1px solid #e6c07b33; }
.ach-ico { font-size: 15px; flex: none; width: 20px; text-align: center; }
.ach-info { flex: 1; min-width: 0; }
.ach-info b { font-size: 13px; color: #fff; }
.ach-info span { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
.ach-num { flex: none; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.ach-row.on .ach-num { color: var(--gold); }
/* 结算面板里的战功条 */
.exp-settle {
  margin: 14px 0 4px; padding: 9px 12px; border-radius: 10px;
  background: #e6c07b0f; border: 1px solid #e6c07b33;
  font-size: 12.5px; line-height: 1.85; color: #c8cee0; text-align: center;
}
.exp-settle b { color: var(--gold); }
.exp-settle .lv-up { color: #7ee07e; }

/* ---------- 手机端顶栏：换行 + 收窄（顶栏一旦撑宽，整页会被浏览器缩小，下面只剩一半） ---------- */
@media (max-width: 640px) {
  .topbar { gap: 7px 9px; padding: 8px 10px; }
  .topbar .stat { font-size: 12px; }
  .topbar .stat b { font-size: 15px; }
  .topbar .help-btn { margin-left: 0; padding: 4px 9px; font-size: 11px; }
  .topbar .title { display: none; }   /* 游戏名开始界面已有，小屏上让位给功能按钮 */
}
@media (max-width: 380px) {
  .topbar { gap: 6px 7px; padding: 7px 8px; }
  .topbar .help-btn { padding: 3px 7px; font-size: 10px; }
  .topbar .stat b { font-size: 14px; }
}

/* ---------- 敌人 ---------- */
.enemy {
  margin: 16px auto; max-width: 880px;
  background: linear-gradient(180deg, #2a1620, #1a1017);
  border: 2px solid #5a2b33; border-radius: 12px;
  padding: 14px 20px; position: relative; overflow: hidden;
}
.enemy.boss { border-color: #a8791f; box-shadow: 0 0 26px #a8791f44; }
.enemy-top { display: flex; align-items: baseline; gap: 12px; }
.enemy-name { font-size: 20px; color: #ffb3a7; letter-spacing: 2px; }
.enemy-name.boss { color: var(--gold); }
.enemy-tag {
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: #ffffff14; color: var(--dim);
}
.hpbar { height: 14px; background: #00000066; border-radius: 8px; margin-top: 10px; overflow: hidden; }
.hpbar > i {
  display: block; height: 100%; width: 100%;
  background: linear-gradient(90deg, #d9534f, #ff8e6b);
  transition: width .25s ease;
}
.enemy-hpnum { text-align: right; font-size: 14px; color: #ffb3a7; margin-top: 4px; font-variant-numeric: tabular-nums; }

/* ---------- 通用区块 ---------- */
main { max-width: 880px; width: 100%; margin: 0 auto; padding: 0 16px; }
/* 手机端：留白收窄一点，内容更宽 */
@media (max-width: 640px) {
  main { padding: 0 10px; }
  .enemy { width: 100%; }
}
.row-label {
  font-size: 12px; color: var(--dim); letter-spacing: 1px;
  margin: 14px 0 8px; display: flex; align-items: center; gap: 8px;
}
.row-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
/* 标题行右侧的小按钮（全部下阵 / 全部卸下） */
.row-label .mini-btn { order: 1; }
.row-label::after { order: 0; }

/* 战斗中「出击」按钮变成「跳过」时的配色 */
#btnAttack.skip {
  background: linear-gradient(160deg, #4a7fd4, #2f5da8);
  border-color: #6fa0e8;
}

/* ---------- 卡槽 ---------- */
.slot-rows { display: flex; flex-direction: column; gap: 10px; }
.slot-row {
  display: flex; gap: 10px; flex-wrap: nowrap;
  overflow-x: auto; overflow-y: hidden;
  padding-bottom: 6px; min-height: 132px;
  scrollbar-width: thin;
}
.slot-row::-webkit-scrollbar { height: 6px; }
.slot-row::-webkit-scrollbar-thumb { background: #333952; border-radius: 3px; }
.slot-row .slot { flex: 0 0 auto; }
.slot {
  width: 118px; min-height: 128px; border-radius: 10px;
  border: 2px dashed var(--line); background: #ffffff05;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #454b66; font-size: 12px; position: relative;
}
.slot.filled { border-style: solid; }
.slot .idx { position: absolute; top: 4px; left: 7px; font-size: 10px; color: var(--dim); }

/* ---------- 出战序列：大卡 / 紧凑 两种视图（手机端才有切换按钮） ----------
   大卡：118px 原尺寸，字大好认，一行放不下就横向滑（默认）
   紧凑：按屏宽自动算成 6 张一排，横向滑动消失，靠换行塞下全部信息
   切换靠 #slotRow 上的 .compact 类，不重建 DOM、不动 JS 渲染逻辑 */
#btnSlotView { display: none; }
@media (max-width: 640px) {
  #btnSlotView { display: inline-block; }

  #slotRow.compact .slot-row { gap: 6px; padding-bottom: 2px; min-height: 0; }
  #slotRow.compact .slot {
    width: calc((100% - 30px) / 6);   /* 6 张 + 5 个 6px 间距 */
    min-width: 0; min-height: 128px;
    border-width: 1.5px; border-radius: 7px;
  }
  #slotRow.compact .slot .idx { font-size: 8px; top: 2px; left: 3px; }
  #slotRow.compact .slot .card {
    width: 100%; padding: 4px 3px;
    border-radius: 6px; border-left-width: 3px;
  }
  #slotRow.compact .slot .card-name { font-size: 10px; letter-spacing: 0; line-height: 1.25; }
  #slotRow.compact .slot .card-name .star { font-size: 8px; margin-left: 0; }
  #slotRow.compact .slot .card-type { font-size: 8.5px; margin: 1px 0 3px; }
  #slotRow.compact .slot .card-stats { gap: 3px; font-size: 9px; flex-wrap: wrap; }
  #slotRow.compact .slot .card-stats b { font-size: 8px; margin-right: 1px; }
  #slotRow.compact .slot .card-stats .statval { font-size: 12px; }
  #slotRow.compact .slot .card-trait {
    margin-top: 3px; font-size: 8.5px; line-height: 1.28;
    min-height: 0; padding-top: 3px;
  }
  #slotRow.compact .slot .card-wep { font-size: 8px; margin-top: 2px; }
  /* 4 个按钮（← → 装 ✕）在窄卡里排不下，改成 2×2 */
  #slotRow.compact .slot .card-ops { gap: 2px; margin-top: 3px; flex-wrap: wrap; }
  #slotRow.compact .slot .card-ops .mini {
    flex: 1 1 calc(50% - 1px);
    font-size: 9px; padding: 2px 0; line-height: 1.15;
  }
}


/* ---------- 点选交换 ---------- */
.slot.sel {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px #ffd47955, 0 0 18px #ffb34755;
  background: #ffd4790f;
}
.slot.sel .idx { color: var(--gold); font-weight: bold; }
#slotRow.picking .slot.filled:not(.sel) { border-color: #ffd47988; cursor: pointer; }
#slotRow.picking .slot.sel .card { opacity: .55; }

/* ---------- 卡牌 ---------- */
.card {
  width: 112px; border-radius: 9px; padding: 8px 7px;
  background: linear-gradient(160deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); position: relative;
  transition: transform .12s, box-shadow .12s;
}
.card.small { width: 100px; padding: 7px 6px; }
.card:hover { transform: translateY(-3px); }
.card.pickable { cursor: pointer; }
.card.pickable:hover { box-shadow: 0 6px 18px #0008; }
.card.camp-shu { border-left: 4px solid #e05555; }
.card.camp-wei { border-left: 4px solid #4a7fd4; }
.card.camp-wu  { border-left: 4px solid #3fa86a; }
.card-name { font-size: 14px; color: #fff; letter-spacing: 1px; }
.card-name .star { color: var(--gold); font-size: 11px; margin-left: 2px; }
.card-type { font-size: 10px; color: var(--dim); margin: 2px 0 6px; }
.card-stats { display: flex; gap: 12px; font-size: 13px; font-variant-numeric: tabular-nums; align-items: baseline; }
.card-stats .a { color: #ff9d7a; }
.card-stats .h { color: #7ad0ff; }
.card-stats b { font-size: 10px; color: var(--dim); margin-right: 3px; font-weight: normal; }
.card-stats .statval {
  font-style: normal; font-size: 17px; font-weight: bold;
  display: inline-block; transform-origin: center;
}
.card-stats .statval.bump { animation: statBump .34s cubic-bezier(.2, 1.6, .5, 1); }
@keyframes statBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.6); color: #fff; text-shadow: 0 0 14px currentColor; }
  100% { transform: scale(1); }
}
.card.in-battle .plus { display: none; }
.card.active {
  box-shadow: 0 0 0 2px #ffd47988, 0 0 26px #ffd47955;
  transform: translateY(-4px); z-index: 5;
}
.card.multiplied { box-shadow: 0 0 0 3px #ffb347aa, 0 0 36px #ff8a0066; }
.card-trait {
  margin-top: 6px; font-size: 10px; line-height: 1.4; color: #b6a07a;
  border-top: 1px solid #ffffff10; padding-top: 4px; min-height: 26px;
}
.card-wep { font-size: 10px; color: #7ad0ff; margin-top: 3px; }
.card-ops { display: flex; gap: 3px; margin-top: 6px; }
.mini {
  flex: 1; font-size: 11px; padding: 3px 0; cursor: pointer;
  background: #ffffff10; border: 1px solid #ffffff18; color: var(--text);
  border-radius: 4px; font-family: inherit;
}
.mini:hover { background: #ffffff22; }
.mini.danger:hover { background: #d9534f55; }

/* ---------- 出击条 ---------- */
.attack-bar {
  display: flex; flex-direction: column; align-items: center;
  gap: 10px; margin: 14px 0 4px;
}
.attack-bar .btn { margin-left: 0; min-width: 260px; max-width: 100%; }
.btn-row .btn { margin-left: 0; }
.atk-preview {
  display: none; text-align: center; font-size: 13px; color: var(--dim);
  font-variant-numeric: tabular-nums; line-height: 1.7; max-width: 100%;
}
.atk-preview b { color: var(--gold); font-size: 22px; margin-left: 4px; }
.atk-preview .ok { color: #5cb85c; font-size: 12px; }
.atk-preview .no { color: #d9534f; font-size: 12px; }
@media (max-width: 460px) {
  .attack-bar .btn { min-width: 0; width: 100%; }
}
.help-btn.on {
  color: var(--gold); border-color: var(--gold); background: #e6c07b1a;
}
.preview { font-size: 13px; color: var(--dim); }
.preview b { color: var(--gold); font-size: 22px; font-variant-numeric: tabular-nums; }
.preview .warn { color: var(--red); }
.btn {
  margin-left: auto; padding: 11px 34px; font-size: 16px; letter-spacing: 4px;
  font-family: inherit; cursor: pointer; border-radius: 8px; border: none;
  background: linear-gradient(180deg, #c9a227, #8a6d10); color: #1a1408;
  font-weight: bold; transition: filter .15s;
}
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .35; cursor: not-allowed; filter: none; }

/* ---------- 牌库 / 武器 / 军令 ---------- */
.hand-row, .weapon-row, .cmd-row { display: flex; gap: 9px; flex-wrap: wrap; }
.weapon-chip {
  font-size: 11px; padding: 6px 10px; border-radius: 6px;
  background: #1d2a35; border: 1px solid #2f4557; color: #8fd0ee;
}
.weapon-chip.used { opacity: .35; }
.cmd-chip {
  font-size: 11px; padding: 6px 10px; border-radius: 6px; max-width: 210px;
  background: #241d2e; border: 1px solid #4a3a5e; color: #c9a8e8;
  border-left: 3px solid #6a5a8a; transition: all .18s;
}
.cmd-chip b { color: #e6c07b; display: block; font-size: 12px; margin-bottom: 2px; }
.cmd-chip i { display: block; font-style: normal; color: #7b819c; font-size: 10px; line-height: 1.45; }
.cmd-chip.cat-team { border-left-color: #4a7fd4; }
.cmd-chip.cat-pos { border-left-color: #e6c07b; }
.cmd-chip.cat-enemy { border-left-color: #d9534f; }
.cmd-chip.cat-scale { border-left-color: #a06fe0; }
.cmd-chip.firing {
  box-shadow: 0 0 0 2px #c9a8e8, 0 0 24px #a06fe099;
  transform: translateY(-3px) scale(1.05);
  z-index: 10;
}
.empty-hint { font-size: 12px; color: #454b66; }

/* ---------- 弹窗 ---------- */
.overlay {
  position: fixed; inset: 0; background: #000000c9; z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
  padding: 26px; max-width: 640px; width: 100%; max-height: 86vh; overflow-y: auto;
  box-shadow: 0 20px 60px #000a;
}
.modal h2 { font-size: 20px; color: var(--gold); letter-spacing: 3px; margin-bottom: 6px; text-align: center; }
.modal .sub { font-size: 12px; color: var(--dim); text-align: center; margin-bottom: 18px; }
.modal-cards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.modal .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
.btn.ghost {
  background: #ffffff12; color: var(--text); margin-left: 0;
  padding: 9px 24px; font-size: 14px; letter-spacing: 2px;
}
.shop-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px;
  background: #ffffff06;
}
.shop-item .info { flex: 1; }
.shop-item .info b { color: #c9a8e8; font-size: 13px; }
.shop-item .info span { display: block; font-size: 11px; color: var(--dim); margin-top: 3px; }
.shop-item .price { color: var(--gold); font-size: 14px; }
.shop-item button {
  padding: 5px 14px; font-size: 12px; border-radius: 5px; cursor: pointer;
  border: 1px solid #6a5a2a; background: #3a3018; color: var(--gold); font-family: inherit;
}
.shop-item button:disabled { opacity: .3; cursor: not-allowed; }
/* 招募行的「蜀/魏/吴」三个小按钮：不要被 .mini 的 flex:1 拉宽 */
.shop-item .mini { flex: none; padding: 5px 10px; font-size: 12px; }
.big-num { font-size: 46px; color: var(--gold); text-align: center; margin: 10px 0; font-variant-numeric: tabular-nums; }

/* ---------- 飘字 ---------- */
#floatLayer { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
.float-num {
  position: absolute; font-size: 30px; font-weight: bold; color: #ffd479;
  text-shadow: 0 0 12px #ff9d0066, 0 2px 4px #000; font-variant-numeric: tabular-nums;
  animation: floatUp .95s ease-out forwards;
}
.float-num.zero { color: #6b7280; font-size: 20px; }
@keyframes floatUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  20% { transform: translateY(-14px) scale(1.25); opacity: 1; }
  100% { transform: translateY(-70px) scale(1); opacity: 0; }
}
.card.hit { animation: hitShake .36s cubic-bezier(.36, .07, .19, .97); }
@keyframes hitShake {
  0%   { transform: translateY(0) rotate(0) scale(1); }
  12%  { transform: translateY(-13px) rotate(-2.5deg) scale(1.1);
         box-shadow: 0 0 30px #ffb347cc, 0 0 60px #ff8a0055; }
  32%  { transform: translateY(3px) rotate(2deg) scale(1.02); }
  52%  { transform: translateY(-6px) rotate(-1.2deg) scale(1.04); }
  72%  { transform: translateY(2px) rotate(.6deg) scale(1.01); }
  100% { transform: translateY(0) rotate(0) scale(1); }
}
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: #000000dd; border: 1px solid var(--gold); color: var(--gold);
  padding: 8px 20px; border-radius: 20px; font-size: 13px; z-index: 300;
  animation: toastIn .3s ease;
}
/* 带撤销按钮的提示 */
.toast.action {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px 7px 16px; border-radius: 12px; max-width: 92vw;
}
.toast.action span { flex: 1; line-height: 1.5; }
.toast.action .mini {
  flex: 0 0 auto; padding: 4px 12px; border-radius: 8px;
  color: var(--gold); border-color: #ffd47988; background: #ffd4791a;
  font-size: 12px; white-space: nowrap;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } }

/* ---------- 帮助按钮 ---------- */
.help-btn {
  margin-left: 4px; font-size: 11px; padding: 5px 12px; border-radius: 20px;
  cursor: pointer; background: #ffffff10; border: 1px solid var(--line);
  color: var(--dim); font-family: inherit;
}
.help-btn:hover { color: var(--gold); border-color: var(--gold); }

/* ---------- 音量滑条 ---------- */
.vol-slider {
  width: 76px; height: 4px; margin-left: 2px;
  -webkit-appearance: none; appearance: none;
  background: #333952; border-radius: 2px; outline: none; cursor: pointer;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gold); cursor: pointer;
}
.vol-slider::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--gold); border: none; cursor: pointer;
}
@media (max-width: 760px) { .vol-slider { display: none; } }

/* ---------- 伤害明细 ---------- */
.battle-log {
  margin: 14px 0 2px; border: 1px solid var(--line); border-radius: 10px;
  background: #ffffff07; padding: 10px 12px;
  max-height: 330px; overflow-y: auto;
}
.battle-log:empty { display: none; }
.bl-title { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; }
.log-row {
  padding: 6px 4px; border-radius: 6px;
  font-variant-numeric: tabular-nums;
  opacity: 0; transform: translateX(-8px);
  animation: logIn .28s ease forwards;
}
.log-main { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.log-detail {
  font-size: 10px; color: #7b819c; margin: 4px 0 0 29px;
  line-height: 1.75; word-break: break-word;
}
.log-detail .ev-cmd { color: #c9a8e8; }
.log-detail .ev-wpn { color: #7ad0ff; }
.log-detail .ev-trt { color: #b6a07a; }
.log-detail .ev-mul { color: #ffd479; }
.log-row + .log-row { border-top: 1px dashed #ffffff10; }
.log-row.dim { opacity: .62 !important; transform: none; animation: none; }
@keyframes logIn { to { opacity: 1; transform: translateX(0); } }
.lg-idx { color: #454b66; width: 20px; flex: none; }
.lg-name { color: #fff; width: 44px; flex: none; }
.lg-calc { flex: 1; color: #9aa2c0; min-width: 150px; }
.lg-calc b { color: #d8dbe8; font-weight: normal; }
.lg-calc .add { color: #5cb85c; }
.lg-calc .num { color: #ffd479; font-weight: bold; }
.lg-arm { color: #6b7290; font-size: 11px; flex: none; }
.lg-mult { color: #ff9d7a; font-size: 11px; flex: none; }
.lg-dmg {
  color: var(--gold); font-size: 16px; font-weight: bold;
  width: 54px; text-align: right; flex: none;
}
.bl-total { margin-top: 9px; text-align: right; font-size: 12px; color: var(--dim); }
.bl-total b { color: var(--gold); font-size: 18px; }

/* ---------- 卡面 +x ---------- */
.plus { color: #5cb85c; font-size: 11px; margin-left: 2px; }

/* ---------- 新手引导 ---------- */
.tut-step { font-size: 12px; color: var(--dim); text-align: center; margin-bottom: 14px; letter-spacing: 1px; }
.tut-body { font-size: 14px; line-height: 2; color: var(--text); text-align: center; min-height: 86px; }
.tut-body b { color: var(--gold); }
.tut-dots { display: flex; gap: 7px; justify-content: center; margin-top: 16px; }
.tut-dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffffff26; }
.tut-dots i.on { background: var(--gold); }

/* ---------- 增益飘字 / 军令飞行弹 ---------- */
.float-tag {
  position: absolute; transform: translate(-50%, 0);
  font-size: 12px; font-weight: bold; color: #5cb85c;
  text-shadow: 0 0 8px #000, 0 2px 4px #000;
  white-space: nowrap; pointer-events: none;
  animation: tagUp 1.1s ease-out forwards;
}
@keyframes tagUp {
  0% { opacity: 0; transform: translate(-50%, 8px) scale(.85); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -48px) scale(1); }
}
.fly-dot {
  position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
  border-radius: 50%; background: #c9a8e8;
  box-shadow: 0 0 10px 3px currentColor, 0 0 26px 9px #a06fe077;
  transition: transform .34s cubic-bezier(.4, 0, .7, 1);
  pointer-events: none; z-index: 210;
}

.float-gold {
  position: absolute; transform: translate(-50%, 0);
  font-size: 13px; font-weight: bold; color: #ffd479;
  text-shadow: 0 0 8px #000, 0 2px 4px #000;
  pointer-events: none; white-space: nowrap;
  animation: goldUp .95s ease-out forwards;
}
@keyframes goldUp {
  0%   { opacity: 0; transform: translate(-50%, 6px) scale(.9); }
  20%  { opacity: 1; transform: translate(-50%, 0) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -36px) scale(1); }
}

/* ---------- 武将伤害飞向敌人 ---------- */
.fly-dmg {
  position: absolute;
  font-size: 34px; font-weight: bold; color: #ffd479;
  text-shadow: 0 0 16px #ff9d00aa, 0 3px 8px #000;
  font-variant-numeric: tabular-nums;
  pointer-events: none; white-space: nowrap;
  transform: translate(-50%, 0);
  transition: transform .4s cubic-bezier(.42, 0, .58, 1), opacity .4s ease;
  z-index: 205;
}

.fly-dmg.over {
  color: #c98f6a; font-size: 26px; opacity: .85;
}

/* ---------- 敌人身上的累计伤害数字 ---------- */
.dmg-pop {
  position: absolute; right: 26px; top: 50%;
  transform: translateY(-50%);
  font-size: 30px; font-weight: bold; color: #ffd479;
  text-shadow: 0 0 20px #ff9d00aa, 0 4px 10px #000;
  font-variant-numeric: tabular-nums; line-height: 1;
  pointer-events: none; opacity: 0;
  transition: opacity .18s;
}
.dmg-pop.pop { animation: dmgPop .46s cubic-bezier(.2, 1.7, .5, 1); }
.dmg-pop.kill {
  color: #fff;
  text-shadow: 0 0 30px #ff3b00, 0 0 70px #ff6a00cc, 0 4px 12px #000;
  animation: killBurst .75s cubic-bezier(.2, 1.5, .4, 1);
}
@keyframes killBurst {
  0%   { transform: translateY(-50%) scale(1); }
  22%  { transform: translateY(-50%) scale(2.15); color: #fff; }
  50%  { transform: translateY(-50%) scale(1.8); color: #ffd0a8; }
  100% { transform: translateY(-50%) scale(1); color: #ffb36b; }
}

/* ---------- 击杀特效 ---------- */
body.screen-shake { animation: screenShake .44s ease; }
@keyframes screenShake {
  0%   { transform: translate(0, 0); }
  18%  { transform: translate(-7px, 5px); }
  36%  { transform: translate(6px, -6px); }
  54%  { transform: translate(-5px, 4px); }
  72%  { transform: translate(3px, -3px); }
  100% { transform: translate(0, 0); }
}
#screenFlash {
  position: fixed; inset: 0; pointer-events: none; z-index: 190;
  background: radial-gradient(circle at 50% 26%, #ff8a5a, #ff2a00 42%, transparent 76%);
  opacity: 0; mix-blend-mode: screen;
}
#screenFlash.on { animation: flashIn .48s ease-out; }
@keyframes flashIn {
  0%   { opacity: 0; }
  10%  { opacity: .6; }
  100% { opacity: 0; }
}
.kill-text {
  position: absolute; transform: translate(-50%, -50%) scale(.4) rotate(-8deg);
  font-size: 54px; font-weight: bold; letter-spacing: 12px; color: #fff;
  text-shadow: 0 0 26px #ff3b00, 0 0 60px #ff6a00, 0 4px 14px #000;
  pointer-events: none; white-space: nowrap; opacity: 0;
  animation: killText 1.05s cubic-bezier(.15, 1.6, .3, 1) forwards;
}
@keyframes killText {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.4) rotate(-8deg); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(2deg); }
  32%  { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  72%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -62%) scale(1.1); }
}
@keyframes dmgPop {
  0% { transform: translateY(-50%) scale(1.75); }
  55% { transform: translateY(-50%) scale(.92); }
  100% { transform: translateY(-50%) scale(1); }
}
.dmg-delta {
  position: absolute; transform: translateX(-50%);
  font-size: 13px; font-weight: bold; color: #ffb98a;
  text-shadow: 0 0 8px #000, 0 2px 4px #000;
  pointer-events: none; white-space: nowrap;
  animation: deltaUp .85s ease-out forwards;
}
.dmg-delta.kill { color: #ff6a4a; font-size: 16px; }
@keyframes deltaUp {
  0% { opacity: 0; transform: translate(-50%, 6px) scale(.9); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -34px) scale(1); }
}

/* ---------- 胜利界面：伤害占比 ---------- */
.db-title {
  margin: 18px 0 10px; font-size: 11px; letter-spacing: 2px;
  color: var(--dim); text-align: center;
}
.db-row {
  padding: 7px 10px; border-radius: 7px; margin-bottom: 6px;
  background: #ffffff06; border: 1px solid #ffffff10;
}
.db-row.top {
  background: linear-gradient(90deg, #e6c07b22, #e6c07b08);
  border-color: #e6c07b66;
  box-shadow: 0 0 18px #e6c07b22;
}
.db-line { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.db-rank { color: #454b66; width: 14px; font-size: 11px; }
.db-row.top .db-rank { color: var(--gold); }
.db-name { width: 46px; color: #d8dbe8; }
.db-row.top .db-name { color: var(--gold); font-weight: bold; }
.db-bar {
  flex: 1; height: 8px; background: #ffffff10; border-radius: 4px;
  overflow: hidden; min-width: 60px;
}
.db-bar > i {
  display: block; height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, #6a7fd4, #9bb0ff);
}
.db-row.top .db-bar > i { background: linear-gradient(90deg, #c9a227, #ffd479); }
.db-pct { width: 38px; text-align: right; color: #9aa2c0; font-size: 11px; }
.db-num { width: 62px; text-align: right; color: var(--gold); font-weight: bold; font-size: 14px; }
.db-seg { width: 44px; text-align: right; color: #7b819c; font-size: 11px; }
.db-ev { margin: 5px 0 0 23px; font-size: 10px; color: #6a7090; line-height: 1.6; }

/* ---------- 战斗时固定敌人面板（手机必看） ---------- */
body.battling .enemy {
  position: sticky;
  top: var(--topbar-h, 54px);
  z-index: 40;
}

/* ---------- Boss 出场演出 ---------- */
.boss-intro {
  position: fixed; inset: 0; z-index: 84;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0);
  transition: background .25s ease;
  cursor: pointer;
}
.boss-intro.on { background: rgba(0, 0, 0, .84); }
.boss-intro.fade { background: rgba(0, 0, 0, 0); }
.boss-intro.hidden { display: none; }

.bi-seal {
  font-family: "STKaiti", "KaiTi", "SimSun", serif;
  font-size: 168px; line-height: 1; font-weight: bold;
  color: #ffd479; padding: 4px 30px;
  border: 6px solid #c0392b; border-radius: 14px;
  text-shadow: 0 0 40px #ff3b00, 0 0 90px #ff6a00aa;
  box-shadow: 0 0 0 4px #c0392b55, 0 0 70px #c0392b, inset 0 0 50px #ff3b0033;
  opacity: 0; transform: scale(2.4) rotate(-7deg);
  transition: opacity .18s ease, transform .4s cubic-bezier(.2, 1.5, .4, 1);
}
.boss-intro.on .bi-seal { opacity: 1; transform: scale(1) rotate(-3deg); }
.bi-seal.off { opacity: 0 !important; transform: scale(1.4) rotate(-3deg) !important; }

.bi-sub {
  margin-top: 26px; font-size: 14px; letter-spacing: 3px; color: #c9b28a;
  opacity: 0; transition: opacity .3s ease .25s;
}
.boss-intro.on .bi-sub { opacity: 1; }

.enemy.intro-in { animation: enemyIn .55s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes enemyIn {
  0% { transform: translateY(30px) scale(.94); opacity: .35; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* ---------- 敌人机制提示 ---------- */
.mech-tip {
  position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
  z-index: 95; max-width: 430px; width: calc(100% - 40px);
  background: #2a1620; border: 2px solid #a8791f; border-radius: 12px;
  padding: 14px 16px; box-shadow: 0 14px 44px #000d;
  animation: mechIn .3s ease; cursor: pointer;
}
.mech-tip > b {
  display: block; color: #ffb347; font-size: 13px;
  margin-bottom: 8px; letter-spacing: 1px;
}
.mech-tip > div { font-size: 12px; line-height: 1.85; color: #d0d5e4; }
.mech-tip > div b { color: var(--gold); font-weight: normal; }
.mech-tip .mt-close {
  margin-top: 10px; text-align: right; font-size: 10px; color: #7b819c;
}
@keyframes mechIn { from { opacity: 0; transform: translate(-50%, -12px); } }

/* ---------- 机制手册 ---------- */
.cx-guide {
  padding: 10px 12px; margin-bottom: 8px; border-radius: 8px;
  background: #ffffff06; border: 1px solid #ffffff12;
}
.cg-t { font-size: 13px; color: #ffd479; margin-bottom: 6px; letter-spacing: 1px; }
.cg-d { font-size: 11.5px; line-height: 1.9; color: #b8bfd4; }
.cg-d b { color: var(--gold); font-weight: normal; }
.cg-e {
  margin-top: 7px; padding-left: 9px;
  font-size: 10.5px; line-height: 1.7; color: #7b819c;
  border-left: 2px solid #333952;
}

/* ---------- 敌人机制弹窗 ---------- */
.mech-box {
  background: #2a1620; border: 1px solid #a8791f; border-radius: 10px;
  padding: 14px 16px; margin: 10px 0 4px;
}
.mech-box > b {
  display: block; color: #ffb347; font-size: 13px;
  margin-bottom: 9px; letter-spacing: 1px;
}
.mech-box > div { font-size: 12px; line-height: 1.9; color: #d0d5e4; }
.mech-box > div b { color: var(--gold); font-weight: normal; }

/* ---------- 军令熔铸演出（v0.35 已移除，只保留成功横幅 .fuse-done） ---------- */
/* 原 .fuse-fx / .fx-card / .fx-burst / .fx-result / @keyframes fxBurst 已删除 */

/* ---------- 图鉴 ---------- */
.codex-stats {
  font-size: 11px; color: #7b819c; text-align: center;
  margin-bottom: 12px; line-height: 1.9;
}
.codex-stats b { color: var(--gold); }
.codex-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.codex-tab {
  flex: 1; padding: 7px 0; font-size: 12px; cursor: pointer;
  background: #ffffff08; border: 1px solid #333952; color: #9aa2c0;
  border-radius: 6px; font-family: inherit; transition: all .15s;
}
.codex-tab.on { background: #e6c07b22; border-color: #e6c07b; color: var(--gold); }
.codex-body { max-height: 50vh; overflow-y: auto; padding-right: 4px; }

.cx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.cx-card {
  padding: 8px 9px; border-radius: 8px; background: #ffffff06;
  border: 1px solid #ffffff12; border-left: 3px solid #333952;
}
.cx-card.camp-shu { border-left-color: #e05555; }
.cx-card.camp-wei { border-left-color: #4a7fd4; }
.cx-card.camp-wu { border-left-color: #3fa86a; }
.cx-card.locked { border-left-color: #444a63; }
.cx-name { font-size: 13px; color: #fff; margin-bottom: 3px; }
.cx-card.locked .cx-name { color: #5a6180; letter-spacing: 3px; }
.cx-sub { font-size: 10px; color: #7b819c; margin-bottom: 5px; }
.cx-aw { font-size: 11px; color: #d8dbe8; margin-bottom: 4px; }
.cx-trait { font-size: 10px; color: #b6a07a; line-height: 1.55; }
.cx-cond { font-size: 10px; color: #9aa2c0; line-height: 1.55; margin-bottom: 6px; min-height: 30px; }
.cx-bar { height: 4px; background: #ffffff12; border-radius: 2px; overflow: hidden; }
.cx-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #c9a227, #ffd479); }
.cx-prog { font-size: 9px; color: #7b819c; text-align: right; margin-top: 3px; }

.cx-row {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 8px;
  border-bottom: 1px dashed #ffffff10; font-size: 11px;
}
.cx-row b { color: #d8dbe8; min-width: 78px; font-weight: normal; flex: none; }
.cx-tag {
  font-size: 9px; padding: 1px 6px; border-radius: 8px;
  background: #ffffff10; color: #9aa2c0; flex: none;
}
.cx-desc { color: #8a91ad; line-height: 1.6; }
.cx-group {
  font-size: 10px; color: var(--dim); letter-spacing: 2px;
  margin: 12px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #333952;
}

/* ---------- 更新日志 ---------- */
.cl-list { max-height: 54vh; overflow-y: auto; padding-right: 6px; }
.cl-item {
  padding: 10px 12px; margin-bottom: 8px;
  background: #ffffff05; border-left: 3px solid #333952;
  border-radius: 0 8px 8px 0;
}
.cl-item.latest { border-left-color: var(--gold); background: #e6c07b10; }
.cl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cl-v {
  color: var(--gold); font-weight: bold; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.cl-badge {
  font-size: 10px; padding: 1px 7px; border-radius: 10px;
  background: var(--gold); color: #1a1408;
}
.cl-t { font-size: 11.5px; color: #8a91ad; }
.cl-ul { margin: 0; padding-left: 16px; }
.cl-ul li { font-size: 11.5px; color: #b8bfd4; line-height: 1.9; }

/* ---------- 高亮式新手引导 ---------- */
.tut-shield {
  position: fixed; inset: 0; z-index: 90; background: transparent;
}
.tut-shield.hidden { display: none; }
.tut-spot {
  position: fixed; z-index: 91; pointer-events: none; border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, .74), 0 0 0 2px #e6c07b, 0 0 28px #e6c07b99;
  transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
}
.tut-target {
  position: relative !important;
  z-index: 93 !important;
  filter: brightness(1.18);
}
.tut-pulse {
  position: relative;
  z-index: 94 !important;
  animation: tutPulse 1s ease-in-out infinite;
}
@keyframes tutPulse {
  0%, 100% { box-shadow: 0 0 0 0 #e6c07b00; background: #e6c07b22; color: #ffd479; }
  50% { box-shadow: 0 0 0 4px #e6c07b99, 0 0 18px #e6c07b88; background: #e6c07b55; color: #1a1408; }
}
.tut-tip {
  position: fixed; z-index: 92;
  background: #1b1e2a; border: 2px solid #e6c07b; border-radius: 12px;
  padding: 14px 16px; box-shadow: 0 14px 44px #000d;
  max-height: calc(100vh - 28px); overflow-y: auto;   /* 文字再长也不会把按钮顶出屏幕 */
}
.tut-tip-title { font-size: 14px; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
.tut-tip-body { font-size: 12.5px; line-height: 1.9; color: #c8cee0; }
.tut-tip-body b { color: var(--gold); }
.tut-hint {
  margin-top: 10px; font-size: 12px; color: #7ee07e; text-align: center;
  animation: hintPulse 1.2s ease-in-out infinite;
}
@keyframes hintPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.tut-tip-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.tut-tip-btns .btn { margin-left: 0; padding: 7px 18px; font-size: 13px; letter-spacing: 2px; }
.tut-tip-btns .btn.ghost { padding: 6px 14px; font-size: 12px; }

/* ---------- 三选一的持有提示 ---------- */
.modal-cards .card { width: 142px; }
.opt-wrap { cursor: pointer; border-radius: 12px; transition: box-shadow .15s; }
.opt-wrap.can-up { box-shadow: 0 0 0 2px #5cb85c, 0 0 26px #5cb85c66; }
.reward-hint {
  font-size: 11.5px; line-height: 1.85; color: #9aa2c0;
  background: #ffffff08; border: 1px dashed #ffffff22; border-radius: 8px;
  padding: 8px 12px; margin: 10px 0 16px; text-align: center;
}
.reward-hint b { color: var(--gold); }
.rb {
  margin-top: 6px; padding: 4px 6px; border-radius: 5px;
  font-size: 10px; line-height: 1.6; color: #7b819c;
  background: #ffffff08; border: 1px dashed #ffffff1c;
}
.rb b { display: block; color: var(--gold); font-weight: normal; }
.rb.up {
  background: #5cb85c1a; border: 1px solid #5cb85c66; color: #a8e0a8;
}
.rb.up b { color: #7ee07e; }
.rb.new {
  background: #e6c07b14; border: 1px dashed #e6c07b66; color: #e6c07b;
}
.rb.max { opacity: .5; }

/* ---------- 小按钮 / 军令配置 ---------- */
.mini-btn {
  font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
  background: #ffffff10; border: 1px solid var(--line); color: var(--dim);
  font-family: inherit; transition: all .15s;
}
.mini-btn:hover { color: var(--gold); border-color: var(--gold); }
.shop-item.on-field {
  background: #e6c07b12;
  border-color: #6a5a2a;
  box-shadow: inset 3px 0 0 #e6c07b;
}
.shop-item.on-field .info b { color: #e6c07b; }


/* 熔铸成功横幅（取代原来的震屏 + 合体动画，必须一眼看得清） */
.fuse-done {
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: #7ee07e1a;
  border: 1px solid #7ee07e66;
  box-shadow: inset 3px 0 0 #7ee07e;
  color: #cdead0;
  font-size: 13px;
  line-height: 1.6;
}
.fuse-done b { color: #9df89d; font-size: 15px; letter-spacing: 1px; }
.fuse-done span { display: block; font-size: 11px; color: #9aa2c0; margin-top: 2px; }


/* =========================================================
   开始界面
   ========================================================= */
.start-screen {
  position: fixed; inset: 0; z-index: 80;
  display: flex; align-items: center; justify-content: center;
  padding: 18px 14px; overflow-y: auto;
  background:
    radial-gradient(circle at 50% 16%, #2b2540 0%, #12131b 58%, #0a0b10 100%);
}
.ss-inner { width: 100%; max-width: 520px; text-align: center; }

.ss-title {
  font-size: 28px; letter-spacing: 6px; color: var(--gold);
  text-shadow: 0 0 22px #ffb34766, 0 0 64px #ff6a0030;
  line-height: 1.5;
}
.ss-ver { font-size: 11px; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }
.ss-ver #ssVer {
  cursor: pointer; padding: 2px 8px; border-radius: 6px;
  transition: color .2s, background .2s;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.ss-ver #ssVer:hover { color: #c9d2ea; background: #ffffff10; }

/* ---- 火柴人舞台 ---- */
.ss-stage {
  position: relative;
  display: flex; justify-content: center; align-items: flex-end;
  gap: 4px; margin: 18px 0 6px;
  height: 30vh; min-height: 148px; max-height: 210px;
}
.ss-fig {
  position: relative; height: 100%; width: 32%; max-width: 116px;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  color: #e05555; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.ss-fig[data-camp="xiao"] { color: #5aa9e6; }
.ss-fig[data-camp="mou"]  { color: #c9a8e8; }

.ss-svg { height: calc(100% - 18px); width: auto; max-width: 100%; overflow: visible; }
.ss-svg .body, .ss-svg .acc {
  stroke: currentColor; fill: none;
  stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round;
}
.ss-svg .body circle { fill: currentColor; stroke: none; }
.ss-svg .acc { opacity: .9; }

/* 配件慢速摆动（和身体的跳跃错开，制造"手持感"） */
.ss-svg .acc {
  animation: ssSway 1.9s ease-in-out infinite;
  transform-box: fill-box; transform-origin: 50% 88%;
}
@keyframes ssSway {
  0%, 100% { transform: rotate(-6deg); }
  50%      { transform: rotate(7deg); }
}
.ss-fig[data-camp="meng"] .ss-svg .acc { animation-duration: 1.75s; animation-delay: .18s; }
.ss-fig[data-camp="xiao"] .ss-svg .acc { animation-duration: 2.05s; animation-delay: .42s; }
.ss-fig[data-camp="mou"]  .ss-svg .acc { animation-duration: 2.25s; animation-delay: .68s; }

/* 蹦跳：三人不同节奏 → 永远错拍 */
.ss-svg { animation: ssHop 1.07s cubic-bezier(.25, 1.75, .4, 1) infinite; transform-origin: 50% 96%; }
.ss-fig[data-camp="meng"] .ss-svg { animation-duration: .93s; animation-delay: .00s; }
.ss-fig[data-camp="xiao"] .ss-svg { animation-duration: 1.13s; animation-delay: .26s; }
.ss-fig[data-camp="mou"]  .ss-svg { animation-duration: 1.27s; animation-delay: .53s; }
@keyframes ssHop {
  0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
  26%      { transform: translateY(-13px) rotate(-3deg) scaleY(1.05); }
  46%      { transform: translateY(0) rotate(2.5deg) scaleY(.92); }
  62%      { transform: translateY(-3px) rotate(-1deg) scaleY(1); }
}

/* 点火柴人 → 暴跳两下 */
.ss-fig.excite .ss-svg { animation: ssHopFast .34s cubic-bezier(.25, 1.9, .4, 1) 2; }
@keyframes ssHopFast {
  0%, 100% { transform: translateY(0) scaleY(1) rotate(0deg); }
  38%      { transform: translateY(-24px) scaleY(1.10) rotate(-7deg); }
  62%      { transform: translateY(0) scaleY(.86) rotate(6deg); }
}

.ss-name { font-size: 11px; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }

/* 头顶飘字 */
.ss-pop {
  position: absolute; top: 4px; left: 50%;
  font-size: 12px; font-weight: bold; white-space: nowrap;
  color: currentColor; opacity: 0; pointer-events: none;
  text-shadow: 0 0 10px currentColor;
}
.ss-pop.go { animation: ssPop .95s ease-out forwards; }
@keyframes ssPop {
  0%   { opacity: 0; transform: translate(-50%, 8px) scale(.7); }
  22%  { opacity: 1; transform: translate(-50%, -8px) scale(1.18); }
  70%  { opacity: 1; transform: translate(-50%, -26px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -42px) scale(.95); }
}

/* ---- 按钮 ---- */
.ss-btns { display: flex; flex-direction: column; gap: 9px; align-items: center; margin-top: 8px; }
/* .btn 默认 margin-left: auto（给出击按钮右对齐用的），开始界面必须重置，否则「开始游戏」会被推到右边 */
.ss-btns .btn { margin-left: 0; }
.ss-main {
  width: 100%; max-width: 300px; font-size: 16px; letter-spacing: 5px;
  padding: 13px 0;
  animation: ssBreath 2.6s ease-in-out infinite;
}
@keyframes ssBreath {
  0%, 100% { box-shadow: 0 0 0 rgba(255, 179, 71, 0); }
  50%      { box-shadow: 0 0 22px rgba(255, 179, 71, .55); }
}
.ss-main:hover { animation: none; box-shadow: 0 0 26px rgba(255, 179, 71, .7); }
.ss-cont { width: 100%; max-width: 300px; font-size: 13px; }
/* 演武场：比小按钮大得多，但用冷色区分"这不是主线" */
#ssSandbox {
  border: 1px solid #5aa9e655;
  color: #a9c8e6;
  letter-spacing: 3px;
}
#ssSandbox:hover { border-color: #5aa9e6aa; color: #cfe3f7; }
.ss-hint {
  margin-top: 12px; font-size: 12px; color: #9aa2c0; letter-spacing: 1px;
  animation: hintPulse 1.6s ease-in-out infinite;
}

.ss-sub {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  margin-top: 14px;
}
.ss-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: #ff5c5c; margin-left: 3px; vertical-align: top;
  box-shadow: 0 0 7px #ff5c5c;
  animation: hintPulse 1.2s ease-in-out infinite;
}
.ss-tip { margin-top: 16px; font-size: 11px; color: #565d78; letter-spacing: 1px; min-height: 16px; }

/* 公式演示的「= 30」 */
.ss-calc {
  position: absolute; left: 50%; top: 44%;
  transform: translate(-50%, -50%) scale(.8);
  font-size: 22px; font-weight: bold; letter-spacing: 2px;
  color: var(--gold); text-shadow: 0 0 18px #ffb347aa, 0 0 44px #ff6a0055;
  opacity: 0; pointer-events: none; white-space: nowrap;
}
.ss-calc.go { animation: ssCalc 1.7s ease-out forwards; }
@keyframes ssCalc {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
  18%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18); }
  68%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
}


/* 收起弹窗时，出击按钮变成「回去」—— 金色高亮，一眼看到 */
#btnAttack.pending {
  background: linear-gradient(180deg, #ffd479, #c9941f);
  color: #1a1408;
  box-shadow: 0 0 20px #ffb34788;
}

/* ---------- 演武场配置面板 ---------- */
.sb-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.sb-row.sb-wrap { gap: 5px; }
.sb-lb { font-size: 11px; color: var(--dim); min-width: 28px; letter-spacing: 1px; }
.sb-lb.camp-shu { color: #e05555; }
.sb-lb.camp-wei { color: #4a7fd4; }
.sb-lb.camp-wu  { color: #3fa86a; }
.mini-btn.on { color: #1a1408; background: #c9a227; border-color: #e6c07b; }

/* ---------- 日志双栏 ---------- */
.log-tabs { display: flex; gap: 8px; justify-content: center; margin: 6px 0 16px; }
.log-tab {
  padding: 7px 20px; border-radius: 8px; font-family: inherit; font-size: 13px;
  background: #ffffff10; border: 1px solid var(--line); color: var(--dim); cursor: pointer;
  transition: all .15s;
}
.log-tab:hover { color: var(--text); border-color: #5a6178; }
.log-tab.on { background: #c9a227; border-color: #e6c07b; color: #1a1408; font-weight: bold; }

/* ---------- 测试日志（名人堂） ---------- */
.hof-head { text-align: center; font-size: 14px; color: var(--gold); letter-spacing: 2px; }
.hof-head span { display: block; font-size: 11px; color: var(--dim); letter-spacing: 0; margin-top: 5px; line-height: 1.6; }
.hof-list { margin: 14px 0 6px; }
.hof-row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  padding: 9px 11px; border-radius: 8px; margin-bottom: 7px;
  background: #ffffff06; border-left: 3px solid #6a5a8a; font-size: 12px;
}
.hof-row.todo { opacity: .5; border-left-color: #3a4055; }
.hof-camp { font-size: 11px; min-width: 13px; }
.hof-build { font-size: 13px; color: var(--text); }
.hof-dmg { color: var(--gold); font-weight: bold; font-variant-numeric: tabular-nums; }
.hof-wave { color: var(--dim); }
.hof-ver { color: #565d78; font-size: 10px; }
.hof-note { width: 100%; color: var(--dim); font-size: 11px; line-height: 1.5; }
.hof-mine {
  text-align: center; font-size: 12px; color: #9aa2c0;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
}
.hof-mine b { color: var(--gold); }
.hof-tip { text-align: center; font-size: 10px; color: #565d78; margin-top: 8px; line-height: 1.6; }

/* 弹窗里的金币条 */
.gold-bar {
  text-align: center; font-size: 12px; color: var(--dim);
  letter-spacing: 1px; margin: -2px 0 12px;
}
.gold-bar b {
  color: var(--gold); font-size: 20px; font-variant-numeric: tabular-nums;
  margin-left: 5px; vertical-align: -2px;
  text-shadow: 0 0 12px #ffb34744;
}



</style>
</head>
<body>

<!-- ============ 开始界面 ============ -->
<div class="start-screen" id="startScreen">
  <div class="ss-inner">
    <div class="ss-title">三国 · 无尽战纪</div>
    <div class="ss-ver"><span id="ssVer"></span></div>

    <div class="ss-stage">
      <!-- 猛将：大刀 -->
      <div class="ss-fig" data-camp="meng">
        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>

        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>
            <line x1="30" y1="24" x2="30" y2="56"/>
            <line x1="30" y1="33" x2="13" y2="46"/>
            <line x1="30" y1="33" x2="47" y2="46"/>
            <line x1="30" y1="56" x2="17" y2="84"/>
            <line x1="30" y1="56" x2="43" y2="84"/>

            <path d="M13 28 Q2 46 13 64"/>

      <!-- 谋士：羽扇 + 纶巾 -->

        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>
            <line x1="30" y1="24" x2="30" y2="56"/>
            <line x1="30" y1="33" x2="13" y2="46"/>
            <line x1="30" y1="33" x2="47" y2="46"/>
            <line x1="30" y1="56" x2="17" y2="84"/>
            <line x1="30" y1="56" x2="43" y2="84"/>
          </g>
          <g class="acc">
            <path d="M30 6 Q25 -1 21 3"/>

      <button class="btn ghost ss-cont hidden" id="btnResume">继续上次（第 <b id="ssWave">1</b> 波）</button>
      <button class="btn ghost ss-cont" id="ssSandbox">🧪 演 武 场</button>

    <div class="ss-sub">

</div>

</section>

<main>
  <div class="row-label">出战序列（点牌库上阵 · 点牌面换位 · ← → 挪一格）
    <button class="mini-btn" id="btnSlotView">🔍 紧凑</button>

<script>
/* =========================================================
   《三国·无尽战纪》配置区
   —— 调数值只需要改这个文件，不用碰 game.js
   ========================================================= */

const GAME_VERSION = 'v1.0.1';

const CONFIG = {
  // ---------- 敌人 ----------
  baseHp: 25,          // 第 1 波敌人血量
  hpGrowth: 1.15,      // 每波血量倍率（前段）
  hpLateFrom: 10,      // 从第 N 波开始用后期曲线
  hpGrowthLate: 1.18,  // 每波血量倍率（后段，更陡）
  armorPerWave: 8,     // 每 N 波护甲 +1
  maxArmor: 6,         // 护甲上限
  bossEvery: 5,        // 每 N 波一个 Boss
  bossHpMult: 1.2,     // Boss 血量倍率
  bossArmorAdd: 0,     // Boss 额外护甲

</script>
<script>
/* =========================================================
   《三国 · 无尽战纪》 —— 逻辑层
   ========================================================= */

const S = {
  wave: 1,
  gold: 0,
  heroes: [],     // {uid, heroId, star, weapon(weaponUid|null)}
  weapons: [],    // {uid, weaponId, attachedTo(heroUid|null)}
  cmdPool: [],    // 已拥有的军令（库）
  commands: [],   // 当前上阵的军令（≤ cmdMax()）
  slotExtra: 0,   // 金币突破：额外卡槽
  cmdExtra: 0,    // 金币突破：额外军令上限
  overflowPaid: 0,// Boss 战已实时结算的溢出金币（避免重复计算）
  retryCount: 0,  // 本局已重排次数
  runDmg: 0,      // 本局累计总伤（含溢出）→ 成就「单局总伤」
  runBestHit: 0,  // 本局最高「单波总伤害」→ 战功来源
  recruits: 0,    // 本局已招募次数（商店买武将/武器，整局限次）
  expAwarded: 0,  // 本局已结算进战功的部分（防重排重复计入）
  rwd: { noHero: 0, recent: [] },  // 防脸黑：连续没出武将 / 最近拿到的英雄
  slots: [],      // heroUid | null
  enemy: null,
  phase: 'prep',  // prep | battle | over
  mode: 'normal', // normal | sandbox（演武场：不存档、不记记录）
  uid: 1,
  bestWave: 0,
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* =========================================================
   开发者调试开关（只存内存！刷新页面即恢复，永不写存档）
   ========================================================= */
const _dev = {
  on: false,        // 总开关
  allCmds: false,   // 全部军令可用（override，不写 meta）
  allHeroes: false, // 全部武将可用（override，不写 meta）
};

/* 只要任一项为真，就完全不落盘、不写记录、不写 meta */
const noSave = () => _dev.on || S.mode === 'sandbox';
/* 加权随机：weights 与 arr 一一对应 */
const pickWeighted = (arr, weights) => {
  let total = 0;
  for (let i = 0; i < arr.length; i++) total += weights[i];
  let r = Math.random() * total;
  for (let i = 0; i < arr.length; i++) {
    r -= weights[i];
    if (r < 0) return arr[i];
  }
  return arr[arr.length - 1];
};

/* ---------------- 基础工具 ---------------- */

function slotsForWave(w) {
  if (S.mode === 'sandbox') return Math.max(1, S.slots.length);
  let n = 3;
  for (const [from, count] of CONFIG.slotSteps) {
    if (w >= from) n = count;
  }
  return Math.min(n, CONFIG.slotMax) + (S.slotExtra || 0);
}

function cmdMax() {
  if (S.mode === 'sandbox') return 99;   // 演武场：军令不限条数
  return CONFIG.commandMax + (S.cmdExtra || 0);
}

function makeHero(heroId, star = 1) {
  return { uid: S.uid++, heroId, star, weapon: null };
}

function makeWeapon(weaponId) {
  return { uid: S.uid++, weaponId, attachedTo: null };
}

function getHero(uid) { return S.heroes.find(h => h.uid === uid); }
function getWeapon(uid) { return S.weapons.find(w => w.uid === uid); }

function deployedHeroes() {
  return S.slots.filter(Boolean).map(getHero).filter(Boolean);
}

function hpCurve(wave) {
  const sw = CONFIG.hpLateFrom || 999;
  if (wave <= sw) return Math.pow(CONFIG.hpGrowth, wave - 1);
  return Math.pow(CONFIG.hpGrowth, sw - 1) * Math.pow(CONFIG.hpGrowthLate, wave - sw);
}

/* ---------------- 敌人生成 ---------------- */

function genEnemy(wave) {
  const isBoss = wave % CONFIG.bossEvery === 0;
  const baseHp = CONFIG.baseHp * hpCurve(wave);
  let name, hpMult, armor, id, mechId;

  if (isBoss) {
    const idx = Math.min(Math.floor(wave / CONFIG.bossEvery) - 1, BOSSES.length - 1);
    const b = BOSSES[idx];
    const loop = Math.floor(wave / CONFIG.bossEvery) - BOSSES.length;
    name = b.name + (loop >= 0 ? '·再临' + (loop > 0 ? (loop + 1) : '') : '');
    hpMult = CONFIG.bossHpMult * (b.hpMult || 1);
    armor = b.armor + CONFIG.bossArmorAdd;
    id = 'boss';
    mechId = b.mech || null;
  } else {
    const pool = ENEMIES.filter(e => e.minWave <= wave);
    /* 加权轮换：最新的 2 个更常见（权重 enemyNewWeight），更早的仍会出现（权重 1）
       —— 否则老敌人会「绝种」，导致「击败某敌人 N 次」的解锁条件永远达不成 */
    const newest = CONFIG.enemyNewWeight;
    const weights = pool.map((x, i) => (i >= pool.length - 2 ? newest : 1));
    const e = pickWeighted(pool, weights);
    name = e.name;
    hpMult = e.hpMult;
    armor = e.armor + Math.floor((wave - 1) / CONFIG.armorPerWave);
    id = e.id;
    mechId = e.mech || null;
  }

  armor = Math.max(0, Math.min(CONFIG.maxArmor, armor));
  const hp = Math.max(1, Math.round(baseHp * hpMult));
  return { id, name, hp, maxHp: hp, armor, isBoss, mechId };
}

/* ---------------- 开局 ---------------- */

function startRun() {
  S.mode = 'normal';
  S.wave = 1;
  S.gold = CONFIG.startGold;
  S.uid = 1;
  S.heroes = [];
  S.weapons = [];
  S.cmdPool = [];
  S.commands = [];
  S.slots = [];
  S.slotExtra = 0;
  S.cmdExtra = 0;
  S.retryCount = 0;
  S.runDmg = 0;
  S.runBestHit = 0;
  S.recruits = 0;
  S.expAwarded = 0;
  S.rwd = { noHero: 0, recent: [] };
  S.phase = 'prep';

  // 初始阵容：三国各一名，不预设路线（玩家自己决定专精哪国）
  S.heroes.push(makeHero('zhangfei'));  // 蜀 · 猛将
  S.heroes.push(makeHero('xuchu'));     // 魏 · 猛将
  S.heroes.push(makeHero('zhouyu'));    // 吴 · 谋士

  S.weapons.push(makeWeapon('shemao')); // 猛将武器
  S.weapons.push(makeWeapon('yushan')); // 谋士武器

  S.cmdPool = ['hubao', 'pojun'];
  S.commands = ['hubao', 'pojun'];

  startWave();
}

function startWave() {
  S.enemy = genEnemy(S.wave);
  S.phase = 'prep';
  S.overflowPaid = 0;
  resetDmgPop();
  if (S.enemy.mechId) {
    const key = 'sg_mech_' + S.enemy.mechId;
    if (!lsGet(key)) { lsSet(key, '1'); setTimeout(() => showMechTip(S.enemy.mechId), 500); }
  }
  if (S.enemy.isBoss) setTimeout(() => SFX.bossEntrance(), 260);

  const need = slotsForWave(S.wave);
  const prev = S.slots.slice();
  S.slots = [];
  for (let i = 0; i < need; i++) S.slots.push(prev[i] || null);

  /* 只在「新开一局」时自动填满；之后空位保持空（玩家自己决定上谁） */
  if (S.wave === 1) autoFill();
  _selSlot = null;
  render();
  if (S.enemy.isBoss) playBossIntro();
}

/* ---------- Boss 出场：巨大印章砸下 ---------- */
function playBossIntro() {
  const ov = $('bossIntro');
  const seal = $('biSeal');
  const sub = $('biSub');
  if (!ov || !seal || !sub || !S.enemy || !S.enemy.isBoss) return;

  const key = 'sg_boss_seen_' + S.enemy.name;
  const first = !lsGet(key);
  lsSet(key, '1');

  seal.textContent = S.enemy.name.charAt(0);
  sub.textContent = '第 ' + S.wave + ' 波　·　' + S.enemy.name + '　·　护甲 ' + S.enemy.armor;

  S.phase = 'intro';
  render();

  seal.classList.remove('off');
  ov.classList.remove('hidden', 'fade');
  void ov.offsetWidth;
  ov.classList.add('on');

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    ov.classList.remove('on', 'fade');
    ov.classList.add('hidden');
    S.phase = 'prep';
    render();
  };
  ov.addEventListener('click', finish, { once: true });

  const t1 = first ? 950 : 380;
  const t2 = first ? 820 : 300;

  setTimeout(() => {
    if (done) return;
    seal.classList.add('off');
    const box = $('enemyBox');
    if (box) {
      box.classList.remove('intro-in');
      void box.offsetWidth;
      box.classList.add('intro-in');
    }
  }, t1);

  setTimeout(() => { if (!done) ov.classList.add('fade'); }, t1 + t2 - 240);
  setTimeout(finish, t1 + t2);
}

function autoFill() {
  const used = new Set(S.slots.filter(Boolean));
  for (let i = 0; i < S.slots.length; i++) {
    if (S.slots[i]) continue;
    const h = S.heroes.find(x => !used.has(x.uid));
    if (h) { S.slots[i] = h.uid; used.add(h.uid); }
  }
}

/* =========================================================
   伤害结算
   公式：单牌伤害 = max(0, 攻击力 + 各类加成 − (护甲 − 破甲)) × 连击数 × 倍率
   ========================================================= */

function cardDamage(card, i, ctx) {
  const h = HERO_MAP[card.heroId];
  const star = card.star;
  const mul = Math.pow(2, star - 1);

  const baseA = h.type === 'meng' ? h.A * mul : h.A;
  const baseH = h.type === 'xiao' ? h.H * mul : h.H;

  // 每一条加成都记一个 event，战斗时可以逐条播放动画
  const events = [];
  let pierce = 0;

  const addA = (src, name, val, ref) => {
    if (!val) return;
    events.push({ src, name, stat: 'A', val, ref: ref || null });
  };
  const addH = (src, name, val, ref) => {
    if (!val) return;
    events.push({ src, name, stat: 'H', val, ref: ref || null });
  };

  /* ---- 武器（只对专属兵种生效）---- */
  if (card.weapon) {
    const wItem = getWeapon(card.weapon);
    const w = wItem ? WEAPON_MAP[wItem.weaponId] : null;
    if (w && w.role === h.type) {
      const wMul = (h.trait && h.trait.kind === 'weaponX2') ? 2 : 1;  // 黄月英：武器数值 ×2
      addA('weapon', w.name, w.A * wMul);
      addH('weapon', w.name, w.H * wMul);

      if (w.id === 'qinglong' && i === ctx.filled - 1) addA('weapon', '偃月·末位', 2);
      if (w.id === 'lianu' && i === 0) addH('weapon', '连弩·首位', 1);
      if (w.id === 'guding' && ctx.armor >= 2) addA('weapon', '古锭·破甲', 3);
      // 谋士武器不加数值，改在「光环」里结算（见 calcAll）
      if (w.id === 'shuangji') {
        const pv = ctx.cards[i - 1], nx = ctx.cards[i + 1];
        const okP = pv && HERO_MAP[pv.heroId].camp === h.camp;
        const okN = nx && HERO_MAP[nx.heroId].camp === h.camp;
        if (okP || okN) addH('weapon', '双铁戟', 1);
      }
    }
  }

  /* ---- 英雄词条（t.stat 可指定加攻击 A 或连击 H）---- */
  const t = h.trait;
  const tv = t.vals[star - 1];
  const DEF_STAT = { firstPos: 'H', enemyArmor: 'H', adjCamp: 'H' };
  const tStat = t.stat || DEF_STAT[t.kind] || 'A';
  const addT = (val) => {
    if (!val) return;
    events.push({ src: 'trait', name: t.name, stat: tStat, val, ref: null });
  };

  switch (t.kind) {
    case 'perPrev':
    case 'perPlayed':
      addT(tv * i);
      break;
    case 'pierce':
      pierce += tv;
      /* 关羽「武圣」：敌人护甲每有 1 点，攻击力 +2（对高护甲特化） */
      if (t.armorAtk && ctx.armor > 0) addT(t.armorAtk * ctx.armor);
      break;
    case 'lastPos':
      if (i === ctx.filled - 1) addT(tv);
      break;
    case 'firstPos':
      if (i === 0) addT(tv);
      break;
    case 'notLast':
      if (i < ctx.filled - 1) addT(tv);
      break;
    case 'enemyArmor':
      if (ctx.armor > 0) addT(tv);
      break;
    case 'perPrevCamp': {
      let n = 0;
      for (let j = 0; j < i; j++) if (HERO_MAP[ctx.cards[j].heroId].camp === t.camp) n++;
      addT(tv * n);
      break;
    }
    case 'adjCamp': {
      const pv = ctx.cards[i - 1], nx = ctx.cards[i + 1];
      const okP = pv && HERO_MAP[pv.heroId].camp === t.camp;
      const okN = nx && HERO_MAP[nx.heroId].camp === t.camp;
      if (okP || okN) addT(tv);
      break;
    }
    /* 吴·水阵：左右都被同阵营牌夹住时，连击 +⌊左 × 右 ÷ vals⌋
       —— 站中间最强、站边上为 0，是「吴国靠位置」的核心 */
    case 'surroundCamp': {
      let L = 0, R = 0;
      for (let j = i - 1; j >= 0; j--) {
        if (HERO_MAP[ctx.cards[j].heroId].camp === t.camp) L++; else break;
      }
      for (let j = i + 1; j < ctx.filled; j++) {
        if (HERO_MAP[ctx.cards[j].heroId].camp === t.camp) R++; else break;
      }
      if (L > 0 && R > 0) addT(Math.floor(L * R / Math.max(1, tv)));
      break;
    }
    case 'perCommand':
      addT(tv * ctx.commandCount);
      break;
  }

  /* ---- 军令 ---- */
  let mult = 1;
  let minHit = 0;
  const mults = [];
  for (const cid of S.commands) {
    const c = COMMAND_MAP[cid];
    if (!c) continue;
    switch (c.kind) {
      case 'countType':
        if (ctx.typeCount[c.type] >= c.min) {
          if (c.stat === 'A') addA('cmd', c.name, c.val, cid);
          else addH('cmd', c.name, c.val, cid);
        }
        break;
      case 'countTypeMou':
        if (ctx.typeCount[c.type] >= c.min && h.type === 'mou') addA('cmd', c.name, c.val, cid);
        break;
      case 'fullSlots':
        if (ctx.filled >= ctx.cap) addA('cmd', c.name, c.val, cid);
        break;
      case 'fewSlots':
        if (ctx.filled <= 3) addA('cmd', c.name, c.val, cid);
        break;
      /* 精兵简政：每个空卡槽 → 全体伤害 +N%（兵越少越强） */
      case 'emptySlots': {
        const empty = Math.max(0, ctx.cap - ctx.filled);
        if (empty > 0) {
          const m = 1 + (c.val / 100) * empty;
          mult *= m;
          mults.push({ name: c.name, val: +m.toFixed(2), ref: cid });
        }
        break;
      }
      case 'countCamp':
        if (ctx.campCount[c.camp] >= c.min && h.camp === c.camp) {
          if (c.stat === 'H') addH('cmd', c.name, c.val, cid);
          else addA('cmd', c.name, c.val, cid);
        }
        break;
      case 'adjSameCamp':
        if (i > 0 && HERO_MAP[ctx.cards[i - 1].heroId].camp === c.camp) addA('cmd', c.name, c.val, cid);
        break;
      /* 阵营门槛：上阵 ≥N 张本阵营 → 全体攻击 +（护甲 − offset）
         用「护甲值」做加成，是为了绕开「A 只有 3、护甲 6 就归零」的悬崖 */
      case 'armorScaledA': {
        const own = ctx.campCount[c.camp] || 0;
        if (own >= (c.min || 0)) {
          const bonus = Math.max(0, ctx.armor - (c.offset || 0));
          if (bonus > 0) addA('cmd', c.name, bonus, cid);
        }
        break;
      }
      case 'posIndex':
        if (i === c.index) {
          if (c.stat === 'H') addH('cmd', c.name, c.val, cid);
          else addA('cmd', c.name, c.val, cid);
        }
        break;
      case 'lastMult':
        if (i === ctx.filled - 1) { mult *= c.val; mults.push({ name: c.name, val: c.val, ref: cid }); }
        break;
      case 'perIndex': {
        const step = c.div ? Math.ceil((i + 1) / c.div) : (i + 1);
        addA('cmd', c.name, step * c.val, cid);
        break;
      }
      case 'enemyArmorCond':
        if (ctx.armor >= c.min) addA('cmd', c.name, c.val, cid);
        break;
      case 'enemyHpCond':
        if (ctx.enemyHp >= c.min) addH('cmd', c.name, c.val, cid);
        break;
      case 'bossMult':
        if (ctx.isBoss) { mult *= c.val; mults.push({ name: c.name, val: c.val, ref: cid }); }
        break;
      case 'scalePrev':
        if (c.stat === 'H') addH('cmd', c.name, c.val * i, cid);
        else addA('cmd', c.name, c.val * i, cid);
        break;
      case 'scalePrevCamp': {
        let n = 0;
        for (let j = 0; j < i; j++) if (HERO_MAP[ctx.cards[j].heroId].camp === h.camp) n++;
        addH('cmd', c.name, c.val * n, cid);
        break;
      }
      case 'scalePrevType': {
        let n = 0;
        for (let j = 0; j < i; j++) if (HERO_MAP[ctx.cards[j].heroId].type === c.type) n++;
        if (c.stat === 'A') addA('cmd', c.name, c.val * n, cid);
        else addH('cmd', c.name, c.val * n, cid);
        break;
      }
      case 'monoType': {
        const used = Object.keys(ctx.typeCount).filter(k => ctx.typeCount[k] > 0);
        if (used.length === 1 && ctx.typeCount[used[0]] >= c.min) addA('cmd', c.name, c.val, cid);
        break;
      }
      case 'firstLast':
        if (i === 0 || i === ctx.filled - 1) addA('cmd', c.name, c.val, cid);
        break;
      case 'fromIndex':
        if (i >= c.min) addA('cmd', c.name, c.val, cid);
        break;
      case 'lastPosAdd':
        if (i === ctx.filled - 1) addH('cmd', c.name, c.val, cid);
        break;
      case 'perCategory': {
        let n = 0;
        for (let k = 0; k < S.commands.length; k++) {
          const cc = COMMAND_MAP[S.commands[k]];
          if (cc && cmdCat(cc.kind) === c.cat) n++;
        }
        const times = Math.floor(n / c.per);
        if (times > 0) addA('cmd', c.name, c.val * times, cid);
        break;
      }
      case 'pierceAll':
        if (ctx.armor >= c.min) pierce += c.val;
        break;
      case 'minPerHit':
        minHit = Math.max(minHit, c.val);
        break;
      case 'countTypeTier': {
        const n = ctx.typeCount[c.type] || 0;
        if (n >= c.min2) addA('cmd', c.name, c.val2, cid);
        else if (n >= c.min1) addA('cmd', c.name, c.val1, cid);
        break;
      }
      case 'enemyArmorTier':
        if (ctx.armor >= c.min2) addA('cmd', c.name, c.val2, cid);
        else if (ctx.armor >= c.min1) addA('cmd', c.name, c.val1, cid);
        break;
      case 'enemyHpTier':
        if (ctx.enemyHp >= c.min2) addH('cmd', c.name, c.val2, cid);
        else if (ctx.enemyHp >= c.min1) addH('cmd', c.name, c.val1, cid);
        break;
      case 'scalePrevTypeBoth': {
        let n = 0;
        for (let j = 0; j < i; j++) if (HERO_MAP[ctx.cards[j].heroId].type === c.type) n++;
        if (n > 0) {
          addA('cmd', c.name, c.val * n, cid);
          addH('cmd', c.name, c.val * n, cid);
        }
        break;
      }
      case 'scalePrevTypeAny': {
        const myType = h.type;
        let n = 0;
        for (let j = 0; j < i; j++) if (HERO_MAP[ctx.cards[j].heroId].type === myType) n++;
        addA('cmd', c.name, c.val * n, cid);
        break;
      }
      case 'totem':
        if (c.totem === 'pos') {
          if (i === 0) addH('cmd', c.name, 1, cid);
          if (i === ctx.filled - 1) mult *= 1.5;
        } else if (c.totem === 'enemy') {
          if (ctx.armor >= 2) addA('cmd', c.name, 2, cid);
          pierce += 1;
        } else if (c.totem === 'scale') {
          if (i >= 2) { addA('cmd', c.name, 1, cid); addH('cmd', c.name, 1, cid); }
        } else if (c.totem === 'team') {
          addA('cmd', c.name, 2, cid);
          addH('cmd', c.name, 1, cid);
        }
        break;
    }
  }

  let A = baseA;
  let H = baseH;
  events.forEach(e => { if (e.stat === 'A') A += e.val; else H += e.val; });

  const mech = ctx.mech || {};
  if (mech.noPierce) pierce = 0;   // ⚠ 破甲无效

  const effArmor = Math.max(0, ctx.armor - pierce);
  let perHit = Math.max(0, A - effArmor);
  if (perHit === 0 && A > 0) perHit = 1;   // 护甲再厚，也至少打 1 点（避免骁将归零）
  if (minHit > 0) perHit = Math.max(perHit, minHit);   // 百炼成钢：每段保底 N 点
  if (mech.cap) perHit = Math.min(perHit, mech.cap);   // ⚠ 每段上限

  let dmg = Math.floor(perHit * H * mult);
  if (mech.firstHalf && i === 0) dmg = Math.floor(dmg * 0.5);  // ⚠ 首位减半

  return {
    card, i,
    baseA, baseH, bA: A - baseA, bH: H - baseH,
    A, H, pierce, effArmor, perHit, mult, mults, events, dmg,
  };
}

function calcAll() {
  const cards = deployedHeroes();
  if (cards.length === 0) {
    return { cards: [], results: [], total: 0, killable: false };
  }
  const campCount = { shu: 0, wei: 0, wu: 0 };
  const typeCount = { meng: 0, xiao: 0, mou: 0 };
  cards.forEach(c => {
    const h = HERO_MAP[c.heroId];
    campCount[h.camp]++;
    typeCount[h.type]++;
  });

  // 徐晃「断粮」：削减敌人护甲（全队受益）
  let armorCut = 0;
  cards.forEach(c => {
    const tt = HERO_MAP[c.heroId].trait;
    if (tt && tt.kind === 'armorDown') armorCut += (tt.vals[c.star - 1] || 0);
  });

  const ctx = {
    cards, campCount, typeCount,
    armor: Math.max(0, S.enemy.armor - armorCut),
    enemyHp: S.enemy.maxHp,
    isBoss: S.enemy.isBoss,
    filled: cards.length,
    cap: S.slots.length,
    commandCount: S.commands.length,
    mech: S.enemy.mechId ? (MECHS[S.enemy.mechId] || null) : null,
  };

  const results = cards.map((c, i) => cardDamage(c, i, ctx));

  /* ---- 谋士光环：作用于「之后」的同阵营牌 ---- */
  const auraBoostPct = S.commands.reduce((n, id) => {
    const c = COMMAND_MAP[id];
    return n + (c && c.kind === 'auraBoost' ? c.val : 0);
  }, 0);

  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const h = HERO_MAP[r.card.heroId];
    const t = h.trait;
    if (!t || t.kind !== 'auraCamp') continue;

    let pct = t.vals[r.card.star - 1] || 0;
    if (ctx.mech && ctx.mech.cap && t.mechSegs) continue;   /* ⚠ 黄月英：只有「每段上限」类敌人才切换成段数保底 */
    if (t.cond === 'per2cmd') pct += Math.floor(S.commands.length / 2) * (t.bonus || 0);
    if (t.cond === 'camp3' && ctx.campCount[t.camp] >= 3) pct += (t.bonus || 0);
    if (t.cond === 'diffCamp') {
      const used = Object.keys(ctx.campCount).filter(k => ctx.campCount[k] > 0).length;
      pct += Math.max(0, used - 1) * (t.bonus || 0);
    }

    let auraAll = false;
    if (r.card.weapon) {
      const wi = getWeapon(r.card.weapon);
      const wd = wi ? WEAPON_MAP[wi.weaponId] : null;
      if (wd && wd.aura) pct += wd.aura;
      if (wd && wd.auraAll) auraAll = true;
    }
    pct += auraBoostPct;
    if (pct <= 0) continue;

    for (let j = 0; j < results.length; j++) {
      if (j === i) continue;
      const th = HERO_MAP[results[j].card.heroId];
      const sameCamp = th.camp === t.camp;
      const adj = !!t.adjAny && Math.abs(j - i) === 1;   // 孙权「制衡」：紧邻那张，左右都算
      const anyCamp = t.scope === 'all';
      const posOk = auraAll || adj || j > i;             // 八阵图 / 紧邻 / 之后
      if (!posOk) continue;
      if (!sameCamp && !adj && !anyCamp) continue;
      results[j].dmg = Math.round(results[j].dmg * (1 + pct / 100));
      results[j].auras = (results[j].auras || []).concat([{ name: t.name, pct: pct }]);
    }
  }

  /* ---- 黄月英「连弩」：遇带机制的敌人时，全队段数保底 ----
     用「按比例抬到保底线」而不是「+N 段」：
       +N   → 段数越少的人赚得越多，但强者也会被灌水
       抬到 → 段数已经够的人 **精确为 0** 变化（数学上永不溢出） */
  if (ctx.mech && ctx.mech.cap) {
    let floorSegs = 0;
    results.forEach(r => {
      const tt = HERO_MAP[r.card.heroId].trait;
      if (tt && tt.mechSegs) {
        const v = tt.mechSegs[r.card.star - 1] || 0;
        if (v > floorSegs) floorSegs = v;
      }
    });
    if (floorSegs > 0) {
      /* 保底随波数成长（对普通玩家更保守）：
         第 20 波 2,000 / 第 30 波 3,000 / 第 50 波 5,000（封顶）*/
      const waveNow = (S.mode === 'sandbox') ? 50 : (S.wave || 1);
      floorSegs = Math.min(floorSegs, waveNow * (CONFIG.mechFloorPerWave || 100));
      const sumH = results.reduce((n, r) => n + r.H, 0);
      if (sumH > 0 && sumH < floorSegs) {
        const k = floorSegs / sumH;
        results.forEach(r => {
          const oldH = r.H;
          const newH = Math.round(oldH * k);
          if (newH <= oldH) return;
          r.H = newH;
          r.bH = (r.bH || 0) + (newH - oldH);
          r.dmg = Math.round(r.dmg * (newH / oldH));   /* 等比放大，保留光环收益 */
          r.events.push({ src: 'trait', name: '连弩', stat: 'H', val: newH - oldH, ref: null });
        });
      }
    }
  }

  const total = results.reduce((a, r) => a + r.dmg, 0);
  return { cards, results, total, killable: total >= S.enemy.hp };
}

function renderEnemy() {
  const e = S.enemy;
  if (!e) return;
  const nameEl = $('uiEnemyName');
  nameEl.textContent = e.name;
  nameEl.className = 'enemy-name' + (e.isBoss ? ' boss' : '');
  $('enemyBox').className = 'enemy' + (e.isBoss ? ' boss' : '');
  let tag = '护甲 ' + e.armor + (e.isBoss ? ' · BOSS' : '');
  const mech = e.mechId ? MECHS[e.mechId] : null;
  if (mech) tag += '　⚠ ' + mech.label;
  const tagEl = $('uiEnemyTag');
  tagEl.textContent = tag;
  tagEl.style.cursor = mech ? 'pointer' : 'default';
  tagEl.onclick = mech ? (ev) => { ev.stopPropagation(); showMechModal(e.mechId); } : null;
  $('uiHpBar').style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';

    : (Math.max(0, e.hp) + ' / ' + e.maxHp);
