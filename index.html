let _guideIdx = 0;
let _guideTarget = null;

function ensureGuideLayer() {
  if (!$('tutShield')) {
    const s = document.createElement('div');
    s.id = 'tutShield';
    s.className = 'tut-shield';
    /* 点暗处也能继续：不会再出现「找不到按钮、又不能滑动」的死局 */
    s.addEventListener('click', onGuideShieldClick);
    document.body.appendChild(s);

    const sp = document.createElement('div');
    sp.id = 'tutSpot';
    sp.className = 'tut-spot';
    sp.style.display = 'none';
    document.body.appendChild(sp);
  }
}

/* 点遮罩空白处：需要玩家动手的步骤只提示，不跳过 */
function onGuideShieldClick() {
  const step = GUIDE[_guideIdx];
  if (!step) return;
  if (step.wait) { toast('👆 要点高亮的地方哦'); return; }
  guideNext();
}

/* 把高亮目标滚进视野（顶栏是 sticky，上边留 90px 安全区） */
function scrollGuideTargetIntoView(target) {
  if (!target || !target.getBoundingClientRect) return;
  const r = target.getBoundingClientRect();
  const vh = window.innerHeight || 0;
  if (r.top < 90 || r.bottom > vh - 24) {
    try { target.scrollIntoView({ block: 'center', inline: 'nearest' }); }
    catch (e) { target.scrollIntoView(); }
  }
}

function guideNext() {
  _guideIdx++;
  if (_guideIdx >= GUIDE.length) { endGuide(); return; }
  renderGuide();
}

function endGuide() {
  clearGuideUi();
  const shield = $('tutShield');
  if (shield) shield.classList.add('hidden');
  lsSet('sg_guide_done', '1');
}

function clearGuideUi() {
  const tip = $('tutTip');
  if (tip) tip.remove();
  const spot = $('tutSpot');
  if (spot) spot.style.display = 'none';
  document.querySelectorAll('.tut-target').forEach(x => x.classList.remove('tut-target'));
  document.querySelectorAll('.tut-pulse').forEach(x => x.classList.remove('tut-pulse'));
  if (_guideTarget) {
    _guideTarget.removeEventListener('click', onGuideTargetClick, true);
    _guideTarget = null;
  }
}

function onGuideTargetClick(e) {
  const step = GUIDE[_guideIdx];
  // 指定了具体按钮时，只有点中那个按钮才推进
  if (step && step.act) {
    const el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.dataset.act !== step.act) return;
  }
  setTimeout(() => guideNext(), 80);
}

function startGuide(idx) {
  ensureGuideLayer();
  _guideIdx = idx || 0;
  renderGuide();
}

function renderGuide() {
  clearGuideUi();
  const step = GUIDE[_guideIdx];
  const shield = $('tutShield');
  const spot = $('tutSpot');
  if (!step || !shield || !spot) { endGuide(); return; }

  shield.classList.remove('hidden');

  const target = document.querySelector(step.sel);
  if (target) {
    scrollGuideTargetIntoView(target);   // ← 先把目标滚进屏幕，否则提示框会跑到屏幕外
    const r = target.getBoundingClientRect();
    spot.style.display = 'block';
    spot.style.left = (r.left - 7) + 'px';
    spot.style.top = (r.top - 7) + 'px';
    spot.style.width = (r.width + 14) + 'px';
    spot.style.height = (r.height + 14) + 'px';
    target.classList.add('tut-target');
  } else {
    spot.style.display = 'none';
  }

  const tip = document.createElement('div');
  tip.id = 'tutTip';
  tip.className = 'tut-tip';
  tip.innerHTML =
    '<div class="tut-tip-title">' + step.title + '</div>' +
    '<div class="tut-tip-body">' + step.text + '</div>' +
    (step.wait
      ? '<div class="tut-hint">👆 点击高亮处继续</div>'
      : '<div class="tut-hint">点空白处或「下一步」继续</div>') +
    '<div class="tut-tip-btns">' +
      '<button class="btn ghost" onclick="endGuide()">跳过</button>' +
      (step.wait ? '' : '<button class="btn" onclick="guideNext()">下一步</button>') +
    '</div>';
  document.body.appendChild(tip);
  positionTip(tip, target);

  if (step.wait && target) {
    if (step.act) {
      const btn = target.querySelector('[data-act="' + step.act + '"]');
      if (btn) btn.classList.add('tut-pulse');
    }
    _guideTarget = target;
    target.addEventListener('click', onGuideTargetClick, true);
  }
}

function positionTip(tip, target) {
  const tw = Math.min(360, window.innerWidth - 28);
  tip.style.width = tw + 'px';

  if (!target) {
    tip.style.left = '50%';
    tip.style.top = '26%';
    tip.style.transform = 'translateX(-50%)';
    return;
  }
  tip.style.transform = 'none';

  const r = target.getBoundingClientRect();
  const th = tip.offsetHeight || 150;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let left = r.left + r.width / 2 - tw / 2;
  left = Math.max(14, Math.min(vw - tw - 14, left));

  let top;
  if (r.top > th + 46) top = r.top - th - 18;
  else top = r.bottom + 18;
  /* 关键：不管目标滚到哪儿，提示框都必须留在屏幕里（否则玩家找不到按钮 = 卡死） */
  top = Math.max(14, Math.min(vh - th - 14, top));

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}

window.addEventListener('resize', () => {
  const tip = $('tutTip');
  if (!tip) return;
  const step = GUIDE[_guideIdx];
  const target = step ? document.querySelector(step.sel) : null;
  positionTip(tip, target);
});

/* =========================================================
   存档 / 最高记录
   ========================================================= */

const SAVE_KEY = 'sg_save_v1';
const REC_KEY = 'sg_record_v1';

function lsRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }

let _saveTimer = null;
function scheduleSave() {
  if (noSave()) return;          // 调试 / 演武场：本局完全不落盘
  if (S.phase !== 'prep') return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveGame, 350);
}

function saveGame() {
  try {
    if (noSave()) return;
    if (S.phase !== 'prep') return;
    if (!S.heroes || S.heroes.length === 0) return;
    lsSet(SAVE_KEY, JSON.stringify({
      v: 1,
      wave: S.wave,
      gold: S.gold,
      uid: S.uid,
      slotExtra: S.slotExtra,
      cmdExtra: S.cmdExtra,
      heroes: S.heroes,
      weapons: S.weapons,
      cmdPool: S.cmdPool,
      commands: S.commands,
      slots: S.slots,
      enemy: S.enemy,
      runDmg: S.runDmg,      // 中途刷新后接着玩，本局总伤不会丢
      runBestHit: S.runBestHit,
    }));
  } catch (e) {}
}

function loadGame() {
  try {
    const raw = lsGet(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !d.heroes || d.heroes.length === 0) return false;
    S.wave = d.wave || 1;
    S.gold = d.gold || 0;
    S.uid = d.uid || 1;
    S.slotExtra = d.slotExtra || 0;
    S.cmdExtra = d.cmdExtra || 0;
    S.heroes = d.heroes;
    S.weapons = d.weapons || [];
    S.cmdPool = d.cmdPool || [];
    S.commands = d.commands || [];
    S.slots = d.slots || [];
    S.enemy = d.enemy || null;
    S.runDmg = d.runDmg || 0;
    S.runBestHit = d.runBestHit || 0;
    S.expAwarded = 0;          // 存档是在结算前写的，所以这局还没领过战功
    S.phase = 'prep';
    return true;
  } catch (e) {
    return false;
  }
}

function clearSave() { lsRemove(SAVE_KEY); }

function getRecords() {
  try {
    const r = lsGet(REC_KEY);
    return r ? JSON.parse(r) : {};
  } catch (e) {
    return {};
  }
}

function bumpRecord(key, val) {
  if (noSave()) return;         // 调试 / 演武场的成绩不进历史记录
  const r = getRecords();
  if (!r[key] || val > r[key]) {
    r[key] = val;
    lsSet(REC_KEY, JSON.stringify(r));
  }
}

/* ---------- 阵营门槛军令：解锁状态 ---------- */

function cmdUnlocked(id) {
  if (_dev.on && _dev.allCmds) return true;   // 调试：临时全开，不写 meta
  if (S.mode === 'sandbox') return true;      // 演武场：全开
  const m = getMeta();
  return (m.unlockedCmds || []).indexOf(id) >= 0;
}

/* 未解锁的军令不进商店池、不可熔铸 */
function cmdAvailable(c) {
  if (!c) return false;
  if (c.isTotem) return false;
  const req = CMD_UNLOCKS.some(u => u.id === c.id);
  return !req || cmdUnlocked(c.id);
}

function cmdUnlockLabel(u) {
  const campName = (CAMPS[u.camp] || {}).name || '';
  return '用 ≥' + CONFIG.campCmdCards + ' 张' + campName + '牌通过第 ' +
    CONFIG.campCmdWave + ' 波（累计 ' + u.need + ' 次）';
}

function cmdUnlockProgress(u) {
  const m = getMeta();
  return ((m.stats.waves4 || {})[u.camp] || 0);
}

function checkCmdUnlocks() {
  if (noSave()) return [];      // 调试 / 演武场 不写 meta
  const m = getMeta();
  if (!m.unlockedCmds) m.unlockedCmds = [];
  const fresh = [];
  CMD_UNLOCKS.forEach(u => {
    if (m.unlockedCmds.indexOf(u.id) >= 0) return;
    const cur = (m.stats.waves4 || {})[u.camp] || 0;
    if (cur >= u.need) {
      m.unlockedCmds.push(u.id);
      const c = COMMAND_MAP[u.id];
      fresh.push(c ? c.name : u.id);
    }
  });
  if (fresh.length) {
    saveMeta(m);
    toast('🎖 解锁新军令：' + fresh.join('、'));
    SFX.star();
  }
  return fresh;
}

/* =========================================================
   局外成长：长期统计 + 武将解锁
   ========================================================= */

const META_KEY = 'sg_meta_v1';

function metaDefaults() {
  return {
    v: 1,
    unlocked: START_HEROES.slice(),
    unlockedCmds: [],          // 已解锁的「阵营门槛军令」
    stats: {
      bestWave: 0, bestDmg: 0, totalWaves: 0, runs: 0,
      exp: 0, bestRunDmg: 0, bestRunHit: 0,   // 累计战功 / 单局最高总伤 / 单局最高单波
      maxSingleHit: 0, maxFirstHit: 0, maxCmd: 0, maxWu: 0,
      maxWeapons: 0, maxTypes: 0, maxLastHit: 0,
      kills: {},
      waves4: { shu: 0, wei: 0, wu: 0 },   // 「≥4 张同阵营牌通过第 N 波」的次数
    },
    achv: [],                        // 已解锁成就 id
  };
}

function getMeta() {
  try {
    const raw = lsGet(META_KEY);
    if (!raw) {
      const m = metaDefaults();
      const rec = getRecords();
      if (rec.bestWave) m.stats.bestWave = rec.bestWave;
      if (rec.bestDmg) m.stats.bestDmg = rec.bestDmg;
      saveMeta(m);
      return m;
    }
    const m = JSON.parse(raw);
    if (!m || m.v !== 1) return metaDefaults();
    if (!m.stats) m.stats = metaDefaults().stats;
    if (!m.stats.kills) m.stats.kills = {};
    if (!m.stats.waves4) m.stats.waves4 = { shu: 0, wei: 0, wu: 0 };
    if (m.stats.exp == null) m.stats.exp = 0;              // 老存档迁移：战功从 0 起算
    if (m.stats.bestRunDmg == null) m.stats.bestRunDmg = 0;
    if (m.stats.bestRunHit == null) m.stats.bestRunHit = 0;
    if (!m.achv) m.achv = [];
    if (!m.unlockedCmds) m.unlockedCmds = [];
    if (!m.unlocked || !m.unlocked.length) m.unlocked = START_HEROES.slice();
    return m;
  } catch (e) {
    return metaDefaults();
  }
}

function saveMeta(m) {
  try { lsSet(META_KEY, JSON.stringify(m)); } catch (e) {}
}

function unlockedHeroes() {
  if (_dev.on && _dev.allHeroes) return HEROES.slice();   // 调试：临时全开，不写 meta
  if (S.mode === 'sandbox') return HEROES.slice();        // 演武场：全开
  const m = getMeta();
  return HEROES.filter(h => m.unlocked.indexOf(h.id) >= 0);
}

function checkUnlocks() {
  if (noSave()) return [];      // 调试 / 演武场 不写 meta
  const m = getMeta();
  const fresh = [];
  UNLOCKS.forEach(u => {
    if (m.unlocked.indexOf(u.id) >= 0) return;
    let cur = 0;
    try { cur = u.get(m) || 0; } catch (e) { cur = 0; }
    if (cur >= u.need) {
      m.unlocked.push(u.id);
      fresh.push(HERO_MAP[u.id].name);
    }
  });
  if (fresh.length > 0) {
    saveMeta(m);
    toast('🎉 解锁新武将：' + fresh.join('、'));
    SFX.star();
  }
  return fresh;
}

/* =========================================================
   战功 / 等级（累计制）
   ========================================================= */

/* 升到第 lv 级需要的累计战功：0, BASE, BASE×R, BASE×R², ... */
function levelThreshold(lv) {
  if (lv <= 1) return 0;
  return Math.round(LEVEL_BASE * Math.pow(LEVEL_RATIO, lv - 2));
}

function levelInfo(exp) {
  const e = Math.max(0, Math.floor(exp || 0));
  const max = LEVEL_TITLES.length;
  let lv = 1;
  for (let i = 2; i <= max; i++) {
    if (e >= levelThreshold(i)) lv = i; else break;
  }
  const cur = levelThreshold(lv);
  const next = lv >= max ? 0 : levelThreshold(lv + 1);
  const pct = next > cur ? Math.min(100, (e - cur) / (next - cur) * 100) : 100;
  return {
    lv: lv, title: LEVEL_TITLES[lv - 1], exp: e,
    cur: cur, next: next, pct: pct, maxed: lv >= max,
  };
}

/* 顶栏：等级徽章 + 底边 3px 经验线（不占额外高度，所以不会再撑宽页面） */
function renderExpBar() {
  try {
    const m = getMeta();
    const info = levelInfo(m.stats.exp || 0);
    const chip = $('uiLevel');
    if (chip) {
      chip.textContent = 'Lv.' + info.lv;
      chip.title = info.title + (info.maxed
        ? '（满级）' : '　' + fmtNum(info.exp) + ' / ' + fmtNum(info.next) + ' 战功');
    }
    document.documentElement.style.setProperty('--exp-pct', (info.pct || 0).toFixed(2) + '%');
  } catch (e) {}
}

/* ---------- 晋升动画：跨级时逐级弹出称号 ---------- */
function playLevelUpFx(fromLv, toLv) {
  if (!(toLv > fromLv)) return;
  let el = $('lvFx');
  if (!el) {
    el = document.createElement('div');
    el.id = 'lvFx';
    el.className = 'lv-fx';
    document.body.appendChild(el);
  }
  let lv = fromLv + 1;
  const step = () => {
    if (lv > toLv) { el.classList.remove('show'); return; }
    const title = LEVEL_TITLES[lv - 1] || '';
    el.innerHTML = '<div class="lv-fx-inner">' +
      '<div class="lv-fx-lv">Lv.' + lv + '</div>' +
      '<div class="lv-fx-title">' + title + '</div>' +
      (lv === toLv ? '<div class="lv-fx-sub">✦ 晋升完成 ✦</div>' : '') +
      '</div>';
    el.classList.remove('show');
    void el.offsetWidth;              /* 强制重排，让同一动画能连续播放 */
    el.classList.add('show');
    try { SFX.star(); } catch (e) {}
    lv++;
    setTimeout(step, 460);
  };
  step();
}

/* 结算：把「本局最高单波 − 已结算过的部分」计进战功。返回结算详情，没变化返回 null */
function awardRunExp() {
  if (noSave()) return null;                       // 演武场 / 调试：不写 meta
  const run = Math.max(0, Math.floor(S.runBestHit || 0));
  const done = Math.max(0, Math.floor(S.expAwarded || 0));
  const gain = Math.max(0, run - done);
  if (gain <= 0) return null;
  S.expAwarded = run;                              // 重排后只补新的增量，不重复计

  let m;
  try { m = getMeta(); } catch (e) { return null; }
  if (!m.stats) m.stats = metaDefaults().stats;
  const before = levelInfo(m.stats.exp || 0);
  m.stats.exp = (m.stats.exp || 0) + gain;
  m.stats.bestRunHit = Math.max(m.stats.bestRunHit || 0, run);
  m.stats.bestRunDmg = Math.max(m.stats.bestRunDmg || 0, Math.floor(S.runDmg || 0));
  saveMeta(m);
  const after = levelInfo(m.stats.exp);
  renderExpBar();
  if (after.lv > before.lv) { try { SFX.star(); } catch (e) {} }
  return { gain: gain, run: run, before: before, after: after, leveled: after.lv > before.lv };
}

function expSettleHTML(r) {
  if (!r) return '';
  let html = '<div class="exp-settle">' +
    '本局最高单波 <b>' + fmtNum(r.run) + '</b>　·　战功 <b>+' + fmtNum(r.gain) + '</b>' +
    '<br>Lv.' + r.after.lv + ' ' + r.after.title;
  if (r.leveled) html += '　<b class="lv-up">↑ 晋升！</b>';
  html += '</div>';
  return html;
}

let _codexTab = 'hero';

function openCodex(tab) {

function renderCodex() {
  const meta = getMeta();
  const tabs = [['hero', '武将'], ['weapon', '武器'], ['command', '军令'], ['enemy', '敌人'], ['mech', '机制']];

  let html = '<h2>图 鉴</h2>' +
    '<div class="codex-stats">' +
      '最远 <b>' + (meta.stats.bestWave || 0) + '</b> 波　·　' +
      '累计通过 <b>' + (meta.stats.totalWaves || 0) + '</b> 波　·　' +
      '最高单波 <b>' + (meta.stats.bestDmg || 0) + '</b>　·　' +
      '武将 <b>' + meta.unlocked.length + '/' + HEROES.length + '</b>' +
    '</div>' +
    '<div class="codex-tabs">' +
      tabs.map(t => '<button class="codex-tab' + (_codexTab === t[0] ? ' on' : '') +
        '" onclick="openCodex(\'' + t[0] + '\')">' + t[1] + '</button>').join('') +
    '</div>' +
    '<div class="codex-body">' + codexBody(meta) + '</div>' +
    '<div class="btn-row"><button class="btn" onclick="closeModal()">关闭</button></div>';
  openModal(html);
}

function codexBody(meta) {
  if (_codexTab === 'hero') {
    return '<div class="cx-grid">' + HEROES.map(d => {
      const on = meta.unlocked.indexOf(d.id) >= 0;

      if (!on) {
        const u = UNLOCKS.filter(x => x.id === d.id)[0];
        let cur = 0, need = 1;
        if (u) {
          try { cur = u.get(meta) || 0; } catch (e) { cur = 0; }
          need = u.need;
        }
        const pct = Math.min(100, Math.round(cur / need * 100));
        return '<div class="cx-card locked">' +
          '<div class="cx-name">？？？</div>' +
          '<div class="cx-sub">' + TYPES[d.type].name + ' · ' + CAMPS[d.camp].name + '</div>' +
          '<div class="cx-cond">' + (u ? u.label : '') + '</div>' +
          '<div class="cx-bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="cx-prog">' + Math.min(cur, need) + ' / ' + need + '</div>' +
          '</div>';
      }

      return '<div class="cx-card camp-' + d.camp + '">' +
        '<div class="cx-name">' + d.name + '</div>' +
        '<div class="cx-sub">' + TYPES[d.type].name + ' · ' + CAMPS[d.camp].name + '</div>' +
        '<div class="cx-aw">攻 ' + d.A + '　连 ' + d.H + '</div>' +
        '<div class="cx-trait">' + d.trait.name + '：' +
          d.trait.text.replace('{v}', d.trait.vals[0]).replace('{s}', traitSegsTxt(d.trait, 1)) + '</div>' +
        '</div>';
    }).join('') + '</div>';
  }

  if (_codexTab === 'weapon') {
    return WEAPONS.map(w =>
      '<div class="cx-row"><b>' + w.name + '</b>' +
      '<span class="cx-tag">' + TYPES[w.role].name + '</span>' +
      '<span class="cx-desc">' + w.text + '</span></div>').join('');
  }

  if (_codexTab === 'command') {
    const buckets = { team: [], pos: [], enemy: [], scale: [], totem: [] };
    COMMANDS.forEach(c => {
      /* 锁定的阵营军令单独放「待解锁」区，避免重复出现 */
      if (!c.isTotem && !cmdAvailable(c)) return;
      const k = cmdCat(c.kind);
      (buckets[k] || buckets.scale).push(c);
    });
    const labels = {
      team: '数量 / 阵营', pos: '位置', enemy: '敌人',
      scale: '势（累积）', totem: '总纲（熔铸产物）',
    };
    let html = ['team', 'pos', 'enemy', 'scale', 'totem'].map(k =>
      buckets[k].length
        ? '<div class="cx-group">' + labels[k] + '</div>' +
          buckets[k].map(c =>
            '<div class="cx-row"><b>' + c.name + '</b>' +
            '<span class="cx-desc">' + c.desc + '</span></div>'
          ).join('')
        : ''
    ).join('');

    /* 未解锁的阵营门槛军令：条件 + 进度 */
    const lockedList = CMD_UNLOCKS.filter(u => !cmdUnlocked(u.id));
    if (lockedList.length) {
      html += '<div class="cx-group">🔒 待解锁（阵营门槛军令）</div>';
      html += lockedList.map(u => {
        const c = COMMAND_MAP[u.id];
        const cur = Math.min(cmdUnlockProgress(u), u.need);
        return '<div class="cx-row"><b>' + (c ? c.name : u.id) + '</b>' +
          '<span class="cx-desc">' + cmdUnlockLabel(u) +
          '<br><span style="color:#7ee07e">进度 ' + cur + ' / ' + u.need + '</span>' +
          (c ? '　效果：' + c.desc : '') +
          '</span></div>';
      }).join('');
    }
    return html;
  }

  if (_codexTab === 'mech') {
    return MECH_GUIDE.map(g =>
      '<div class="cx-guide">' +
        '<div class="cg-t">' + g.t + '</div>' +
        '<div class="cg-d">' + g.d + '</div>' +
        (g.e ? '<div class="cg-e">例：' + g.e + '</div>' : '') +
      '</div>').join('');
  }

  let html = '<div class="cx-group">普通敌人（共 ' + ENEMIES.length + ' 种）</div>';
  html += ENEMIES.map(e => {
    const m = e.mech ? MECHS[e.mech] : null;
    return '<div class="cx-row"><b>' + e.name + '</b>' +
      '<span class="cx-tag">护甲 ' + e.armor + '</span>' +
      (m ? '<span class="cx-tag" style="color:#ffb347;background:#ffb3471a">⚠ ' + m.label + '</span>' : '') +
      '<span class="cx-desc">血量 ×' + e.hpMult + '　第 ' + e.minWave + ' 波起</span></div>';
  }).join('');

  html += '<div class="cx-group">Boss（每 ' + CONFIG.bossEvery + ' 波）</div>';
  html += BOSSES.map((b, i) => {
    const m = b.mech ? MECHS[b.mech] : null;
    return '<div class="cx-row"><b>' + b.name + '</b>' +
      '<span class="cx-tag">护甲 ' + b.armor + '</span>' +
      (m ? '<span class="cx-tag" style="color:#ffb347;background:#ffb3471a">⚠ ' + m.label + '</span>' : '') +
      '<span class="cx-desc">第 ' + ((i + 1) * CONFIG.bossEvery) + ' 波' +
        (b.hpMult ? '　血量 ×' + b.hpMult : '') + '</span></div>';
  }).join('');
  return html;
}

/* ---------- 致谢 ---------- */
function creditsHTML() {

  let html = '<div class="hof-head">🙏 致 谢' +
    '<span>没有这些人，这个游戏走不到 v1.0</span></div>';

    '<div class="cr-role">' + (a.role || '制作') + '</div>' +
    '<div class="cr-name">' + (a.id || '—') + '</div>' +
    '</div>';

  /* 次要：程序编写 */
  const p = c.programmer || {};
  if (p.id) {
    html += '<div class="cr-sub">' +

      html += '<div class="cr-row"><b>' + t.id + '</b>' +
        '<span>' + (t.note || '') + '</span></div>';
    });
  }

  /* 内测玩家 */
  if (c.players && c.players.length) {
    html += '<div class="codex-group">内 测 玩 家（' + c.players.length + ' 位）</div>';
    html += '<div class="cr-grid">' +
      c.players.map(x => '<span class="cr-chip">' + x + '</span>').join('') +

  if (c.extra) html += '<div class="cr-extra">※ ' + c.extra + '</div>';

function setLogTab(t) {

function renderLog() {
  const t = _logTab || 'update';
  const tabBtn = (id, label) =>
    '<button class="log-tab' + (t === id ? ' on' : '') +

      tabBtn('update', '更新日志') +
      tabBtn('tester', '测试日志') +
      tabBtn('credits', '致谢') +

function goldBarHTML() {

/* 数字格式化：9,000,000 → 900 万 */
function fmtNum(n) {
  if (!n) return '—';
  if (n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, '') + ' 万';
  return String(n);
}

function changelogHTML() {
  let html = '<div class="sub">当前版本 <b style="color:#e6c07b">' + GAME_VERSION + '</b></div>' +
    '<div class="cl-list">';
  CHANGELOG.forEach((e, i) => {
    html += '<div class="cl-item' + (i === 0 ? ' latest' : '') + '">' +
      '<div class="cl-head">' +
        '<span class="cl-v">' + e.v + '</span>' +
        (i === 0 ? '<span class="cl-badge">最新</span>' : '') +

      '</div>' +
      '<ul class="cl-ul">' +
        e.items.map(t => '<li>' + t + '</li>').join('') +
      '</ul></div>';
  });
  html += '</div>';
  return html;
}

function testerLogHTML() {
  const hf = HALL_OF_FAME;
  const team = (hf.team && hf.team.length) ? hf.team.join(' · ') : hf.name;
  let html = '<div class="hof-head">🏅 首席测试官 · ' + team +
    '<span>每个流派他都亲手打到底 —— 本作的平衡数据，大半出自他手</span></div>';

  hf.rows.forEach(r => {
    const camp = CAMPS[r.camp] || (r.camp === 'mix' ? { name: '混', color: '#9aa2c0' } : {});

    html += '<div class="hof-row' + (r.todo ? ' todo' : '') + '">' +
      '<span class="hof-camp" style="color:' + (camp.color || '#888') + '">' + (camp.name || '') + '</span>' +
      '<b class="hof-build">' + r.build + '</b>' +

/* =========================================================
   开始界面
   ========================================================= */

const SS_TIPS = [
  '砍到手软为止。',
  '这次一定过第 40 波。',
  '谋士站前面，大哥站后面。',
  '护甲每一段都要扣，骁将心里苦。',

  '打不空就结束，没有第二回合。',
  '曹操不嫌多，郭嘉也不嫌多。',
  '点一下火柴人试试。',
];

const SS_POP = {
  meng: () => '攻击 +' + (10 + Math.floor(Math.random() * 80)),
  xiao: () => '连击 +' + (1 + Math.floor(Math.random() * 6)),
  mou:  () => '光环 +' + (8 + Math.floor(Math.random() * 22)) + '%',
};

/* ---- 开始界面小剧场：自动飘字 / 齐跳 / 公式演示 ---- */
let _ssPopTimer = null;
let _ssSyncTimer = null;
let _ssFormTimer = null;
let _ssSeq = [];

function ssPopText(el, text) {
  if (!el) return;
  const pop = el.querySelector('.ss-pop');
  if (!pop) return;
  pop.textContent = text;
  pop.classList.remove('go');
  void pop.offsetWidth;
  pop.classList.add('go');
}

function ssPopRandom(el) {
  if (!el) return;
  const fn = SS_POP[el.dataset.camp];
  ssPopText(el, fn ? fn() : '暴击！');
}

function ssExcite(el, ms) {
  if (!el || el.classList.contains('excite')) return;
  el.classList.add('excite');
  setTimeout(() => el.classList.remove('excite'), ms || 720);
}

/* 攻击 +8 → 光环 +25% → 连击 ×3 → = 30（顺手把公式演一遍） */
function ssFormula() {
  const meng = document.querySelector('.ss-fig[data-camp="meng"]');
  const mou  = document.querySelector('.ss-fig[data-camp="mou"]');
  const xiao = document.querySelector('.ss-fig[data-camp="xiao"]');
  const calc = $('ssCalc');
  if (!meng || !mou || !xiao || !calc) return;
  if ($('startScreen').classList.contains('hidden')) return;

  _ssSeq.forEach(t => clearTimeout(t));
  _ssSeq = [];
  const at = (ms, fn) => _ssSeq.push(setTimeout(fn, ms));

  at(0,    () => ssPopText(meng, '攻击 +8'));
  at(820,  () => ssPopText(mou,  '光环 +25%'));
  at(1640, () => ssPopText(xiao, '连击 ×3'));
  at(2460, () => {
    calc.textContent = '= 30';
    calc.classList.remove('go');
    void calc.offsetWidth;
    calc.classList.add('go');
    SFX.buff(2);
  });
}

function startSsShow() {
  ssStopShow();
  const ss = $('startScreen');
  if (!ss) return;

  /* 随机飘字（不点也会冒） */
  const loop = () => {
    if (ss.classList.contains('hidden')) return;
    const figs = document.querySelectorAll('.ss-fig');
    if (figs.length) ssPopRandom(figs[Math.floor(Math.random() * figs.length)]);
    _ssPopTimer = setTimeout(loop, 520 + Math.random() * 620);
  };
  _ssPopTimer = setTimeout(loop, 700);

  /* 每 12 秒一次「齐跳」 */
  _ssSyncTimer = setInterval(() => {
    if (ss.classList.contains('hidden')) return;
    document.querySelectorAll('.ss-fig').forEach(f => ssExcite(f, 700));
    SFX.hit(0.55);
  }, 12000);

  /* 6.5 秒后第一次公式演示，之后每 21 秒一次 */
  _ssSeq.push(setTimeout(ssFormula, 6500));
  _ssFormTimer = setInterval(ssFormula, 21000);
}

function ssStopShow() {
  if (_ssPopTimer) { clearTimeout(_ssPopTimer); _ssPopTimer = null; }
  if (_ssSyncTimer) { clearInterval(_ssSyncTimer); _ssSyncTimer = null; }
  if (_ssFormTimer) { clearInterval(_ssFormTimer); _ssFormTimer = null; }
  _ssSeq.forEach(t => clearTimeout(t));
  _ssSeq = [];
}

function updateSsSound() {
  const b = $('ssSound');
  if (b) b.textContent = SFX.enabled ? '🔊 音效' : '🔇 静音';
}

function showStartScreen(opt) {
  const ss = $('startScreen');
  if (!ss) return;
  const o = opt || {};
  ss.classList.remove('hidden');

  const ver = $('ssVer');
  if (ver) ver.textContent = GAME_VERSION;
  const tip = $('ssTip');
  if (tip) tip.textContent = SS_TIPS[Math.floor(Math.random() * SS_TIPS.length)];

  const btnR = $('btnResume');
  if (btnR) {
    if (o.hasSave) {
      btnR.classList.remove('hidden');
      const w = $('ssWave');
      if (w) w.textContent = o.wave || 1;
    } else {
      btnR.classList.add('hidden');
    }
  }

  const dot = $('ssLogDot');
  if (dot) dot.classList.toggle('hidden', !o.newVer);

  /* 没有存档时才提示「点开始游戏」；有存档时两个按钮都明显 */
  const hint = $('ssHint');
  if (hint) hint.classList.toggle('hidden', !!o.hasSave);

  updateSsSound();
  startSsShow();
}

function hideStartScreen() {
  const ss = $('startScreen');
  if (ss) ss.classList.add('hidden');
  ssStopShow();
}

function resumeRun() {
  closeModal();
  if (loadGame()) {
    if (!S.enemy) startWave();
    else { render(); }
  } else {
    startRun();
  }
}

function newRun() {
  closeModal();
  clearSave();
  startRun();
  if (!lsGet('sg_tut_done')) openTutorial(0);
}

/* =========================================================
   开发者调试面板（开始界面连点版本号 5 次，或顶栏版本号）
   ========================================================= */

let _devTaps = 0;
let _devTapTimer = null;

function devTap(ev) {
  if (ev) ev.stopPropagation();
  _devTaps++;
  if (_devTapTimer) clearTimeout(_devTapTimer);
  /* 5 下之内任意两下的间隔 < 2.5 秒即可，手机上也不会误判 */
  _devTapTimer = setTimeout(() => { _devTaps = 0; }, 2500);
  if (_devTaps >= 5) { _devTaps = 0; openDevPanel(); }
}

function devRow(title, desc, key) {
  const on = !!_dev[key];
  return '<div class="shop-item' + (on ? ' on-field' : '') + '">' +
    '<div class="info"><b>' + title + '</b><span>' + desc + '</span></div>' +
    '<button onclick="devToggle(\'' + key + '\')">' + (on ? '开 着' : '已关闭') + '</button></div>';
}

function devAction(title, desc, call, color) {
  return '<div class="shop-item"><div class="info">' +
    '<b' + (color ? ' style="color:' + color + '"' : '') + '>' + title + '</b>' +
    '<span>' + desc + '</span></div>' +
    '<button onclick="' + call + '"' + (color ? ' style="color:' + color + '"' : '') + '>执行</button></div>';
}

function openDevPanel() {
  const prep = (S.phase === 'prep' && S.slots.length > 0);
  const on = _dev.on;

  let html = '<h2>🔧 开发者调试</h2>' +
    '<div class="sub" style="color:' + (on ? '#ffb347' : '#7b819c') + '">' +
      (on ? '⚠ 调试模式开着：<b>本局不会存档</b>，刷新页面即完全恢复' : '调试关闭 · 一切正常存档') +
    '</div>';

  html += '<div class="shop-item' + (on ? ' on-field' : '') + '"><div class="info">' +
    '<b>调试总开关</b><span>' + (on ? '当前：开（临时）' : '当前：关') + '</span></div>' +
    '<button onclick="devToggle(\'on\')">' + (on ? '关 闭' : '开 启') + '</button></div>';

  if (on) {
    html += devRow('全部军令可用', '含「江东水军」等门槛军令 · 不写存档', 'allCmds');
    html += devRow('全部武将可用', '局外解锁临时全开 · 不写存档', 'allHeroes');

    if (prep) {
      html += devAction('金币 +50000', '当前 ' + S.gold + ' 金（本局临时）', 'devAddGold(50000)');
      html += devAction('卡槽 +5', '当前 ' + S.slots.length + ' 格', 'devAddSlot(5)');
    } else {
      html += '<div class="sub" style="color:#7b819c">（金币 / 卡槽要先进入游戏）</div>';
    }
  }

  html += devAction('清空存档', '丢掉当前这局，回到开始界面', 'devWipe()', '#e05555');
  html += devAction('重置局外解锁', '⚠ 武将回到初始 9 位、特殊军令归零', 'devResetMeta()', '#e05555');

  html += '<div class="btn-row"><button class="btn" onclick="closeModal()">关闭</button></div>';
  openModal(html);
}

function devToggle(key) {
  if (!(key in _dev)) return;
  _dev[key] = !_dev[key];
  /* 关掉总开关时，把两个子开关一起复位，避免残留 */
  if (key === 'on' && !_dev.on) { _dev.allCmds = false; _dev.allHeroes = false; }
  openDevPanel();
  toast(_dev[key] ? (key === 'on' ? '调试模式：开（不存盘）' : '已开启') : '已关闭');
  /* 只在真正开局后才重绘（开始界面还没有 S.enemy，render 会报错） */
  if (S.phase === 'prep' && S.slots.length) render();
}

/* 兼容旧调用：现在都是「开/关」而不是写 meta */
function devUnlockCmds() { _dev.on = true; _dev.allCmds = !_dev.allCmds; openDevPanel(); }
function devUnlockHeroes() { _dev.on = true; _dev.allHeroes = !_dev.allHeroes; openDevPanel(); }

function devAddGold(n) {
  if (S.phase !== 'prep') { toast('要先进入游戏'); return; }
  if (!_dev.on) { toast('先打开调试总开关'); return; }
  S.gold += n;
  render();
  toast('金币 +' + n + '（本局有效）');
  openDevPanel();
}

function devAddSlot(n) {
  if (S.phase !== 'prep') { toast('要先进入游戏'); return; }
  if (!_dev.on) { toast('先打开调试总开关'); return; }
  S.slotExtra += n;
  for (let i = 0; i < n; i++) S.slots.push(null);
  render();
  toast('卡槽 +' + n + '（本局有效）');
  openDevPanel();
}

function devWipe() {
  clearSave();
  closeModal();
  S.phase = 'over';
  toast('存档已清空');
  if ($('startScreen')) showStartScreen({ hasSave: false, wave: 1, newVer: false });
}

/* 兜底：把之前被写进 meta 的调试痕迹清掉（武将/军令回到初始） */
function devResetMeta() {
  const m = getMeta();
  m.unlocked = START_HEROES.slice();
  m.unlockedCmds = [];
  saveMeta(m);
  closeModal();
  toast('局外解锁已重置（武将 9 位 / 特殊军令 0 条）');
  if (S.phase === 'prep' && S.slots.length) render();
}

/* =========================================================
   演武场（沙盒）：任选武将 / 军令，打木桩试伤害
   ⚠ 不写存档、不记记录、不发奖励（靠 noSave() 隔离）
   ========================================================= */

const DUMMY_HP = 999999999;

function startSandbox() {
  hideStartScreen();
  /* ⚠ 绝对不能在这里 clearSave()：
     演武场靠 noSave() 隔离，本来就不写存档；
     一旦清档，玩家的主线进度会直接消失（v0.47 修复的 P0 bug） */
  S.mode = 'sandbox';
  S.wave = 0;
  S.gold = 0;
  S.uid = 1;
  S.heroes = [];
  S.weapons = [];
  S.cmdPool = [];
  S.commands = [];
  S.slots = [];
  S.slotExtra = 0;
  S.cmdExtra = 0;
  S.retryCount = 0;
  S.runDmg = 0;
  S.runBestHit = 0;
  S.recruits = 0;
  S.expAwarded = 0;
  S.rwd = { noHero: 0, recent: [] };
  S.overflowPaid = 0;
  S.phase = 'prep';
  S.enemy = { id: 'dummy', name: '木桩', hp: DUMMY_HP, maxHp: DUMMY_HP, armor: 0, isBoss: false, mechId: null };
  _selSlot = null;
  render();
  openSandboxPanel();
}

function sandboxArmor(n) {
  S.enemy.armor = n;
  render();
  openSandboxPanel();
}

function sandboxMech(id) {
  S.enemy.mechId = (id || null);
  const mech = id ? MECHS[id] : null;
  S.enemy.name = mech ? ('木桩·' + mech.label) : '木桩';
  render();
  openSandboxPanel();
}

function sandboxAddHero(id) {
  const h = makeHero(id, 3);      // 点一下直接加一张 3★
  S.heroes.push(h);
  S.slots.push(h.uid);            // 卡槽数 = 牌数
  render();
  openSandboxPanel();
}

function sandboxToggleCmd(id) {
  const i = S.commands.indexOf(id);
  if (i >= 0) S.commands.splice(i, 1);
  else S.commands.push(id);
  render();
  openSandboxPanel();
}

function sandboxClear() {
  S.heroes = [];
  S.slots = [];
  S.commands = [];
  S.uid = 1;
  _selSlot = null;
  render();
  openSandboxPanel();
}

/* ---------- 返回开始界面 ---------- */

/* 把演武场的残局从内存里清掉。
   原因：S.mode 一旦变回 'normal'，任何一次 render() 都会触发 scheduleSave()，
   而 saveGame() 只在 S.heroes 为空时才拒绝写入 —— 不清就会把木桩阵容盖到主线存档上。*/
function purgeSandboxState() {
  S.heroes = [];
  S.weapons = [];
  S.cmdPool = [];
  S.commands = [];
  S.slots = [];
  S.slotExtra = 0;
  S.cmdExtra = 0;
  S.enemy = null;
  S.wave = 1;
  S.gold = 0;
  S.uid = 1;
  S.retryCount = 0;
  S.overflowPaid = 0;
  S.rwd = { noHero: 0, recent: [] };
  _selSlot = null;
}

function backToStart() {
  if (S.phase === 'battle') { toast('战斗中不能返回'); return; }

  const wasSandbox = (S.mode === 'sandbox');

  /* 正式局先存一次，这样「继续上次」能接着打 */
  if (!wasSandbox && S.phase === 'prep' && S.heroes && S.heroes.length) {
    try { saveGame(); } catch (e) {}
  }
  closeModal();
  if (wasSandbox) purgeSandboxState();
  S.mode = 'normal';
  _selSlot = null;

  const raw = lsGet(SAVE_KEY);
  let d = null;
  try { d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
  const has = !!(d && d.v === 1 && d.heroes && d.heroes.length);
  showStartScreen({ hasSave: has, wave: has ? d.wave : 1, newVer: false });
}

function sandboxMenu() {
  closeModal();
  purgeSandboxState();          // 先清沙盒残局，再切回 normal，保住主线存档
  S.mode = 'normal';
  const raw = lsGet(SAVE_KEY);
  let d = null;
  try { d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
  const has = !!(d && d.v === 1 && d.heroes && d.heroes.length);
  showStartScreen({ hasSave: has, wave: has ? d.wave : 1, newVer: false });
}

function openSandboxPanel() {
  /* 兜底：已经离开演武场（S.enemy 被清空）就不要再渲染面板 */
  if (S.mode !== 'sandbox' || !S.enemy) return;
  const campName = { shu: '蜀', wei: '魏', wu: '吴' };
  const cnt = {};
  S.heroes.forEach(h => { cnt[h.heroId] = (cnt[h.heroId] || 0) + 1; });

  let html = '<h2>🧪 演 武 场</h2>' +
    '<div class="sub">随便组队打木桩 · <b>不写存档 / 不记记录 / 不动主线存档</b><br>' +
      '当前 ' + S.heroes.length + ' 张牌 · ' + S.commands.length + ' 条军令</div>';

  /* —— 木桩 —— */
  html += '<div class="codex-group">木 桩</div>';
  html += '<div class="sb-row"><span class="sb-lb">护甲</span>' +
    [0, 2, 4, 6].map(n => '<button class="mini-btn' + (S.enemy.armor === n ? ' on' : '') +
      '" onclick="sandboxArmor(' + n + ')">' + n + '</button>').join('') + '</div>';

  const mechs = [['', '无机制'], ['cap10', '每段≤10'], ['noPierce', '破甲无效'], ['firstHalf', '首位减半']];
  html += '<div class="sb-row"><span class="sb-lb">机制</span>' +
    mechs.map(m => '<button class="mini-btn' + ((S.enemy.mechId || '') === m[0] ? ' on' : '') +
      '" onclick="sandboxMech(\'' + m[0] + '\')">' + m[1] + '</button>').join('') + '</div>';

  /* —— 武将 —— */
  html += '<div class="codex-group">武 将（点一下 +1 张 3★）</div>';
  ['shu', 'wei', 'wu'].forEach(camp => {
    html += '<div class="sb-row"><span class="sb-lb camp-' + camp + '">' + campName[camp] + '</span>' +
      HEROES.filter(h => h.camp === camp).map(h => {
        const n = cnt[h.id] || 0;
        return '<button class="mini-btn' + (n ? ' on' : '') + '" onclick="sandboxAddHero(\'' + h.id + '\')">' +
          h.name + (n ? ' ×' + n : '') + '</button>';
      }).join('') + '</div>';
  });

  /* —— 军令 —— */
  html += '<div class="codex-group">军 令（点击开关，不限条数）</div>';
  html += '<div class="sb-row sb-wrap">' + COMMANDS.map(c => {
    const on = S.commands.indexOf(c.id) >= 0;
    return '<button class="mini-btn' + (on ? ' on' : '') + '" onclick="sandboxToggleCmd(\'' + c.id + '\')">' +
      c.name + '</button>';
  }).join('') + '</div>';

  html += '<div class="btn-row">' +
    '<button class="btn ghost" onclick="sandboxClear()">清空重来</button>' +
    '<button class="btn ghost" onclick="sandboxMenu()">回开始界面</button>' +
    '<button class="btn" onclick="closeModal()">开始试伤</button>' +
    '</div>';

  openModal(html);
}

boot();






</script>
</body>
</html>
