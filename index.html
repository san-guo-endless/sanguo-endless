/* 词条文本里的 {s}：段数保底值（黄月英「连弩」用） */
function traitSegsTxt(t, star) {
  if (!t || !t.mechSegs) return '';
  const v = t.mechSegs[(star || 1) - 1] || t.mechSegs[0] || 0;
  return fmtNum(v);
}

function cardEl(h, opts = {}) {
  const def = HERO_MAP[h.heroId];
  const mul = Math.pow(2, h.star - 1);
  const showA = def.type === 'meng' ? def.A * mul : def.A;
  const showH = def.type === 'xiao' ? def.H * mul : def.H;
  const wItem = h.weapon ? getWeapon(h.weapon) : null;
  const wDef = wItem ? WEAPON_MAP[wItem.weaponId] : null;

  let wAddA = 0, wAddH = 0;
  if (wDef && wDef.role === def.type) {
    wAddA = wDef.A;
    wAddH = wDef.H;
  }
  const plusA = wAddA ? '<span class="plus">+' + wAddA + '</span>' : '';
  const plusH = wAddH ? '<span class="plus">+' + wAddH + '</span>' : '';

  const el = document.createElement('div');
  el.className = 'card camp-' + def.camp
    + (opts.small ? ' small' : '')
    + (opts.pickable ? ' pickable' : '');

  el.innerHTML =
    '<div class="card-name">' + def.name +
      '<span class="star">' + '★'.repeat(h.star) + '</span></div>' +
    '<div class="card-type">' + TYPES[def.type].name + ' · ' + CAMPS[def.camp].name + '</div>' +
    '<div class="card-stats">' +
      '<span class="a"><b>攻</b><em class="statval">' + showA + '</em>' + plusA + '</span>' +
      '<span class="h"><b>连</b><em class="statval">' + showH + '</em>' + plusH + '</span>' +
    '</div>' +
    '<div class="card-trait">' + def.trait.name + '：' +
      def.trait.text.replace('{v}', def.trait.vals[h.star - 1]).replace('{s}', traitSegsTxt(def.trait, h.star)) + '</div>' +
    (wDef ? '<div class="card-wep">⚔ ' + wDef.name +
      (def.type === 'mou' ? '　' + wDef.text : '') + '</div>' : '');

  if (opts.inSlot) {
    const ops = document.createElement('div');
    ops.className = 'card-ops';
    ops.innerHTML =
      '<button class="mini" data-act="left">←</button>' +
      '<button class="mini" data-act="right">→</button>' +
      '<button class="mini" data-act="equip">装</button>' +
      '<button class="mini danger" data-act="remove">✕</button>';
    ops.addEventListener('click', ev => {
      const act = ev.target.dataset.act;
      if (!act) return;
      ev.stopPropagation();
      handleSlotAction(act, opts.index);
    });
    el.appendChild(ops);

    /* 点卡片本体 = 选中 / 交换（按钮里的 stopPropagation 会拦住，不会误触） */
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      selectSlot(opts.index);
    });
  }

  if (opts.inHand) {
    const ops = document.createElement('div');
    ops.className = 'card-ops';
    ops.innerHTML = '<button class="mini" data-act="equip">装</button>';
    ops.addEventListener('click', ev => {
      ev.stopPropagation();
      openEquipModal(h.uid);
    });
    el.appendChild(ops);
  }

  if (opts.onClick) {
    el.style.cursor = 'pointer';
    el.addEventListener('click', opts.onClick);
  }
  return el;
}

function renderSlots() {
  const wrap = $('slotRow');
  /* 记住滚动位置 —— 否则每次 render 都会把视角拉回第一张 */
  const prevRowScroll = Array.from(wrap.querySelectorAll('.slot-row')).map(r => r.scrollLeft);
  const prevWinY = window.scrollY;

  wrap.innerHTML = '';
  const perRow = CONFIG.slotRowMax || 6;

  for (let start = 0; start < S.slots.length; start += perRow) {
    const row = document.createElement('div');
    row.className = 'slot-row';

    for (let i = start; i < Math.min(start + perRow, S.slots.length); i++) {
      const uid = S.slots[i];
      const slot = document.createElement('div');
      slot.className = 'slot' + (uid ? ' filled' : '') + (_selSlot === i ? ' sel' : '');
      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = '#' + (i + 1);
      slot.appendChild(idx);

      if (uid) {
        const h = getHero(uid);
        if (h) slot.appendChild(cardEl(h, { inSlot: true, index: i }));
      } else {
        const hint = document.createElement('span');
        hint.textContent = '空';
        slot.appendChild(hint);
      }
      row.appendChild(slot);
    }
    wrap.appendChild(row);
  }

  /* 还原滚动位置 */
  const rows = wrap.querySelectorAll('.slot-row');
  for (let k = 0; k < rows.length; k++) {
    if (prevRowScroll[k]) rows[k].scrollLeft = prevRowScroll[k];
  }
  wrap.classList.toggle('picking', _selSlot !== null);
  if (S.phase === 'prep') window.scrollTo(0, prevWinY);
}

/* ---------- 出战序列视图：大卡（默认，好看、可横滑）/ 紧凑（6 张一排，不滑） ---------- */

let _compactSlots = false;

function applySlotView() {
  const row = $('slotRow');
  if (row) row.classList.toggle('compact', _compactSlots);
  const btn = $('btnSlotView');
  if (btn) btn.textContent = _compactSlots ? '🔍 大卡' : '🔍 紧凑';
}

function toggleSlotView() {
  _compactSlots = !_compactSlots;
  lsSet('sg_slotview', _compactSlots ? '1' : '0');
  applySlotView();
  toast(_compactSlots ? '紧凑：6 张一排，不用横滑' : '大卡：字大好认，可以横滑');
}

function renderHand() {
  const row = $('handRow');
  row.innerHTML = '';
  const used = new Set(S.slots.filter(Boolean));
  const rest = S.heroes.filter(h => !used.has(h.uid));
  if (rest.length === 0) {
    row.innerHTML = '<div class="empty-hint">牌库里没人了</div>';
    return;
  }
  rest.forEach(h => {
    row.appendChild(cardEl(h, {
      small: true, pickable: true, inHand: true,
      onClick: () => deployHero(h.uid),
    }));
  });
}

function renderWeapons() {
  const row = $('weaponRow');
  row.innerHTML = '';
  if (S.weapons.length === 0) {
    row.innerHTML = '<div class="empty-hint">暂无武器</div>';
    return;
  }
  S.weapons.forEach(w => {
    const def = WEAPON_MAP[w.weaponId];
    const owner = w.attachedTo ? getHero(w.attachedTo) : null;
    const chip = document.createElement('div');
    chip.className = 'weapon-chip' + (owner ? ' used' : '');
    chip.textContent = '【' + TYPES[def.role].name + '】' + def.name +
      (owner ? ' → ' + HERO_MAP[owner.heroId].name : '');
    chip.title = def.text;
    row.appendChild(chip);
  });
}

function cmdCat(kind) {
  if (kind === 'totem') return 'totem';
  if (kind === 'countType' || kind === 'countTypeTier' || kind === 'countTypeMou' ||
      kind === 'countCamp' || kind === 'fullSlots' || kind === 'fewSlots' ||
      kind === 'monoType' || kind === 'auraBoost' || kind === 'armorScaledA' ||
      kind === 'emptySlots') return 'team';
  if (kind === 'adjSameCamp' || kind === 'posIndex' || kind === 'lastMult' ||
      kind === 'perIndex' || kind === 'firstLast' || kind === 'fromIndex' ||
      kind === 'lastPosAdd' || kind === 'perCategory') return 'pos';
  if (kind === 'enemyArmorCond' || kind === 'enemyArmorTier' || kind === 'enemyHpCond' ||
      kind === 'enemyHpTier' || kind === 'bossMult' || kind === 'pierceAll' ||
      kind === 'minPerHit') return 'enemy';
  return 'scale';
}

function renderCommands() {
  const row = $('cmdRow');
  row.innerHTML = '';
  if (S.commands.length === 0) {
    row.innerHTML = '<div class="empty-hint">还没有军令（打 3 波后开商店）</div>';
    return;
  }
  S.commands.forEach(id => {
    const c = COMMAND_MAP[id];
    if (!c) return;                          /* 兜底：未知军令不要整页崩掉 */
    const chip = document.createElement('div');
    chip.className = 'cmd-chip cat-' + cmdCat(c.kind);
    chip.setAttribute('data-cmd', id);
    chip.innerHTML = '<b>' + c.name + '</b><i>' + c.desc + '</i>';
    row.appendChild(chip);
  });
}

/* ---------------- 伤害明细 ---------------- */

function logRowHTML(r, dim) {
  const def = HERO_MAP[r.card.heroId];

  const aTxt = '攻 <b>' + r.baseA + '</b>' +
    (r.bA ? ' <span class="add">+' + r.bA + '</span>' : '') +
    ' = <span class="num">' + r.A + '</span>';
  const hTxt = '　连 <b>' + r.baseH + '</b>' +
    (r.bH ? ' <span class="add">+' + r.bH + '</span>' : '') +
    ' = <span class="num">' + r.H + '</span>';

  let armTxt = '';
  if (r.pierce > 0) {
    armTxt = '<span class="lg-arm">破甲-' + r.pierce + '，护甲剩 ' + r.effArmor + '</span>';
  } else if (r.effArmor > 0) {
    armTxt = '<span class="lg-arm">每段 -' + r.effArmor + '</span>';
  } else {
    armTxt = '<span class="lg-arm">无护甲</span>';
  }
  const mTxt = r.mult > 1 ? '<span class="lg-mult">×' + r.mult + '</span>' : '';

  /* —— 增益来源清单（这就是"怎么增益的"）—— */
  const evParts = [];
  (r.events || []).forEach(e => {
    const cls = e.src === 'cmd' ? 'ev-cmd' : (e.src === 'weapon' ? 'ev-wpn' : 'ev-trt');
    const icon = e.src === 'cmd' ? '军令·' : (e.src === 'weapon' ? '⚔ ' : '✦ ');
    evParts.push('<span class="' + cls + '">' + icon + e.name +
      ' +' + e.val + (e.stat === 'A' ? '攻' : '连') + '</span>');
  });
  (r.mults || []).forEach(m => {
    evParts.push('<span class="ev-mul">军令·' + m.name + ' ×' + m.val + '</span>');
  });
  (r.auras || []).forEach(a => {
    evParts.push('<span class="ev-cmd">光环·' + a.name + ' +' + a.pct + '%</span>');
  });
  if (r.pierce > 0) evParts.push('<span class="ev-trt">破甲 ' + r.pierce + '</span>');

  const detail = evParts.length
    ? '<div class="log-detail">' + evParts.join(' · ') + '</div>'
    : '<div class="log-detail" style="color:#454b66">无额外增益</div>';

  return '<div class="log-row' + (dim ? ' dim' : '') + '">' +
    '<div class="log-main">' +
      '<span class="lg-idx">#' + (r.i + 1) + '</span>' +
      '<span class="lg-name">' + def.name + '</span>' +
      '<span class="lg-calc">' + aTxt + hTxt + '</span>' +
      armTxt + mTxt +
      '<span class="lg-dmg">' + r.dmg + '</span>' +
    '</div>' + detail + '</div>';
}

function renderBattleLogPreview() {
  const box = $('battleLog');
  const res = calcAll();
  if (!S.enemy || res.results.length === 0) {
    box.innerHTML = '';
    return;
  }
  box.innerHTML =

    res.results.map(r => logRowHTML(r, true)).join('');
}

/* 预估总伤害（可选，默认关） */
let _showPreview = false;

function updatePrevBtn() {
  const b = $('btnPrevToggle');
  if (!b) return;
  b.textContent = _showPreview ? '👁 预估 ON' : '👁 预估';
  b.classList.toggle('on', _showPreview);

function renderAtkPreview() {

    : '<span class="no">　✗ 差 ' + diff + '</span>');

/* =========================================================
   交互：上阵 / 排序 / 装备
   ========================================================= */

function compactSlots() {
  const filled = S.slots.filter(Boolean);
  S.slots = filled;
  if (S.mode === 'sandbox') return;   // 演武场：卡槽数 = 牌数，不补空位
  while (S.slots.length < slotsForWave(S.wave)) S.slots.push(null);
}

function deployHero(uid) {
  if (S.phase !== 'prep') return;
  if (S.slots.includes(uid)) return;
  const i = S.slots.indexOf(null);
  if (i < 0) { toast('卡槽已满，先下阵一张'); return; }
  S.slots[i] = uid;
  render();
}

function swapSlots(i, j) {
  const t = S.slots[i];
  S.slots[i] = S.slots[j];
  S.slots[j] = t;
  /* ⚠ 不要在这里 compactSlots()：
     交换位置不会改变槽位数量，一压缩就会把中间的空位吃掉，
     导致「往右挪」看起来没反应（右边是空位时直接被压回去）。 */
  render();
}

/* ---------- 点选交换：点第 1 张 → 点第 2 张 → 两张互换 ---------- */
let _selSlot = null;
let _skipMode = false;      // 本次战斗是否已点「跳过」
let _battleStartAt = 0;

function selectSlot(i) {
  if (S.phase !== 'prep') return;
  if (i == null || i < 0 || i >= S.slots.length) return;

  if (!S.slots[i]) {
    /* 有选中时点空位 = 移到该位置（插入语义：空位之后的牌顺移过来，不留空洞） */
    if (_selSlot === null) return;
    const from = _selSlot;
    _selSlot = null;
    S.slots[i] = S.slots[from];
    S.slots[from] = null;
    compactSlots();
    render();
    return;
  }

  if (_selSlot === null) {
    _selSlot = i;
    renderSlots();
    const h = getHero(S.slots[i]);
    toast('已选中 ' + (h ? HERO_MAP[h.heroId].name : '') + '　→　点另一张卡交换位置');
    return;
  }

  if (_selSlot === i) { _selSlot = null; renderSlots(); return; }

  const from = _selSlot;
  _selSlot = null;
  swapSlots(from, i);
}

function handleSlotAction(act, i) {
  if (S.phase !== 'prep') return;
  _selSlot = null;                      // 用箭头/装备/移除时清掉选中态
  if (act === 'left' && i > 0) swapSlots(i, i - 1);
  else if (act === 'right' && i < S.slots.length - 1) swapSlots(i, i + 1);
  else if (act === 'remove') {
    if (S.mode === 'sandbox') {
      /* 演武场：直接从牌库删掉这张牌 */
      S.heroes = S.heroes.filter(h => h.uid !== S.slots[i]);
      S.slots.splice(i, 1);
      render();
    } else {
      S.slots[i] = null;
      compactSlots();
      render();
    }
  }
  else if (act === 'equip') openEquipModal(S.slots[i]);
}

function openEquipModal(heroUid) {
  const h = getHero(heroUid);
  if (!h) return;
  const def = HERO_MAP[h.heroId];
  const roleName = TYPES[def.type].name;

  let html = '<h2>装备武器</h2><div class="sub">' + def.name + '（' + roleName + '）' +
    ' —— 只显示' + roleName + '专用武器</div>';

  html += '<div class="shop-item"><div class="info"><b>空手</b>' +
    '<span>卸下当前武器</span></div>' +
    '<button onclick="equipWeapon(' + heroUid + ', null)">卸下</button></div>';

  const avail = S.weapons.filter(w => {
    const wd = WEAPON_MAP[w.weaponId];
    return !!wd && wd.role === def.type;
  });

  if (avail.length === 0) {
    html += '<div class="sub">暂时没有 ' + roleName + ' 专用武器</div>';
  }

  avail.forEach(w => {
    const wd = WEAPON_MAP[w.weaponId];
    const owner = w.attachedTo ? getHero(w.attachedTo) : null;
    const mine = !!owner && owner.uid === heroUid;
    const ownerName = owner ? HERO_MAP[owner.heroId].name : '';

    html += '<div class="shop-item' + (mine ? ' on-field' : '') + '">' +
      '<div class="info"><b>' + wd.name + '</b>' +
      '<span>' + wd.text +
        (mine ? '　✓ 当前装备' : (owner ? '　⚠ 已被 ' + ownerName + ' 装备' : '')) +
      '</span></div>' +
      '<button onclick="askEquip(' + heroUid + ', ' + w.uid + ')">' +
        (mine ? '已装备' : (owner ? '换装' : '装备')) + '</button></div>';
  });

  html += '<div class="btn-row"><button class="btn ghost" onclick="closeModal()">关闭</button></div>';
  openModal(html);
}

/* 被别人占着时要二次确认 */
function askEquip(heroUid, weaponUid) {
  const me = getHero(heroUid);
  const w = getWeapon(weaponUid);
  if (!me || !w) return;
  const wd = WEAPON_MAP[w.weaponId];
  const owner = w.attachedTo ? getHero(w.attachedTo) : null;

  if (owner && owner.uid !== heroUid) {
    openModal(
      '<h2>确认换装</h2>' +
      '<div class="sub">「' + wd.name + '」现在装在 ' +
        '<b style="color:#e6c07b">' + HERO_MAP[owner.heroId].name + '</b> 身上</div>' +
      '<div class="sub">要夺过来给 <b style="color:#e6c07b">' + HERO_MAP[me.heroId].name +
        '</b> 吗？' + HERO_MAP[owner.heroId].name + ' 会变成空手。</div>' +
      '<div class="btn-row">' +
        '<button class="btn ghost" onclick="openEquipModal(' + heroUid + ')">取消</button>' +
        '<button class="btn" onclick="equipWeapon(' + heroUid + ', ' + weaponUid + ')">确定换装</button>' +
      '</div>'
    );
    return;
  }
  equipWeapon(heroUid, weaponUid);
}

function equipWeapon(heroUid, weaponUid) {
  const h = getHero(heroUid);
  if (!h) return;
  if (h.weapon) {
    const old = getWeapon(h.weapon);
    if (old) old.attachedTo = null;
    h.weapon = null;
  }
  if (weaponUid) {
    const w = getWeapon(weaponUid);
    if (w) {
      const wd = WEAPON_MAP[w.weaponId];
      if (!wd || wd.role !== HERO_MAP[h.heroId].type) {
        toast('这件武器不是该兵种专用的');
        closeModal();
        render();
        return;
      }
      if (w.attachedTo) {
        const prev = getHero(w.attachedTo);
        if (prev) prev.weapon = null;
      }
      w.attachedTo = heroUid;
      h.weapon = weaponUid;
    }
  }
  closeModal();
  render();
}

/* ---------- 批量操作：全部卸下 / 全部下阵（都带撤销）---------- */

function unequipAllWeapons() {
  if (S.phase !== 'prep') return;
  const n = S.heroes.filter(h => h.weapon).length;
  if (n === 0) { toast('没有已装备的武器'); return; }

  const snap = S.heroes.map(h => ({ uid: h.uid, weapon: h.weapon }));
  S.heroes.forEach(h => { h.weapon = null; });
  S.weapons.forEach(w => { w.attachedTo = null; });
  render();

  toastAction('已卸下 ' + n + ' 件武器', '撤销', () => {
    if (S.phase !== 'prep') { toast('战斗已开始，无法撤销'); return; }
    S.weapons.forEach(w => { w.attachedTo = null; });
    snap.forEach(s => {
      const w = s.weapon ? getWeapon(s.weapon) : null;
      const h = getHero(s.uid);
      if (h && w) { h.weapon = s.weapon; w.attachedTo = s.uid; }
    });
    render();
  });
}

function clearAllSlots() {
  if (S.phase !== 'prep') return;
  const n = S.slots.filter(Boolean).length;
  if (n === 0) { toast('出战序列已经是空的'); return; }

  const snap = S.slots.slice();
  S.slots = new Array(slotsForWave(S.wave)).fill(null);
  _selSlot = null;
  render();

  toastAction('已清空出战序列（' + n + ' 张）· 武器仍在武将身上', '撤销', () => {
    if (S.phase !== 'prep') { toast('战斗已开始，无法撤销'); return; }
    S.slots = snap.slice();
    render();
  });
}

/* =========================================================
   弹窗 / 提示
   ========================================================= */

let _resolver = null;

/* ---------- 弹窗可暂时收起（去查看棋盘/队伍） ---------- */
let _modalPending = false;     // 有没有"收起了但还没处理"的弹窗
let _pendingKind = 'reward';   // 'reward' | 'shop'

function suspendModal(kind) {
  if (!_resolver) return;
  _pendingKind = (kind === 'shop') ? 'shop' : 'reward';
  $('overlay').classList.add('hidden');
  _modalPending = true;
  updateAttackBtn();
  toast(_pendingKind === 'shop' ? '已收起商店 —— 点底部按钮回来' : '已收起战利品 —— 点底部按钮回来');
}

function resumeModal() {
  if (!_modalPending) return;
  _modalPending = false;
  $('overlay').classList.remove('hidden');
  updateAttackBtn();
}

/* 出击按钮：平时是「出击」，收起弹窗时变成「回去」 */
function updateAttackBtn() {
  const b = $('btnAttack');
  if (!b) return;
  if (_modalPending) {
    b.disabled = false;
    b.textContent = (_pendingKind === 'shop') ? '🏪 回到商店' : '🎁 领取战利品';
    b.classList.add('pending');
    return;
  }
  b.classList.remove('pending');
  if (S.phase === 'battle') return;      // 战斗中由 attack() 自己管按钮
  b.textContent = '出 击';
  const filled = S.slots.filter(Boolean).length;
  b.disabled = (S.phase !== 'prep') || filled === 0;
}

function openModal(html) {
  /* 收起弹窗期间，禁止开新弹窗 —— 否则会覆盖掉待处理的战利品/商店，导致流程卡死 */
  if (_modalPending) { toast('先点底部按钮把当前弹窗处理完'); return; }
  $('modal').innerHTML = html;
  $('overlay').classList.remove('hidden');
}
function closeModal() {
  $('overlay').classList.add('hidden');
  /* 兜底（v0.53）：任何"关弹窗"的动作都顺手解除「收起态」。
     以前 _modalPending 只由 resumeModal / resolveModal 复位，
     如果玩家收起战利品后直接点顶栏「← 返回」，标志会永久卡在 true
     → 之后 openModal() 全部被拦，军令配置 / 图鉴 / 日志全打不开。*/
  _modalPending = false;
  updateAttackBtn();
}
function showModalAsync(html) {
  openModal(html);
  return new Promise(res => { _resolver = res; });
}
function resolveModal(v) {
  const r = _resolver;
  _resolver = null;
  _modalPending = false;
  closeModal();
  updateAttackBtn();
  if (r) r(v);
}
function showMessage(title, bodyHtml, btnLabel) {
  return showModalAsync(
    '<h2>' + title + '</h2>' + bodyHtml +
    '<div class="btn-row"><button class="btn" onclick="resolveModal(1)">' + btnLabel + '</button></div>'
  );
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1400);
}

/* 带「撤销」按钮的提示（默认 3.2 秒内可点） */
function toastAction(msg, label, cb, ms) {
  const t = document.createElement('div');
  t.className = 'toast action';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.className = 'mini';
  btn.textContent = label;
  btn.addEventListener('click', ev => {
    ev.stopPropagation();
    if (t.parentNode) t.remove();
    cb();
  });
  t.appendChild(span);
  t.appendChild(btn);
  document.body.appendChild(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, ms || 3200);
}

/* 第一次遇到某种敌人机制时的说明 */
function showMechTip(id) {
  const m = MECHS[id];
  if (!m) return;
  const d = document.createElement('div');
  d.className = 'mech-tip';
  d.innerHTML = '<b>⚠ 新机制　' + m.label + '</b>' +
    '<div>' + m.tip + '</div>' +
    '<div class="mt-close">点此关闭（6 秒后自动消失）</div>';
  document.body.appendChild(d);
  const close = () => { if (d.parentNode) d.remove(); };
  d.addEventListener('click', close);
  setTimeout(close, 6000);
}

/* 随时查看某条机制的说明 */
function showMechModal(id) {

  openModal(

    '<div class="btn-row"><button class="btn" onclick="closeModal()">知道了</button></div>'
  );
}

/* =========================================================
   音效引擎（Web Audio 现场合成，不用任何音频文件）
   ========================================================= */

const SFX = {
  ctx: null,
  master: null,
  noiseBuf: null,
  enabled: true,
  volume: 0.55,

  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.enabled ? this.volume : 0;
      this.master.connect(this.ctx.destination);
      this.noiseBuf = this._makeNoise();
    } catch (e) {
      this.ctx = null;
    }
  },

  resume() {
    try {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },

  setEnabled(on) {
    this.enabled = !!on;
    if (this.master) this.master.gain.value = this.enabled ? this.volume : 0;
  },

  setVolume(v) {
    this.volume = Math.max(0, Math.min(1, v));
    if (this.master) this.master.gain.value = this.enabled ? this.volume : 0;
  },

  _ok() { return this.enabled && this.ctx && this.master; },

  _makeNoise() {
    const c = this.ctx;
    const len = Math.floor(c.sampleRate * 1.2);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },

  /* 单音：可滑音 */
  tone(freq, dur, opts) {
    if (!this._ok()) return;
    opts = opts || {};
    const c = this.ctx;
    const t0 = c.currentTime;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slideTo) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slideTo), t0 + dur);
    }
    const peak = opts.gain == null ? 0.25 : opts.gain;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + (opts.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  },

  /* 噪声：可扫频 */
  noise(dur, freq, q, gain, sweepTo) {
    if (!this._ok()) return;
    const c = this.ctx;
    const t0 = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, t0);
    if (sweepTo) bp.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t0 + dur);
    bp.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(Math.max(0.0002, gain || 0.2), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(this.master);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  },

  /* ------- 具体音效 ------- */

  hit(power) {
    if (!this._ok()) return;
    const p = Math.min(1, Math.max(0, power || 0.4));
    const jitter = 1 + (Math.random() - 0.5) * 0.1;
    this.noise(0.085, (950 - p * 520) * jitter, 1.4, 0.16 + p * 0.10);
    this.tone((95 + (1 - p) * 55) * jitter, 0.14,
      { type: 'sine', gain: 0.16 + p * 0.12, slideTo: 42 });
  },

  whoosh() {
    if (!this._ok()) return;
    this.noise(0.2, 380 + Math.random() * 120, 1.6, 0.075, 2600);
  },

  ding(v) {
    if (!this._ok()) return;
    const base = 520 + Math.min(6, Math.log10(Math.max(1, v))) * 220;
    this.tone(base, 0.16, { type: 'triangle', gain: 0.085 });
    this.tone(base * 2, 0.11, { type: 'sine', gain: 0.035 });
  },

  buff(step) {
    if (!this._ok()) return;
    const f = 392 * Math.pow(2, ((step % 12) / 12));
    this.tone(f, 0.11, { type: 'triangle', gain: 0.075 });
  },

  ult() {
    if (!this._ok()) return;
    this.tone(880, 0.16, { type: 'square', gain: 0.045 });
    this.tone(1320, 0.2, { type: 'sine', gain: 0.04 });
  },

  kill() {
    if (!this._ok()) return;
    this.noise(0.55, 300, 0.7, 0.42, 55);
    this.tone(130, 0.7, { type: 'sine', gain: 0.42, slideTo: 30 });
    this.tone(72, 0.9, { type: 'triangle', gain: 0.22, slideTo: 26 });
  },

  coin() {
    if (!this._ok()) return;
    this.tone(1180, 0.07, { type: 'square', gain: 0.05 });
    setTimeout(() => this.tone(1620, 0.09, { type: 'square', gain: 0.045 }), 55);
  },

  star() {
    if (!this._ok()) return;
    [523, 659, 784, 1046].forEach((f, i) =>
      setTimeout(() => this.tone(f, 0.16, { type: 'triangle', gain: 0.09 }), i * 72));
  },

  click() {
    if (!this._ok()) return;
    this.tone(1500, 0.03, { type: 'square', gain: 0.022 });
  },

  win() {
    if (!this._ok()) return;
    [523, 659, 784].forEach((f, i) =>
      setTimeout(() => this.tone(f, 0.26, { type: 'triangle', gain: 0.1 }), i * 88));
  },

  lose() {
    if (!this._ok()) return;
    [392, 311].forEach((f, i) =>
      setTimeout(() => this.tone(f, 0.42, { type: 'sine', gain: 0.1 }), i * 165));
  },

  /* Boss 出场：低频轰鸣 + 心跳 */
  bossEntrance() {
    if (!this._ok()) return;
    this.noise(0.9, 150, 0.55, 0.30, 42);
    this.tone(58, 1.0, { type: 'sine', gain: 0.30, slideTo: 34 });
    setTimeout(() => this.tone(46, 0.55, { type: 'triangle', gain: 0.20, slideTo: 26 }), 400);
    setTimeout(() => this.tone(46, 0.55, { type: 'triangle', gain: 0.16, slideTo: 26 }), 700);
  },

  /* 突破 / 变强 */
  powerUp() {
    if (!this._ok()) return;
    [392, 523, 784].forEach((f, i) =>
      setTimeout(() => this.tone(f, 0.2, { type: 'triangle', gain: 0.11 }), i * 72));
  },
};

/* =========================================================
   战斗流程
   ========================================================= */

function floatText(el, text, isZero) {
  const layer = $('floatLayer');
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float-num' + (isZero ? ' zero' : '');
  d.textContent = text;
  d.style.left = (r.left + r.width / 2 - 24) + 'px';
  d.style.top = (r.top + 40) + 'px';
  layer.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

/* ---------- 战斗播放节奏 ---------- */
let _userSpeed = 1;              // 玩家设定的全局倍速（会记住）
let _speed = 1;                  // 当前实际倍速（慢动作时会临时变低）
const sp = ms => Math.max(15, Math.round(ms / _speed));
/* 高倍速时省略细碎动画：手机在 40+ 张时会因「强制重排 + 大量 DOM」卡死 */
const fastFx = () => _speed > CONFIG.fastFxFrom;

function setStat(el, stat, val) {
  const em = el.querySelector(stat === 'A' ? '.card-stats .a .statval' : '.card-stats .h .statval');
  if (em) em.textContent = val;
}

function addStat(el, stat, val) {
  const em = el.querySelector(stat === 'A' ? '.card-stats .a .statval' : '.card-stats .h .statval');
  if (!em) return;
  const cur = parseInt(em.textContent, 10) || 0;
  em.textContent = cur + val;
  if (fastFx()) return;          // 高速时不强制重排（每次 offsetWidth 都是一次同步布局）
  em.classList.remove('bump');
  void em.offsetWidth;
  em.classList.add('bump');
}

function floatTag(el, text, color) {
  if (fastFx()) return;          // 高速时不生成飘字（一波会造上百个 DOM 节点）
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float-tag';
  d.textContent = text;
  if (color) d.style.color = color;
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top = (r.top + 14) + 'px';
  $('floatLayer').appendChild(d);
  setTimeout(() => d.remove(), 1100);
}

function flyDot(fromEl, toEl, color) {
  return new Promise(resolve => {
    if (fastFx() || !fromEl || !toEl) { resolve(); return; }
    const a = fromEl.getBoundingClientRect();
    const b = toEl.getBoundingClientRect();
    const x0 = a.left + a.width / 2;
    const y0 = a.top + a.height / 2;
    const dot = document.createElement('div');
    dot.className = 'fly-dot';
    if (color) dot.style.background = color;
    dot.style.left = x0 + 'px';
    dot.style.top = y0 + 'px';
    $('floatLayer').appendChild(dot);
    void dot.offsetWidth;
    dot.style.transform = 'translate(' + (b.left + b.width / 2 - x0) + 'px,' +
      (b.top + b.height / 2 - y0) + 'px) scale(1.5)';
    setTimeout(() => { dot.remove(); resolve(); }, sp(340));
  });
}

/* 滚动到卡牌，但要避开顶栏和敌人面板（它们战斗时是固定的） */
function scrollCardIntoView(el) {
  if (!el) return;
  try {
    // 1) 行内横向滚动
    const row = el.closest ? el.closest('.slot-row') : null;
    if (row && row.scrollWidth > row.clientWidth + 2) {
      const rr = row.getBoundingClientRect();
      const cr = el.getBoundingClientRect();
      if (cr.left < rr.left + 4 || cr.right > rr.right - 4) {
        row.scrollTo({ left: row.scrollLeft + (cr.left - rr.left) - 12, behavior: 'smooth' });
      }
    }

    // 2) 页面纵向滚动（避开顶栏 + 敌人面板）
    const tb = document.querySelector('.topbar');
    const en = document.querySelector('.enemy');
    const offset = (tb ? tb.offsetHeight : 0) + (en ? en.offsetHeight : 0) + 24;
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < offset || r.bottom > vh - 16) {
      const y = window.scrollY + r.top - offset - 8;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    }
  } catch (e) {}
}

/* 用 Web Animations API 播放震动：每次调用都必定重播，不会被浏览器吞掉 */
function shakeCard(el) {
  if (!el || typeof el.animate !== 'function') return;
  try {
    el.animate([
      { transform: 'translateY(0) rotate(0deg) scale(1)', boxShadow: '0 0 0 rgba(255,179,71,0)' },
      { transform: 'translateY(-13px) rotate(-2.5deg) scale(1.10)', boxShadow: '0 0 30px rgba(255,179,71,.85)', offset: 0.12 },
      { transform: 'translateY(3px) rotate(2deg) scale(1.02)', offset: 0.32 },
      { transform: 'translateY(-6px) rotate(-1.2deg) scale(1.05)', offset: 0.52 },
      { transform: 'translateY(2px) rotate(.6deg) scale(1.01)', offset: 0.72 },
      { transform: 'translateY(0) rotate(0deg) scale(1)', boxShadow: '0 0 0 rgba(255,179,71,0)' }
    ], { duration: 380, easing: 'cubic-bezier(.36,.07,.19,.97)' });
  } catch (e) {}
}

/* 先让数字跳满，再出手 */
async function playCard(r, el, allEls) {
  if (!el) return;
  allEls.forEach(x => x.classList.remove('active', 'hit', 'multiplied'));
  el.classList.add('active');
  if (!fastFx()) scrollCardIntoView(el);   // 高速时不做滚动（每次都触发同步布局）

  setStat(el, 'A', r.baseA);
  setStat(el, 'H', r.baseH);
  await sleep(sp(160));

  /* —— 吃到谋士光环 —— */
  if (r.auras && r.auras.length) {
    for (const a of r.auras) {
      floatTag(el, '『' + a.name + '』光环 +' + a.pct + '%', '#ffd479');
      SFX.buff(4);
      await sleep(sp(230));
    }
  }

  /* —— 逐条增益 —— */
  let buffStep = 0;
  for (const e of r.events) {
    const isCmd = e.src === 'cmd';
    if (isCmd) {
      const src = document.querySelector('.cmd-chip[data-cmd="' + e.ref + '"]');
      if (src) {
        src.classList.add('firing');
        flyDot(src, el);            // 不等待，让弹道和数字跳动同步
      }
      floatTag(el, '【' + e.name + '】+ ' + e.val, '#c9a8e8');
    } else {
      floatTag(el, (e.src === 'weapon' ? '⚔ ' : '✦ ') + e.name + ' +' + e.val);
    }
    addStat(el, e.stat, e.val);
    SFX.buff(buffStep++);
    await sleep(sp(isCmd ? 330 : 195));
    document.querySelectorAll('.cmd-chip.firing').forEach(x => x.classList.remove('firing'));
  }

  /* —— 倍率（末位 ×2 / Boss ×1.5）—— */
  for (const m of r.mults) {
    const src = document.querySelector('.cmd-chip[data-cmd="' + m.ref + '"]');
    if (src) {
      src.classList.add('firing');
      flyDot(src, el, '#ffd479');
    }
    floatTag(el, '×' + m.val + '　' + m.name, '#ffd479');
    el.classList.add('multiplied');
    SFX.ult();
    await sleep(sp(320));
    document.querySelectorAll('.cmd-chip.firing').forEach(x => x.classList.remove('firing'));
  }

  /* —— 护甲 / 破甲 —— */
  if (r.pierce > 0) {
    floatTag(el, '破甲 ' + r.pierce, '#5cb85c');
    await sleep(sp(150));
  } else if (r.effArmor > 0) {
    floatTag(el, '护甲 −' + r.effArmor + ' /段', '#8a90a8');
    await sleep(sp(150));
  }

  /* —— 出伤 —— */
  el.classList.remove('active');
  el.classList.remove('hit');
  const power = Math.min(1, (r.dmg / Math.max(20, S.enemy.maxHp)) * 1.4);
  SFX.hit(power);
  shakeCard(el);
  await sleep(sp(320));
  el.classList.remove('multiplied');
}

/* ---------- 跳过战斗（方案 A：把倍速拉满，复用同一套结算）---------- */
function skipBattle() {
  if (S.phase !== 'battle') return;
  if (_skipMode) return;
  if (Date.now() - _battleStartAt < 300) return;   // 防开局双击直接跳过
  _skipMode = true;
  _speed = 60;
  const b = $('btnAttack');
  if (b) { b.disabled = true; b.textContent = '结算中…'; b.classList.remove('skip'); }
  toast('已跳过演出，直接结算');
}

async function attack() {
  if (S.phase !== 'prep') return;
  const { results } = calcAll();
  if (results.length === 0) return;

  S.phase = 'battle';
  snapshotForRetry();
  _selSlot = null;
  _skipMode = false;
  _battleStartAt = Date.now();
  /* 牌一多就自动加速（8 张以内不变），避免 22 张牌打一分半 */
  const battleSpeed = Math.max(
    _userSpeed,
    1 + Math.max(0, results.length - CONFIG.autoSpeedFrom) * CONFIG.autoSpeedStep
  );
  const autoBoost = battleSpeed > _userSpeed + 0.001;
  _speed = battleSpeed;
  document.body.classList.add('battling');
  render();
  /* 战斗中「出击」按钮变成「跳过」：点了把倍速拉满，复用同一套结算 */
  const btnAtk = $('btnAttack');
  btnAtk.disabled = false;
  btnAtk.textContent = '⏭ 跳过';
  btnAtk.classList.add('skip');
  resetDmgPop();

  const box = $('battleLog');
  box.innerHTML = '<div class="bl-title">结算中…（' + results.length + ' 张' +
    (autoBoost ? ' · 自动 ' + battleSpeed.toFixed(1) + '× 加速' : '，按顺序逐张打') +
    '）</div>';

  const cardEls = Array.from(document.querySelectorAll('#slotRow .card'));
  cardEls.forEach(el => el.classList.add('in-battle'));

  let acc = 0;
  let killed = false;
  let maxHit = 0;
  let maxFirstHit = 0;
  let maxLastHit = 0;

  for (const r of results) {
    await playCard(r, cardEls[r.i], cardEls);
    box.insertAdjacentHTML('beforeend', logRowHTML(r, false));
    newRowsScroll(box);

    const willKill = !killed && (acc + r.dmg) >= S.enemy.maxHp;
    const isOver = killed && !willKill;              // 敌人已经死了，这是溢出伤害
    if (willKill) { killed = true; _speed = _skipMode ? 60 : Math.max(0.45, battleSpeed * 0.5); }  // 击杀慢动作（跳过模式下不慢放）

    await flyDamage(cardEls[r.i], r.dmg, isOver);    // 伤害数字飞向敌人

    acc += r.dmg;
    if (r.dmg > maxHit) maxHit = r.dmg;
    if (r.i === 0 && r.dmg > maxFirstHit) maxFirstHit = r.dmg;
    if (r.i === results.length - 1 && r.dmg > maxLastHit) maxLastHit = r.dmg;
    S.enemy.hp = Math.max(0, S.enemy.maxHp - acc);
    renderEnemy();

    /* 溢出金币实时入账（只有 Boss 战） */
    if (S.enemy.isBoss && acc > S.enemy.maxHp) {
      const totalOverGold = Math.floor((acc - S.enemy.maxHp) / CONFIG.overflowDivBoss);
      const got = Math.max(0, totalOverGold - (S.overflowPaid || 0));
      if (got > 0) {
        S.overflowPaid = (S.overflowPaid || 0) + got;
        S.gold += got;
        $('uiGold').textContent = S.gold;
        floatGold(got);
        SFX.coin();
      }
    }

    updateDmgPop(acc, willKill);
    if (willKill) triggerKillFx();

    if (willKill) {
      if (S.enemy.isBoss) {
        await sleep(260);
        _speed = _skipMode ? 60 : Math.max(battleSpeed, 2.2);   // Boss 击杀后：剩下的牌快速带过
        await sleep(60);
      } else {
        _speed = _skipMode ? 60 : Math.max(battleSpeed, 2.6);   // 普通波击杀后：加速鞭尸
        await sleep(60);
      }
    } else {
      await sleep(sp(150));
    }
  }

  _speed = _userSpeed;
  _skipMode = false;

  /* 本局最高「单波总伤害」→ 战功来源。
     ⚠ 注意口径：这里记的是"一次出招打出的总伤害"（acc），
     和面板上「最高单波」是同一个数 —— 之前错记成"单张牌最高"，所以战功看起来只有一半。*/
  if (acc > (S.runBestHit || 0)) S.runBestHit = acc;

  const btnEnd = $('btnAttack');
  if (btnEnd) { btnEnd.textContent = '出 击'; btnEnd.classList.remove('skip'); }
  document.body.classList.remove('battling');
  await sleep(sp(500));

  /* 记录个人最佳 + 检查解锁（演武场 / 调试模式不写） */
  if (!noSave()) {
  try {
    const mm = getMeta();
    let changed = false;
    if (maxHit > (mm.stats.maxSingleHit || 0)) { mm.stats.maxSingleHit = maxHit; changed = true; }
    if (maxFirstHit > (mm.stats.maxFirstHit || 0)) { mm.stats.maxFirstHit = maxFirstHit; changed = true; }
    if (maxLastHit > (mm.stats.maxLastHit || 0)) { mm.stats.maxLastHit = maxLastHit; changed = true; }
    if (changed) saveMeta(mm);
  } catch (e) {}
  checkUnlocks();
  }

  if (S.mode === 'sandbox') {
    onSandboxResult(acc, results);
  } else if (acc >= S.enemy.maxHp) {
    await onWin(acc, results);
  } else {
    onLose(acc, results);
  }
}

/* ---------- 演武场：打木桩的结果 ---------- */
function onSandboxResult(dmg, results) {
  SFX.win();
  S.phase = 'prep';
  S.enemy.hp = S.enemy.maxHp;   // 木桩回满
  render();

  let maxHit = 0, maxCard = '';
  (results || []).forEach(r => {
    if (r.dmg > maxHit) { maxHit = r.dmg; const h = HERO_MAP[r.card.heroId]; maxCard = h ? h.name : ''; }
  });

  openModal(
    '<h2>试伤结果</h2>' +
    '<div class="big-num">' + dmg + '</div>' +
    '<div class="sub">本次总伤害' +
      (maxCard ? '　·　最高单卡 ' + maxCard + ' ' + maxHit : '') + '</div>' +
    damageBreakdownHTML(results, dmg) +
    '<div class="btn-row">' +
      '<button class="btn ghost" onclick="closeModal()">继续调整</button>' +
      '<button class="btn" onclick="openSandboxPanel()">改配置</button>' +
    '</div>'
  );
}

/* ---------- 敌人身上的累计伤害数字 ---------- */

function resetDmgPop() {
  const el = $('dmgPop');
  if (!el) return;
  el.textContent = '';
  el.style.opacity = '0';
  el.classList.remove('pop', 'kill');
}

function updateDmgPop(total, isKill) {
  const el = $('dmgPop');
  if (!el) return;
  el.textContent = total;
  el.style.opacity = '1';
  el.style.fontSize = Math.min(80, 26 + String(total).length * 9) + 'px';
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  el.classList.toggle('kill', !!isKill);
  SFX.ding(total);
}

/* 单张武将的伤害数字：从卡牌飞向敌人身上，然后并入累计值 */
function flyDamage(fromEl, dmg, isOver) {
  return new Promise(resolve => {
    const pop = $('dmgPop');
    if (!fromEl || !pop) { resolve(); return; }

    const a = fromEl.getBoundingClientRect();
    const b = pop.getBoundingClientRect();
    const x0 = a.left + a.width / 2;
    const y0 = a.top + 22;

    // 目标点钳制到可见范围（手机上敌人面板可能被滚出屏幕）
    const bx = Math.max(56, Math.min(window.innerWidth - 56, b.left + b.width / 2));
    const by = Math.max(96, Math.min(window.innerHeight - 48, b.top + b.height / 2));

    const el = document.createElement('div');
    el.className = 'fly-dmg' + (isOver ? ' over' : '');
    el.textContent = dmg;
    el.style.left = x0 + 'px';
    el.style.top = y0 + 'px';
    el.style.transform = 'translate(-50%, 0) scale(1)';
    $('floatLayer').appendChild(el);
    SFX.whoosh();

    void el.offsetWidth;
    const dx = bx - x0;
    const dy = by - y0;
    el.style.transform = 'translate(calc(-50% + ' + dx + 'px), ' + dy + 'px) scale(.42)';
    el.style.opacity = '0.7';

    setTimeout(() => { el.remove(); resolve(); }, sp(400));
  });
}

/* 溢出金币的小飘字 */
function floatGold(n) {
  const pop = $('dmgPop');
  if (!pop) return;
  const r = pop.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'float-gold';
  d.textContent = '+' + n + ' 金';
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top = (r.top + r.height + 4) + 'px';
  $('floatLayer').appendChild(d);
  setTimeout(() => d.remove(), 1000);
}

/* 击杀瞬间的打击感：震屏 + 闪光 + 「击杀」大字 */
function triggerKillFx() {
  SFX.kill();
  const body = document.body;
  body.classList.remove('screen-shake');
  void body.offsetWidth;
  body.classList.add('screen-shake');
  setTimeout(() => body.classList.remove('screen-shake'), 500);

  const f = $('screenFlash');
  if (f) {
    f.classList.remove('on');
    void f.offsetWidth;
    f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 540);
  }

  const box = $('enemyBox');
  if (box) {
    const r = box.getBoundingClientRect();
    const k = document.createElement('div');
    k.className = 'kill-text';
    k.textContent = '击杀';
    k.style.left = (r.left + r.width / 2) + 'px';
    k.style.top = (r.top + r.height / 2) + 'px';
    $('floatLayer').appendChild(k);
    setTimeout(() => k.remove(), 1150);
  }
}

function newRowsScroll(box) {
  const rows = box.querySelectorAll('.log-row');
  const last = rows[rows.length - 1];
  if (!last) return;
  /* 只滚"战报容器自己"，不要用 scrollIntoView ——
     否则战报在屏幕外时会把【整个页面】往下拽，
     出击/跳过按钮（在战报上方）就被拖出视野了。*/
  try { box.scrollTop = box.scrollHeight; } catch (e) {}
}

function waveGold(wave, isBoss) {
  const base = isBoss ? CONFIG.goldPerBoss : CONFIG.goldPerWaveBase;
  return base + CONFIG.goldPerWaveStep * (wave - 1);
}

/* 每个武将的伤害占比 */
function damageBreakdownHTML(results, total) {
  if (!results || results.length === 0) return '';
  const sorted = results.slice().sort((a, b) => b.dmg - a.dmg);
  const top = sorted[0].dmg;

  let html = '<div class="db-title">伤 害 占 比</div>';
  sorted.forEach((r, idx) => {
    const pct = total > 0 ? Math.round(r.dmg / total * 100) : 0;
    const isTop = idx === 0 && top > 0;
    const evs = (r.events || []).slice(0, 5)
      .map(e => e.name + ' +' + e.val).join(' · ');
    html += '<div class="db-row' + (isTop ? ' top' : '') + '">' +
      '<div class="db-line">' +
        '<span class="db-rank">' + (idx + 1) + '</span>' +
        '<span class="db-name">' + HERO_MAP[r.card.heroId].name + '</span>' +
        '<span class="db-bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="db-pct">' + pct + '%</span>' +
        '<span class="db-num">' + r.dmg + '</span>' +
        '<span class="db-seg">' + r.H + ' 段</span>' +
      '</div>' +
      '<div class="db-ev">' + (evs ? evs : '无额外增益') + '</div>' +
      '</div>';
  });
  return html;
}

async function onWin(dmg, results) {
  SFX.win();
  const baseGold = waveGold(S.wave, S.enemy.isBoss);
  const over = Math.max(0, dmg - S.enemy.maxHp);
  const overGoldTotal = S.enemy.isBoss ? Math.floor(over / CONFIG.overflowDivBoss) : 0;
  const alreadyPaid = S.overflowPaid || 0;
  const restOver = Math.max(0, overGoldTotal - alreadyPaid);
  const gold = baseGold + restOver;

  S.gold += gold;
  S.bestWave = Math.max(S.bestWave, S.wave);
  S.runDmg = (S.runDmg || 0) + dmg;      // 本局累计总伤（含溢出）
  bumpRecord('bestWave', S.wave);
  bumpRecord('bestDmg', dmg);

  /* 局外统计 */
  try {
    const mm = getMeta();
    const st = mm.stats;
    st.totalWaves = (st.totalWaves || 0) + 1;
    st.bestWave = Math.max(st.bestWave || 0, S.wave);
    st.bestDmg = Math.max(st.bestDmg || 0, dmg);
    st.maxCmd = Math.max(st.maxCmd || 0, S.commands.length);
    const wu = deployedHeroes().filter(h => HERO_MAP[h.heroId].camp === 'wu').length;
    st.maxWu = Math.max(st.maxWu || 0, wu);
    const types = {};
    deployedHeroes().forEach(h => { types[HERO_MAP[h.heroId].type] = 1; });
    st.maxTypes = Math.max(st.maxTypes || 0, Object.keys(types).length);
    st.maxWeapons = Math.max(st.maxWeapons || 0, S.weapons.filter(w => w.attachedTo).length);
    if (S.enemy && S.enemy.id) st.kills[S.enemy.id] = (st.kills[S.enemy.id] || 0) + 1;

    /* 阵营门槛军令：统计「上阵 ≥N 张同阵营牌通过第 W 波」的次数 */
    if (!st.waves4) st.waves4 = { shu: 0, wei: 0, wu: 0 };
    const campNum = { shu: 0, wei: 0, wu: 0 };
    deployedHeroes().forEach(h => {
      const cp = HERO_MAP[h.heroId].camp;
      if (campNum[cp] != null) campNum[cp]++;
    });
    if (S.wave >= CONFIG.campCmdWave) {
      ['shu', 'wei', 'wu'].forEach(k => {
        if (campNum[k] >= CONFIG.campCmdCards) st.waves4[k] = (st.waves4[k] || 0) + 1;
      });
    }

    saveMeta(mm);
  } catch (e) {}
  checkUnlocks();
  checkCmdUnlocks();

  const wonWave = S.wave;
  S.wave++;

  await showModalAsync(
    '<h2>胜 利</h2>' +
    '<div class="big-num">' + dmg + '</div>' +
    '<div class="sub">总伤害 · 敌人血量 ' + S.enemy.maxHp +
      (over > 0 ? '（溢出 ' + over + '）' : '') + '</div>' +
    '<div class="sub" style="color:#e6c07b">获得金币 <b>' + gold + '</b>' +
      (overGoldTotal > 0
        ? '　= 基础 ' + baseGold + ' + 溢出 ' + overGoldTotal
        : '') + '</div>' +
    damageBreakdownHTML(results, dmg) +
    '<div class="btn-row"><button class="btn" onclick="resolveModal(1)">继续</button></div>'
  );

  await openReward();
  if (wonWave % CONFIG.shopEvery === 0) await openShop();
  startWave();
}

/* ---------- 失败重排（花金币回到本波） ---------- */
let _retryState = null;

function snapshotForRetry() {
  try {
    _retryState = JSON.parse(JSON.stringify({
      wave: S.wave,
      uid: S.uid,
      slotExtra: S.slotExtra,
      cmdExtra: S.cmdExtra,
      heroes: S.heroes,
      weapons: S.weapons,
      cmdPool: S.cmdPool,
      commands: S.commands,
      slots: S.slots,
      enemy: S.enemy,
      runDmg: S.runDmg,        // 重排要回滚本局总伤，否则花金币能刷战功
    }));
  } catch (e) {
    _retryState = null;
  }
}

function retryCost() {
  const i = Math.min(S.retryCount || 0, CONFIG.retryCost.length - 1);
  return CONFIG.retryCost[i];
}

function retryWave() {
  if (!_retryState) { toast('没有可重排的进度'); return; }
  const cost = retryCost();
  if (S.gold < cost) { toast('金币不足'); return; }

  const st = _retryState;
  S.gold -= cost;
  S.retryCount = (S.retryCount || 0) + 1;

  S.wave = st.wave;
  S.uid = st.uid;
  S.slotExtra = st.slotExtra;
  S.cmdExtra = st.cmdExtra;
  S.heroes = st.heroes;
  S.weapons = st.weapons;
  S.cmdPool = st.cmdPool;
  S.commands = st.commands;
  S.slots = st.slots;
  S.enemy = st.enemy;
  S.runDmg = st.runDmg || 0;
  S.phase = 'prep';
  S.overflowPaid = 0;

  closeModal();
  resetDmgPop();
  render();
  toast('回到第 ' + S.wave + ' 波（−' + cost + ' 金）');
}

/* ---------- 成长诊断：这局有没有"会自己长大的东西" ---------- */
function growthHTML(results, dmg) {
  if (!results || !results.length) return '';
  const heroes = deployedHeroes();

  /* 会随「牌数 / 军令数」变多的东西 = 引擎 */
  const SCALE_HERO = ['perPrev', 'perPrevCamp', 'perPlayed', 'perIndex', 'surroundCamp'];
  const SCALE_CMD = ['countType', 'countTypeTier', 'countTypeMou', 'countCamp',
    'perCommand', 'perIndex', 'fromIndex', 'monoType', 'emptySlots', 'fullSlots',
    'auraBoost', 'armorScaledA', 'enemyArmorCond', 'enemyArmorTier',
    'enemyHpCond', 'enemyHpTier'];

  const engines = [];
  heroes.forEach(h => {
    const t = HERO_MAP[h.heroId].trait;
    if (!t) return;
    if (SCALE_HERO.indexOf(t.kind) >= 0) engines.push(HERO_MAP[h.heroId].name + '·' + t.name);
    else if (t.kind === 'auraCamp') engines.push('光环·' + HERO_MAP[h.heroId].name);
  });
  S.commands.forEach(id => {
    const c = COMMAND_MAP[id];
    if (c && SCALE_CMD.indexOf(c.kind) >= 0) engines.push(c.name);
  });

  const hp = (S.enemy && S.enemy.maxHp) ? S.enemy.maxHp : 0;
  const pct = hp > 0 ? Math.round(dmg / hp * 100) : 0;
  const ok = engines.length > 0;

  let html = '<div class="grow-box' + (ok ? '' : ' warn') + '">' +
    '<div class="grow-title">📊 成长诊断</div>' +
    '<div class="grow-line">' + heroes.length + ' 张牌 · ' + S.commands.length +
      ' 条军令 · ' + S.slots.length + ' 个卡槽</div>' +
    '<div class="grow-line">这一刀 <b>' + fmtNum(dmg) + '</b> / 敌人血量 ' + fmtNum(hp) +
      '　→　<b class="' + (pct >= 100 ? 'gok' : 'gbad') + '">' + pct + '%</b>' +
      (pct < 100 ? '（还差 ' + fmtNum(Math.max(0, hp - dmg)) + '）' : '') + '</div>';

  if (ok) {
    html += '<div class="grow-line">成长引擎：<b class="gok">有</b> —— ' +
      engines.slice(0, 4).join(' · ') + (engines.length > 4 ? ' …' : '') + '</div>';
  } else {
    html += '<div class="grow-line">成长引擎：<b class="gbad">没有</b></div>' +
      '<div class="grow-tip">你的加成全部来自<b>牌本身</b>，没有一项会随「牌数 / 军令数」变多。' +
      '伤害会停在这里，而敌人血量每波 ×1.18。</div>';
  }
  html += '</div>';
  return html;
}

async function onLose(dmg, results) {
  SFX.lose();
  S.phase = 'over';
  S.runDmg = (S.runDmg || 0) + dmg;      // 最后这一刀也算进本局总伤
  clearSave();

  try {
    const mm = getMeta();
    mm.stats.runs = (mm.stats.runs || 0) + 1;
    saveMeta(mm);
  } catch (e) {}

  /* 战功结算（累计制，只补「还没结算过」的那部分） */
  const expGot = awardRunExp();
  checkAchievements();
  if (expGot && expGot.leveled) playLevelUpFx(expGot.before.lv, expGot.after.lv);

  const diff = S.enemy.maxHp - dmg;
  const rec = getRecords();
  const cost = retryCost();
  const canRetry = !!_retryState && S.gold >= cost;

  openModal(
    '<h2>战 败</h2>' +
    '<div class="sub">第 ' + S.wave + ' 波 · ' + S.enemy.name + '</div>' +
    '<div class="big-num">' + dmg + '</div>' +
    '<div class="sub">还差 ' + diff + ' 点伤害</div>' +
    '<div class="sub" style="margin-top:12px;color:#9aa2c0">' +
      '历史最远 第 ' + (rec.bestWave || S.wave) + ' 波' +
      (rec.bestDmg ? '　·　最高单波 ' + rec.bestDmg : '') +
    '</div>' +
    expSettleHTML(expGot) +
    growthHTML(results, dmg) +
    damageBreakdownHTML(results, dmg) +
    '<div class="btn-row">' +
      '<button class="btn ghost" onclick="restart()">重新开始</button>' +
      (canRetry
        ? '<button class="btn" onclick="retryWave()">花 ' + cost + ' 金重排</button>'
        : '<button class="btn" disabled>金币不足（需 ' + cost + '）</button>') +
    '</div>'
  );
}

function restart() {
  closeModal();
  _retryState = null;
  startRun();
}

/* =========================================================
   奖励 / 升星
   ========================================================= */

/* 持有情况：按星级分别统计（升星是自动的，所以每个星级最多 1 张） */
function heroOwnBadge(heroId, star) {
  const st = star || 1;
  const own = S.heroes.filter(h => h.heroId === heroId);
  if (own.length === 0) return '<div class="rb new">✦ 未拥有 · 新武将</div>';

  const label = own.map(h => h.star + '★').join(' + ');
  const same = own.some(h => h.star === st);

  if (same && st < CONFIG.maxStar) {
    return '<div class="rb up">已有 ' + label + '<b>同名合并 → 升星</b></div>';
  }
  if (own.every(h => h.star >= CONFIG.maxStar)) {
    return '<div class="rb max">已有 ' + label + '（已满）</div>';
  }
  return '<div class="rb">已有 ' + label + '</div>';
}

function weaponOwnBadge(weaponId) {
  const n = S.weapons.filter(w => w.weaponId === weaponId).length;
  if (n === 0) return '<div class="rb new">✦ 未拥有</div>';
  return '<div class="rb">已有 ×' + n + '</div>';
}

function optionCardHTML(o) {
  if (o.kind === 'hero') {
    const d = HERO_MAP[o.id];
    const st = Math.min(o.star || 1, CONFIG.maxStar);
    return '<div class="card camp-' + d.camp + '">' +
      '<div class="card-name">' + d.name +
        '<span class="star">' + '★'.repeat(st) + '</span></div>' +
      '<div class="card-type">' + TYPES[d.type].name + ' · ' + CAMPS[d.camp].name + '</div>' +
      '<div class="card-stats">' +
        '<span class="a"><b>攻</b>' + (d.type === 'meng' ? d.A * Math.pow(2, st - 1) : d.A) + '</span>' +
        '<span class="h"><b>连</b>' + (d.type === 'xiao' ? d.H * Math.pow(2, st - 1) : d.H) + '</span></div>' +
      '<div class="card-trait">' + d.trait.name + '：' +
        d.trait.text.replace('{v}', d.trait.vals[st - 1]).replace('{s}', traitSegsTxt(d.trait, st)) + '</div>' +
      heroOwnBadge(o.id, st) +
      '</div>';
  }
  const w = WEAPON_MAP[o.id];
  return '<div class="card"><div class="card-name">⚔ ' + w.name + '</div>' +
    '<div class="card-type">' + TYPES[w.role].name + '专用武器</div>' +
    '<div class="card-trait">' + w.text + '</div>' +
    weaponOwnBadge(o.id) + '</div>';
}

function willStarUp(heroId, star) {
  const st = star || 1;
  if (st >= CONFIG.maxStar) return false;
  return S.heroes.some(h => h.heroId === heroId && h.star === st);
}

function rerollCost(n) {
  const arr = CONFIG.rerollCost;
  return arr[Math.min(n, arr.length - 1)];
}

function doReroll() { resolveModal('reroll'); }

async function openReward() {
  let rerolls = 0;
  let o = null;

  for (;;) {
    const opts = rollRewardOpts();
    const canUp = opts.filter(x => x.kind === 'hero' && willStarUp(x.id, x.star)).length;
    const cost = rerollCost(rerolls);
    const atCap = rerolls >= CONFIG.rerollMax;
    const canReroll = !atCap && S.gold >= cost;

    let html = '<h2>战 利 品</h2>' + goldBarHTML() +
      '<div class="sub">三选一' +
        (rerolls > 0 ? '（已重抽 ' + rerolls + '/' + CONFIG.rerollMax + ' 次）' : '') + '</div>' +
      '<div class="reward-hint">💡 同名武将 ×2 → <b>自动升星</b>（属性翻倍）' +
        (canUp > 0 ? '<br><b style="color:#7ee07e">绿框这张拿了就能升星！</b>' : '') +
      '</div>' +
      '<div class="modal-cards">';

    opts.forEach((x, i) => {
      const up = x.kind === 'hero' && willStarUp(x.id, x.star);
      html += '<div class="opt-wrap' + (up ? ' can-up' : '') +
        '" onclick="resolveModal(' + i + ')">' + optionCardHTML(x) + '</div>';
    });
    html += '</div>';

    html += '<div class="btn-row">' +
      '<button class="btn ghost" onclick="suspendModal(\'reward\')">← 查看队伍</button>' +
      '<button class="btn ghost" ' +
      (canReroll ? '' : 'disabled ') +
      'onclick="doReroll()">' +
      (atCap ? '🔄 本波重抽已用完（' + CONFIG.rerollMax + ' 次）' : '🔄 重抽（' + cost + ' 金）') +
      '</button></div>';

    const pick = await showModalAsync(html);

    if (pick === 'reroll') {
      if (atCap || S.gold < cost) continue;
      S.gold -= cost;
      rerolls++;
      SFX.coin();
      $('uiGold').textContent = S.gold;
      continue;
    }

    o = opts[pick] || opts[0];
    break;
  }

  if (o.kind === 'hero') {
    S.heroes.push(makeHero(o.id, o.star || 1));
    if (!S.rwd) S.rwd = { noHero: 0, recent: [] };
    S.rwd.noHero = 0;
    S.rwd.recent.push(o.id);
    if (S.rwd.recent.length > 3) S.rwd.recent = S.rwd.recent.slice(-3);
  } else {
    S.weapons.push(makeWeapon(o.id));
    if (!S.rwd) S.rwd = { noHero: 0, recent: [] };
    S.rwd.noHero = (S.rwd.noHero || 0) + 1;
  }

  const upgraded = autoStarUp();
  render();
  if (upgraded) { toast('升 星 成 功！'); SFX.star(); }
}

/* 生成三个选项（含防脸黑 / 保底 / 2★） */

/* 谋士递减供给：已有谋士越多，越难再抽到 */
function mouOwned() {
  return S.heroes.filter(h => HERO_MAP[h.heroId] && HERO_MAP[h.heroId].type === 'mou').length;
}
function rewardWeight(h) {
  if (!h || h.type !== 'mou') return 1;
  return 1 / (1 + CONFIG.mouDecay * mouOwned());
}
function pickRewardHero(list) {
  return pickWeighted(list, list.map(rewardWeight));
}

function rollRewardOpts() {
  const pool0 = unlockedHeroes();
  const pool = pool0.length ? pool0 : HEROES;
  if (!S.rwd) S.rwd = { noHero: 0, recent: [] };
  const rwd = S.rwd;

  let cands = pool.filter(h => (rwd.recent || []).indexOf(h.id) < 0);
  if (cands.length < 3) cands = pool.slice();

  const filled = S.slots.filter(Boolean).length;
  let wChance = CONFIG.weaponChance;
  if (filled < S.slots.length) wChance = 0.15;
  if ((rwd.noHero || 0) >= 3) wChance = 0;

  const opts = [];
  for (let k = 0; k < CONFIG.rewardOptions; k++) {
    if (Math.random() < wChance) opts.push({ kind: 'weapon', id: pick(WEAPONS).id });
    else opts.push({ kind: 'hero', id: pickRewardHero(cands).id, star: 1 });
  }
  if (!opts.some(x => x.kind === 'hero')) {
    opts[0] = { kind: 'hero', id: pickRewardHero(cands).id, star: 1 };
  }

  const dups = S.heroes.filter(x => x.star === 1 && HERO_MAP[x.heroId]);
  if (dups.length > 0 && Math.random() < 0.45) {
    const slot = opts.findIndex(x => x.kind === 'hero');
    if (slot >= 0) {
      const dupDefs = dups.map(x => HERO_MAP[x.heroId]);
      opts[slot] = { kind: 'hero', id: pickRewardHero(dupDefs).id, star: 1 };
    }
  }

  let star2 = 0;
  if (S.wave >= 6) star2 = Math.min(0.32, 0.08 + (S.wave - 6) * 0.025);
  if (S.heroes.some(h => h.star >= 2)) star2 = Math.min(0.38, star2 + 0.06);
  if (star2 > 0 && Math.random() < star2) {
    const slot = opts.findIndex(x => x.kind === 'hero' && x.star === 1);
    if (slot >= 0) opts[slot].star = 2;
  }

  return opts;
}

function autoStarUp() {
  let merged = false;
  let guard = 0;
  while (guard++ < 50) {
    let did = false;
    for (let star = 1; star < CONFIG.maxStar; star++) {
      const groups = {};
      S.heroes.forEach(h => {
        if (h.star !== star) return;
        (groups[h.heroId] = groups[h.heroId] || []).push(h);
      });
      for (const key in groups) {
        const arr = groups[key];
        if (arr.length < 2) continue;
        const a = arr[0], b = arr[1];
        a.star = star + 1;
        if (b.weapon) {
          const w = getWeapon(b.weapon);
          if (w) w.attachedTo = null;
        }
        S.heroes = S.heroes.filter(h => h.uid !== b.uid);
        S.slots = S.slots.map(x => (x === b.uid ? null : x));
        compactSlots();
        did = true;
        merged = true;
        break;
      }
      if (did) break;
    }
    if (!did) break;
  }
  return merged;
}

/* =========================================================
   商店
   ========================================================= */

let _shopOffers = [];

function shopPrice() {
  const i = Math.min(S.cmdPool.length, CONFIG.commandPrice.length - 1);
  return CONFIG.commandPrice[i];
}

function slotNextPrice() {
  const n = Math.max(0, S.slotExtra || 0);
  const base = CONFIG.slotPriceBase + CONFIG.slotPriceStep * n;
  const keep = CONFIG.slotPriceKeep || 0;
  if (n < keep) return base;                       /* 前 keep 次：保持原线性价（普通玩家无感） */
  return Math.round(base * Math.pow(CONFIG.slotPriceGrow || 1, n - keep + 1));
}
function cmdNextPrice() {
  const i = Math.min(S.cmdExtra, CONFIG.cmdExtraPrice.length - 1);
  return CONFIG.cmdExtraPrice[i];
}

function buySlotExtra() {
  if (S.slotExtra >= CONFIG.slotExtraMax) return;
  const price = slotNextPrice();
  if (S.gold < price) return;
  S.gold -= price;
  S.slotExtra++;
  SFX.powerUp();
  renderShop();
  render();
  toast('卡槽上限 +1 → ' + (CONFIG.slotMax + S.slotExtra) + ' 格');
}

function buyCmdExtra() {
  if (S.cmdExtra >= CONFIG.cmdExtraMax) return;
  const price = cmdNextPrice();
  if (S.gold < price) return;
  S.gold -= price;
  S.cmdExtra++;
  SFX.powerUp();
  renderShop();
  render();
  toast('军令上限 +1 → ' + cmdMax() + ' 条');
}

function renderShop() {
  const price = shopPrice();
  let html = '<h2>军 令 商 店</h2>' + goldBarHTML() +
    '<div class="sub">军令库 ' + S.cmdPool.length + ' 条 · 上阵 ' +
    S.commands.length + '/' + cmdMax() + '</div>';

  if (_shopOffers.length === 0) {
    html += '<div class="sub">这里的货已经买空了</div>';
  } else {
    _shopOffers.forEach(id => {
      const c = COMMAND_MAP[id];
      const can = S.gold >= price;
      html += '<div class="shop-item"><div class="info"><b>' + c.name + '</b>' +
        '<span>' + c.desc + '</span></div>' +
        '<div class="price">' + price + ' 金</div>' +
        '<button ' + (can ? '' : 'disabled') +
        ' onclick="buyCommand(\'' + id + '\')">购买</button></div>';
    });
  }

  /* —— 招募（偶尔救急，整局限次）—— */
  const left = recruitLeft();
  const canR = left > 0;
  html += '<div class="codex-group" style="margin-top:2px">招 募（本局还剩 ' + left + ' / ' +
    (CONFIG.recruitMax || 0) + ' 次）</div>';

  const hc = CONFIG.recruitHeroCost, cc2 = CONFIG.recruitCampCost, wc = CONFIG.recruitWeaponCost;

  html += '<div class="shop-item' + (canR ? '' : '') + '">' +
    '<div class="info"><b>🎲 随机武将</b>' +
    '<span>任意阵营 · 抽到已有的同名会自动升星</span></div>' +
    '<div class="price">' + hc + ' 金</div>' +
    '<button ' + (canR && S.gold >= hc ? '' : 'disabled') +
    ' onclick="buyRecruitHero(\'\')">招募</button></div>';

  html += '<div class="shop-item">' +
    '<div class="info"><b>🎲 指定阵营</b>' +
    '<span>从你选的阵营里抽一个</span></div>' +
    '<div class="price">' + cc2 + ' 金</div>' +
    ['shu', 'wei', 'wu'].map(cp =>
      '<button class="mini" ' + (canR && S.gold >= cc2 ? '' : 'disabled') +
      ' onclick="buyRecruitHero(\'' + cp + '\')">' +
      (CAMPS[cp] ? CAMPS[cp].name : cp) + '</button>').join('') +
    '</div>';

  html += '<div class="shop-item">' +
    '<div class="info"><b>🗡 随机武器</b>' +
    '<span>只从你场上有的兵种里抽</span></div>' +
    '<div class="price">' + wc + ' 金</div>' +
    '<button ' + (canR && S.gold >= wc ? '' : 'disabled') +
    ' onclick="buyRecruitWeapon()">招募</button></div>';

  /* —— 金币突破（后期出口）—— */
  const cmdMaxed = S.cmdExtra >= CONFIG.cmdExtraMax;
  const sp2 = slotNextPrice();
  const cp2 = cmdNextPrice();

  html += '<div class="bl-title" style="margin-top:14px">突 破 · 本局永久</div>';

  html += '<div class="shop-item"><div class="info"><b>卡槽 +1</b>' +
    '<span>当前 ' + (CONFIG.slotMax + S.slotExtra) + ' 格 · <b style="color:#7ee07e">无上限</b>' +
    '（每突破一次价格 +' + CONFIG.slotPriceStep + ' 金）</span></div>' +
    '<div class="price">' + sp2 + ' 金</div>' +
    '<button ' + (S.gold >= sp2 ? '' : 'disabled') +
    ' onclick="buySlotExtra()">突破</button></div>';

  html += '<div class="shop-item"><div class="info"><b>军令上限 +1</b>' +
    '<span>当前 ' + cmdMax() + ' 条' +
    (cmdMaxed ? '（已满）' : '，可再突破 ' + (CONFIG.cmdExtraMax - S.cmdExtra) + ' 次') +
    '</span></div>' +
    '<div class="price">' + (cmdMaxed ? '—' : cp2 + ' 金') + '</div>' +
    '<button ' + (!cmdMaxed && S.gold >= cp2 ? '' : 'disabled') +
    ' onclick="buyCmdExtra()">突破</button></div>';

  html += '<div class="sub" style="margin-top:12px">买到的军令进入【军令库】，随时可以调整上阵</div>';
  html += '<div class="btn-row">' +
    '<button class="btn ghost" onclick="suspendModal(\'shop\')">← 查看队伍</button>' +
    '<button class="btn ghost" onclick="resolveModal(1)">离开商店</button></div>';
  openModal(html);
}

function buyCommand(id) {
  const price = shopPrice();
  if (S.gold < price) return;
  if (S.cmdPool.includes(id)) return;
  S.gold -= price;
  S.cmdPool.push(id);
  SFX.coin();
  // 有空位就自动上阵，满了就留在库里
  if (S.commands.length < cmdMax()) S.commands.push(id);
  else toast('军令库已收录，可点「调整上阵」换上');

  _shopOffers = _shopOffers.filter(x => x !== id);
  renderShop();
  render();
}

/* ---------- 商店招募（偶尔救急：整局最多 CONFIG.recruitMax 次） ---------- */
function recruitLeft() {
  return Math.max(0, (CONFIG.recruitMax || 0) - (S.recruits || 0));
}

function recruitHeroPool(camp) {
  let pool = unlockedHeroes();
  if (camp) pool = pool.filter(h => h.camp === camp);
  return pool;
}

function recruitWeaponPool() {
  const roles = {};
  S.heroes.forEach(h => {
    const d = HERO_MAP[h.heroId];
    if (d) roles[d.type] = 1;
  });
  const pool = WEAPONS.filter(w => roles[w.role]);
  return pool.length ? pool : WEAPONS;   /* 兜底：一个都不匹配时退回全池 */
}

function buyRecruitHero(camp) {
  if (recruitLeft() <= 0) { toast('本局招募次数已用完'); return; }
  const cost = camp ? CONFIG.recruitCampCost : CONFIG.recruitHeroCost;
  if (S.gold < cost) { toast('金币不足'); return; }
  const pool = recruitHeroPool(camp);
  if (!pool.length) { toast('没有可招募的武将'); return; }

  const def = pick(pool);
  S.gold -= cost;
  S.recruits = (S.recruits || 0) + 1;
  S.heroes.push(makeHero(def.id, 1));
  if (!S.rwd) S.rwd = { noHero: 0, recent: [] };
  S.rwd.noHero = 0;

  const upgraded = autoStarUp();     /* 抽到已有的同名 → 直接升星 */
  SFX.coin();
  toast('招募到 ' + def.name + (upgraded ? ' → 升星！' : ''));
  if (upgraded) SFX.star();
  renderShop();
  render();
}

function buyRecruitWeapon() {
  if (recruitLeft() <= 0) { toast('本局招募次数已用完'); return; }
  const cost = CONFIG.recruitWeaponCost;
  if (S.gold < cost) { toast('金币不足'); return; }
  const pool = recruitWeaponPool();
  if (!pool.length) { toast('没有可招募的武器'); return; }

  const def = pick(pool);
  S.gold -= cost;
  S.recruits = (S.recruits || 0) + 1;
  S.weapons.push(makeWeapon(def.id));
  SFX.coin();
  toast('招募到武器：' + def.name);
  renderShop();
  render();
}

async function openShop() {
  const pool = COMMANDS.filter(c => !S.cmdPool.includes(c.id) && cmdAvailable(c));
  _shopOffers = [];
  const copy = pool.slice();
  while (_shopOffers.length < 3 && copy.length > 0) {
    const i = Math.floor(Math.random() * copy.length);
    _shopOffers.push(copy.splice(i, 1)[0].id);
  }
  renderShop();
  await new Promise(res => { _resolver = res; });
  closeModal();
}

function openCmdModal() {

}

function renderCmdModal() {
  if (S.cmdPool.length === 0) {
    openModal('<h2>军令库</h2><div class="sub">还没有军令（每 3 波开一次商店）</div>' +
      '<div class="btn-row"><button class="btn ghost" onclick="closeModal()">关闭</button></div>');
    return;
  }

  let html = '<h2>军令配置</h2><div class="sub">军令库 ' + S.cmdPool.length +
    ' 条 · 上阵 <b style="color:#e6c07b">' + S.commands.length + '/' +
    cmdMax() + '</b> · 点按钮切换上阵</div>';

  /* —— 熔铸区 —— */
  const cats = [['team', '军·总纲'], ['pos', '阵·总纲'], ['enemy', '谋·总纲'], ['scale', '势·总纲']];
  let fuseHtml = '';
  cats.forEach(c => {
    const cat = c[0], totemId = 'totem_' + cat;
    const totem = COMMAND_MAP[totemId];
    if (!totem) return;                       /* 兜底：总纲定义缺失时不要整页崩掉 */
    const list = S.cmdPool.filter(id => {
      const cc = COMMAND_MAP[id];
      return cc && !cc.isTotem && !cc.noFuse && cmdCat(cc.kind) === cat;
    });
    const has = S.cmdPool.indexOf(totemId) >= 0;
    const ready = list.length >= CONFIG.fuseNeed && !has && S.gold >= CONFIG.fuseCost;
    /* 说清"为什么按不了"，而不是给一个灰按钮让玩家干瞪眼 */
    const why = has ? '' : (
      list.length < CONFIG.fuseNeed
        ? '　<b style="color:#9aa2c0">还差 ' + (CONFIG.fuseNeed - list.length) + ' 条</b>'
        : (S.gold < CONFIG.fuseCost ? '　<b style="color:#d9534f">金币不足</b>' : '')
    );

    fuseHtml += '<div class="shop-item' + (ready ? ' on-field' : '') + '">' +
      '<div class="info"><b>' + totem.name + '</b>' +
      '<span>' + (has
        ? '✓ 已熔铸'
        : '同类 ' + list.length + '/' + CONFIG.fuseNeed + ' · ' + totem.desc + why) +
      '</span></div>' +
      '<button ' + (ready ? '' : 'disabled') +
      ' onclick="doFuse(\'' + cat + '\')">熔铸 ' + CONFIG.fuseCost + '金</button></div>';
  });

  html += '<div class="codex-group" style="margin-top:2px">熔 铸（3 条同类型 → 1 张总纲，不可逆）</div>' + fuseHtml;
  html += '<div class="codex-group">军 令 库</div>';

  S.cmdPool.forEach(id => {
    const c = COMMAND_MAP[id];
    if (!c) return;                          /* 兜底：老存档里的未知军令直接跳过 */
    const on = S.commands.includes(id);
    html += '<div class="shop-item' + (on ? ' on-field' : '') + '">' +
      '<div class="info"><b>' + c.name + (c.isTotem ? '　<span style="color:#ffd479">总纲</span>' : '') + '</b>' +
      '<span>' + c.desc + '</span></div>' +
      '<button onclick="toggleCmd(\'' + id + '\')">' + (on ? '下阵' : '上阵') + '</button></div>';
  });

  html += '<div class="btn-row"><button class="btn" onclick="closeModal()">完成</button></div>';
  openModal(html);
}

/* ---------- 熔铸 ---------- */
function fuseCandidates(cat) {
  return S.cmdPool.filter(id => {
    const cc = COMMAND_MAP[id];
    return cc && !cc.isTotem && !cc.noFuse && cmdCat(cc.kind) === cat;
  });
}

function doFuse(cat) {
  const totemId = 'totem_' + cat;
  const list = fuseCandidates(cat);
  if (S.cmdPool.indexOf(totemId) >= 0) { toast('这一类的总纲已经熔铸过了'); return; }
  if (list.length < CONFIG.fuseNeed) { toast('同类军令不足 ' + CONFIG.fuseNeed + ' 条'); return; }
  if (S.gold < CONFIG.fuseCost) { toast('金币不足'); return; }

  const used = list.slice(0, CONFIG.fuseNeed);
  S.gold -= CONFIG.fuseCost;

  S.cmdPool = S.cmdPool.filter(id => used.indexOf(id) < 0);
  S.commands = S.commands.filter(id => used.indexOf(id) < 0);
  S.cmdPool.push(totemId);
  if (S.commands.length < cmdMax()) S.commands.push(totemId);

  /* 去掉震屏与合体动画：改为一条明确的成功横幅（2 秒后消失） */
  SFX.star();

  render();
  renderCmdModal();

  const modal = $('modal');
  if (modal) {
    const banner = document.createElement('div');
    banner.className = 'fuse-done';
    banner.innerHTML = '✓ 熔铸成功：<b>' + COMMAND_MAP[totemId].name + '</b>' +
      '<span>已占用 1 个上阵格 · 3 条同类军令已消耗（不可逆）</span>';
    modal.insertBefore(banner, modal.firstChild);
    setTimeout(() => banner.remove(), 2200);
  }
  toast('熔铸完成：' + COMMAND_MAP[totemId].name);
}

/* ⚠ 已删除 playFuseFx()：v0.32 就决定去掉合体动画（看不清），
   但函数一直留着没删，导致后来重新调用时动画又出现了。
   现在连函数带样式一起清掉，不会再回来。 */

function toggleCmd(id) {
  if (S.commands.includes(id)) {
    S.commands = S.commands.filter(x => x !== id);
  } else {
    if (S.commands.length >= cmdMax()) {
      toast('最多上阵 ' + cmdMax() + ' 条，先下阵一条');
      return;
    }
    S.commands.push(id);
  }
  renderCmdModal();
  render();
}
