<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三国 · 无尽战纪</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 开始界面 ============ -->
<div class="start-screen" id="startScreen">
  <div class="ss-inner">
    <div class="ss-title">三国 · 无尽战纪</div>
    <div class="ss-ver"><span id="ssVer"></span></div>

    <div class="ss-stage">
      <!-- 猛将：大刀 -->
      <div class="ss-fig" data-camp="meng">
        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>
            <line x1="30" y1="24" x2="30" y2="56"/>
            <line x1="30" y1="33" x2="13" y2="46"/>
            <line x1="30" y1="33" x2="47" y2="46"/>
            <line x1="30" y1="56" x2="17" y2="84"/>
            <line x1="30" y1="56" x2="43" y2="84"/>
          </g>
          <g class="acc">
            <line x1="47" y1="46" x2="55" y2="20"/>
            <path d="M52 6 L62 18 L50 24 Z"/>
          </g>
        </svg>
        <div class="ss-name">猛将</div>
      </div>

      <!-- 骁将：弓 -->
      <div class="ss-fig" data-camp="xiao">
        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>
            <line x1="30" y1="24" x2="30" y2="56"/>
            <line x1="30" y1="33" x2="13" y2="46"/>
            <line x1="30" y1="33" x2="47" y2="46"/>
            <line x1="30" y1="56" x2="17" y2="84"/>
            <line x1="30" y1="56" x2="43" y2="84"/>
          </g>
          <g class="acc">
            <path d="M13 28 Q2 46 13 64"/>
            <line x1="13" y1="28" x2="13" y2="64"/>
            <line x1="13" y1="46" x2="25" y2="46"/>
          </g>
        </svg>
        <div class="ss-name">骁将</div>
      </div>

      <!-- 谋士：羽扇 + 纶巾 -->
      <div class="ss-fig" data-camp="mou">
        <div class="ss-pop"></div>
        <svg class="ss-svg" viewBox="0 0 64 92" aria-hidden="true">
          <g class="body">
            <circle cx="30" cy="15" r="9"/>
            <line x1="30" y1="24" x2="30" y2="56"/>
            <line x1="30" y1="33" x2="13" y2="46"/>
            <line x1="30" y1="33" x2="47" y2="46"/>
            <line x1="30" y1="56" x2="17" y2="84"/>
            <line x1="30" y1="56" x2="43" y2="84"/>
          </g>
          <g class="acc">
            <path d="M30 6 Q25 -1 21 3"/>
            <path d="M30 6 Q35 -1 39 3"/>
          </g>
          <g class="acc">
            <path d="M46 42 Q59 36 59 51 Q46 55 46 42 Z"/>
            <line x1="41" y1="49" x2="46" y2="42"/>
          </g>
        </svg>
        <div class="ss-name">谋士</div>
      </div>

      <div class="ss-calc" id="ssCalc"></div>
    </div>

    <div class="ss-hint" id="ssHint">↓ 点「开始游戏」出发</div>

    <div class="ss-btns">
      <button class="btn ss-main" id="btnStart">开 始 游 戏</button>
      <button class="btn ghost ss-cont hidden" id="btnResume">继续上次（第 <b id="ssWave">1</b> 波）</button>
      <button class="btn ghost ss-cont" id="ssSandbox">🧪 演 武 场</button>
    </div>

    <div class="ss-sub">
      <button class="help-btn" id="ssCodex">图鉴</button>
      <button class="help-btn" id="ssLog">日志<span class="ss-dot hidden" id="ssLogDot"></span></button>
      <button class="help-btn" id="ssAchv">成就</button>
      <button class="help-btn" id="ssHelp">玩法</button>
      <button class="help-btn" id="ssSound">🔊 音效</button>
    </div>

    <div class="ss-tip" id="ssTip"></div>
  </div>
</div>

<div class="topbar">
  <div class="stat">第 <b id="uiWave">1</b> 波</div>
  <div class="stat">金币 <b id="uiGold">0</b></div>
  <div class="stat">卡槽 <b id="uiSlots">0/3</b></div>
  <button class="lv-chip" id="uiLevel" title="战功 · 点击查看详情">Lv.1</button>
  <button class="help-btn" id="btnBack" title="回到开始界面">← 返回</button>
  <button class="help-btn" id="btnHelp">引导</button>
  <button class="help-btn" id="btnSound">🔊</button>
  <input class="vol-slider" id="volSlider" type="range" min="0" max="100" value="55" title="音量">
  <button class="help-btn" id="btnSpeed">⏩ 加速</button>
  <button class="help-btn" id="btnCodex">图鉴</button>
  <button class="help-btn" id="btnLog">日志</button>
  <button class="help-btn" id="btnPrevToggle">👁 预估</button>
  <div class="title">三国 · 无尽战纪 <span id="uiVer"></span></div>
</div>

<section class="enemy" id="enemyBox">
  <div class="enemy-top">
    <div class="enemy-name" id="uiEnemyName">黄巾贼</div>
    <div class="enemy-tag" id="uiEnemyTag">护甲 0</div>
  </div>
  <div class="hpbar"><i id="uiHpBar"></i></div>
  <div class="enemy-hpnum" id="uiHpNum">25 / 25</div>
  <div class="dmg-pop" id="dmgPop"></div>
</section>

<main>
  <div class="row-label">出战序列（点牌库上阵 · <b class="hl">点两张牌 = 移到那里</b> · ← → 挪一格）
    <button class="mini-btn" id="btnSlotView">🔍 紧凑</button>
    <button class="mini-btn hidden" id="btnCompact">⇤ 补齐空位</button>
    <button class="mini-btn" id="btnClearSlots">全部下阵</button>
    <button class="mini-btn hidden" id="btnSandboxCfg">🧪 演武配置</button>
  </div>
  <div class="slot-rows" id="slotRow"></div>
  <div class="pick-hint hidden" id="pickHint"></div>

  <div class="attack-bar">
    <div class="atk-preview" id="atkPreview"></div>
    <button class="btn" id="btnAttack">出 击</button>
  </div>

  <div class="battle-log" id="battleLog"></div>

  <div class="row-label">牌库</div>
  <div class="hand-row" id="handRow"></div>

  <div class="row-label">武器库（在卡牌上装备）
    <button class="mini-btn" id="btnUnequipAll">全部卸下</button>
  </div>
  <div class="weapon-row" id="weaponRow"></div>

  <div class="row-label">军令 <span id="uiCmdCount" style="color:#7b819c">0/6</span>
    <button class="mini-btn" id="btnCmdAdjust">调整上阵</button>
  </div>
  <div class="cmd-row" id="cmdRow"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div id="screenFlash"></div>
<div id="bossIntro" class="boss-intro hidden">
  <div class="bi-seal" id="biSeal"></div>
  <div class="bi-sub" id="biSub"></div>
</div>
<div id="floatLayer"></div>

<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
